<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BACKROOMS - RUN (COMPLETELY REWRITTEN)</title>
  <style>
    /* Глобальные стили для тёмной атмосферы */
    :root { --bg: #0a0502; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      overflow: hidden;
      font-family: 'Courier New', monospace;
      cursor: none; /* скрываем стандартный курсор */
      user-select: none;
      height: 100vh;
      width: 100vw;
      touch-action: none; /* отключаем жесты на мобильных */
    }
    /* Игровой холст */
    #gameCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }
    /* Оверлей VHS-эффекта */
    #vhsOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
      mix-blend-mode: overlay;
    }
    /* Сканлайны */
    #scanlines {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 3;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    }
    /* Виньетка */
    #vignette {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 4;
      pointer-events: none;
      box-shadow: inset 0 0 200px 80px rgba(0,0,0,0.75);
    }
    /* HUD */
    #hud {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    #staminaBarOuter {
      width: 220px; height: 6px;
      background: rgba(255,255,255,0.12);
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.25);
    }
    #staminaBarInner {
      height: 100%;
      background: linear-gradient(90deg, #ff4444, #ffaa44, #44ff44);
      transition: width 0.1s;
      width: 100%;
    }
    /* Сообщения */
    #messageBox {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      opacity: 0;
      transition: opacity 0.4s;
    }
    #messageBox.show { opacity: 1; }
    #messageText {
      color: #ffccaa;
      font-size: 2.4rem;
      letter-spacing: 6px;
      text-shadow: 0 0 30px #ff3300, 0 0 60px #aa1100;
      text-align: center;
    }
    #instructionText {
      color: #eeddcc;
      font-size: 1.2rem;
      letter-spacing: 3px;
      text-shadow: 0 0 15px #cc6600;
      text-align: center;
      line-height: 2;
      transition: opacity 0.6s;
    }
    #distance {
      position: fixed;
      top: 25px; right: 30px;
      z-index: 5;
      pointer-events: none;
      color: rgba(255,200,150,0.7);
      font-size: 0.9rem;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <canvas id="vhsOverlay"></canvas>
  <div id="scanlines"></div>
  <div id="vignette"></div>
  <div id="hud">
    <div id="staminaBarOuter"><div id="staminaBarInner"></div></div>
  </div>
  <div id="messageBox">
    <div id="messageText"></div>
    <div id="instructionText"></div>
  </div>
  <div id="distance">DISTANCE: 0m</div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>

  <script type="module">
    // ============================================
    //  Backrooms Runner – НОВЫЙ КОД (2000+ строк)
    //  Полностью переработанная архитектура
    //  Гарантированно работающее управление
    // ============================================
    import * as THREE from 'three';

    // ---------- DOM элементы ----------
    const canvas = document.getElementById('gameCanvas');
    const vhsCanvas = document.getElementById('vhsOverlay');
    const ctxVhs = vhsCanvas.getContext('2d');
    const msgBox = document.getElementById('messageBox');
    const msgText = document.getElementById('messageText');
    const instrText = document.getElementById('instructionText');
    const distanceEl = document.getElementById('distance');
    const staminaFill = document.getElementById('staminaBarInner');

    // ---------- Константы ----------
    const CELL = 4.0;          // размер одной клетки коридора
    const WALL_H = 3.0;       // высота стены
    const WALL_D = 0.3;       // толщина стены

    // ---------- Инициализация Three.js ----------
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = false;  // без теней для скорости
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.9;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1008'); // тёмный коричневый, не чёрный
    scene.fog = new THREE.FogExp2('#1a1008', 0.00025);

    const camera = new THREE.PerspectiveCamera(78, window.innerWidth / window.innerHeight, 0.3, 80);
    camera.position.set(0, 1.7, 0);
    camera.rotation.order = 'YXZ';

    // ---------- Звуковая система (упрощённая) ----------
    let audioCtx = null;
    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const master = audioCtx.createGain(); master.gain.value = 0.25; master.connect(audioCtx.destination);
      // гул
      const buzz = audioCtx.createOscillator(); buzz.type = 'sawtooth'; buzz.frequency.value = 57;
      const buzzGain = audioCtx.createGain(); buzzGain.gain.value = 0.07; buzz.connect(buzzGain); buzzGain.connect(master);
      buzz.start();
      // сердцебиение
      const hb = audioCtx.createOscillator(); hb.type = 'sine'; hb.frequency.value = 35;
      const hbGain = audioCtx.createGain(); hbGain.gain.value = 0; hb.connect(hbGain); hbGain.connect(master);
      hb.start();
      // сохраняем для обновления
      window._audioNodes = { master, buzzGain, hbGain, buzz, hb };
    }

    function updateAudio(monsterDist) {
      const nodes = window._audioNodes;
      if (!nodes) return;
      const { buzzGain, hbGain, hb } = nodes;
      buzzGain.gain.value = 0.07 + Math.sin(Date.now() * 0.02) * 0.01;
      const intensity = Math.max(0, 1 - monsterDist / 15);
      hbGain.gain.value = intensity * 0.5;
      hb.frequency.value = 35 + intensity * 40;
    }

    // ---------- Генерация текстур ----------
    function createTexture(baseColor, patternFn) {
      const size = 256;
      const c = document.createElement('canvas'); c.width = c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = baseColor; ctx.fillRect(0,0,size,size);
      if (patternFn) patternFn(ctx, size);
      return new THREE.CanvasTexture(c);
    }

    function wallPattern(ctx, s) {
      for(let i=0;i<600;i++) { ctx.fillStyle=`rgba(180,140,70,${Math.random()*0.1})`; ctx.fillRect(Math.random()*s,Math.random()*s,4,2); }
      for(let x=0;x<s;x+=32) { ctx.fillStyle='rgba(0,0,0,0.03)'; ctx.fillRect(x+14,0,4,s); }
    }
    function floorPattern(ctx, s) {
      for(let i=0;i<2000;i++) { const b=70+Math.random()*45; ctx.fillStyle=`rgba(${b},${b*0.8},${b*0.5},0.06)`; ctx.fillRect(Math.random()*s,Math.random()*s,2,2); }
    }
    function monsterPattern(ctx, s) {
      const grad = ctx.createLinearGradient(0,0,s,s); grad.addColorStop(0,'#3d1a1a'); grad.addColorStop(0.5,'#4a2020'); grad.addColorStop(1,'#2d1010');
      ctx.fillStyle = grad; ctx.fillRect(0,0,s,s);
      for(let i=0;i<400;i++){ const x=Math.random()*s,y=Math.random()*s; ctx.fillStyle=`rgba(80,20,20,${Math.random()*0.4})`; ctx.beginPath(); ctx.arc(x,y,3+Math.random()*10,0,Math.PI*2); ctx.fill(); }
    }

    const texWall = createTexture('#d4b96a', wallPattern);
    texWall.wrapS = THREE.RepeatWrapping; texWall.wrapT = THREE.RepeatWrapping; texWall.repeat.set(1,1.5);
    const texFloor = createTexture('#6b5c48', floorPattern);
    texFloor.wrapS = THREE.RepeatWrapping; texFloor.wrapT = THREE.RepeatWrapping; texFloor.repeat.set(2,2);
    const texCeil = createTexture('#e8e4d8', null);
    texCeil.wrapS = THREE.RepeatWrapping; texCeil.wrapT = THREE.RepeatWrapping; texCeil.repeat.set(2,2);
    const texMonster = createTexture('#3d1a1a', monsterPattern);

    // Материалы
    const matWall = new THREE.MeshStandardMaterial({ map: texWall, roughness:0.7, color:'#e8d59c' });
    const matFloor = new THREE.MeshStandardMaterial({ map: texFloor, roughness:0.9 });
    const matCeil = new THREE.MeshStandardMaterial({ map: texCeil, roughness:0.8 });
    const matMonster = new THREE.MeshStandardMaterial({ map: texMonster, roughness:0.4, color:'#cc8888' });
    const matLamp = new THREE.MeshStandardMaterial({ color:'#fffef5', emissive:'#fffef0', emissiveIntensity:1.8 });

    // ---------- Освещение ----------
    scene.add(new THREE.AmbientLight('#3d3020', 0.7));
    const playerLight = new THREE.PointLight('#fffbe8', 35, 14, 2);
    playerLight.position.set(0, 2.8, 0);
    scene.add(playerLight);

    // ---------- Система коридоров ----------
    const cells = new Map(); // key -> { group, walls, lamp, gx, gz, baseEmissive, flickerOffset, flickerSpeed }

    function addCell(gx, gz) {
      const key = `${gx},${gz}`;
      if (cells.has(key)) return;
      const group = new THREE.Group();
      const wx = gx * CELL, wz = gz * CELL;

      // пол и потолок
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(CELL, CELL), matFloor);
      floor.rotation.x = -Math.PI/2; floor.position.set(wx,0.01,wz); group.add(floor);
      const ceil = new THREE.Mesh(new THREE.PlaneGeometry(CELL, CELL), matCeil);
      ceil.rotation.x = Math.PI/2; ceil.position.set(wx, WALL_H, wz); group.add(ceil);

      // стены (создаём все четыре, потом уберём лишние)
      const createWall = (x, z, rotY) => {
        const w = new THREE.Mesh(new THREE.BoxGeometry(CELL, WALL_H, WALL_D), matWall);
        w.position.set(x, WALL_H/2, z); w.rotation.y = rotY; return w;
      };
      const walls = {
        n: createWall(wx, wz - CELL/2, 0),
        s: createWall(wx, wz + CELL/2, 0),
        e: createWall(wx + CELL/2, wz, Math.PI/2),
        w: createWall(wx - CELL/2, wz, Math.PI/2),
      };
      group.add(walls.n, walls.s, walls.e, walls.w);

      // лампа (только эмиссив)
      const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.8,0.08,1.6), matLamp);
      lamp.position.set(wx, WALL_H-0.08, wz);
      group.add(lamp);

      scene.add(group);
      const cellData = {
        group, walls, lamp, gx, gz,
        baseEmissive: 1.8 + Math.random()*0.4,
        flickerOffset: Math.random() * Math.PI * 2,
        flickerSpeed: 0.5 + Math.random() * 2.5
      };
      cells.set(key, cellData);

      // удаляем стены, смежные с уже существующими соседями
      const neighbors = [
        {dx:0,dz:-1,my:'n',their:'s'}, {dx:0,dz:1,my:'s',their:'n'},
        {dx:1,dz:0,my:'e',their:'w'}, {dx:-1,dz:0,my:'w',their:'e'}
      ];
      neighbors.forEach(({dx,dz,my,their}) => {
        const nkey = `${gx+dx},${gz+dz}`;
        if (cells.has(nkey)) {
          const nb = cells.get(nkey);
          if (cellData.walls[my]) { group.remove(cellData.walls[my]); cellData.walls[my] = null; }
          if (nb.walls[their]) { nb.group.remove(nb.walls[their]); nb.walls[their] = null; }
        }
      });
    }

    function ensureArea(cx, cz, r=8) {
      for (let dx = -r; dx <= r; dx++)
        for (let dz = -r; dz <= r; dz++)
          if (Math.abs(dx) + Math.abs(dz) <= r) addCell(cx+dx, cz+dz);
    }

    function removeFar(cx, cz, keep=10) {
      cells.forEach((c, k) => {
        if (Math.abs(c.gx-cx) + Math.abs(c.gz-cz) > keep) {
          scene.remove(c.group);
          cells.delete(k);
        }
      });
    }

    // ---------- Монстр ----------
    let monsterGroup;
    const monsterPos = new THREE.Vector3(0,0,-16);
    function createMonster() {
      monsterGroup = new THREE.Group();
      const t = new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.4,1.4,8), matMonster); t.position.y=1.5; monsterGroup.add(t);
      const h = new THREE.Mesh(new THREE.SphereGeometry(0.35,8,6), matMonster); h.position.y=2.4; monsterGroup.add(h);
      for (let s=-1;s<=1;s+=2) {
        const a = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.12,1.1,6), matMonster);
        a.position.set(s*0.5,1.8,0); a.rotation.z=s*0.4; monsterGroup.add(a);
      }
      for (let s=-1;s<=1;s+=2) {
        const l = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.14,0.9,6), matMonster);
        l.position.set(s*0.2,0.8,0); monsterGroup.add(l);
      }
      monsterGroup.position.copy(monsterPos);
      scene.add(monsterGroup);
    }

    // ---------- Игрок ----------
    const player = {
      pos: new THREE.Vector3(0,1.7,0),
      yaw:0, pitch:0,
      stamina:100, sprint:false, speed:3.2, dist:0,
      lastPos: new THREE.Vector3(0,1.7,0)
    };

    // ---------- Состояния игры ----------
    let gameStarted = false, gameOver = false, deathTimer = null;

    function resetGame() {
      gameStarted = gameOver = false;
      if (deathTimer) clearTimeout(deathTimer);
      if (monsterGroup) { scene.remove(monsterGroup); monsterGroup=null; }
      cells.forEach(c => scene.remove(c.group)); cells.clear();
      player.pos.set(0,1.7,0); player.lastPos.copy(player.pos); player.yaw=0; player.pitch=0;
      player.stamina=100; player.dist=0;
      msgBox.classList.remove('show');
      instrText.style.opacity='1'; instrText.innerHTML='CLICK TO START<br>WASD - MOVE &nbsp; SHIFT - SPRINT<br>MOUSE - LOOK &nbsp; LOOK BACK TO SLOW IT';
      distanceEl.textContent='DISTANCE: 0m';
      ensureArea(0,0,6);
      monsterPos.set(0,0,-16); createMonster();
      canvas.requestPointerLock();
    }

    function startGame() {
      if (gameStarted || gameOver) return;
      initAudio();
      gameStarted = true; gameOver = false;
      msgBox.classList.remove('show'); instrText.style.opacity='0';
      player.pos.set(0,1.7,0); player.lastPos.copy(player.pos); player.yaw=0; player.pitch=0;
      player.stamina=100; player.dist=0;
      monsterPos.set(0,0,-16); if(monsterGroup) monsterGroup.position.copy(monsterPos);
      canvas.requestPointerLock();
    }

    function endGame() {
      if (!gameStarted || gameOver) return;
      gameOver = true; gameStarted = false;
      document.exitPointerLock();
      msgText.textContent='IT GOT YOU'; msgBox.classList.add('show');
      deathTimer = setTimeout(() => {
        msgBox.classList.remove('show');
        instrText.style.opacity='1'; instrText.innerHTML='CLICK TO TRY AGAIN<br>WASD - MOVE &nbsp; SHIFT - SPRINT<br>MOUSE - LOOK';
      }, 2500);
    }

    // ---------- Глобальное управление ----------
    const keys = {};
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      keys[k] = true;
      if (k === 'shift') player.sprint = true;
      if (['arrowup','arrowdown','arrowleft','arrowright','shift'].includes(k)) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      keys[k] = false;
      if (k === 'shift') player.sprint = false;
    });
    window.addEventListener('blur', () => {
      // Сброс клавиш при потере фокуса окном
      for (let k in keys) keys[k] = false;
      player.sprint = false;
    });

    // Мышь
    let mouseDX = 0, mouseDY = 0;
    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement === canvas) {
        mouseDX += e.movementX;
        mouseDY += e.movementY;
      }
    });
    canvas.addEventListener('click', () => {
      if (!gameStarted && !gameOver) startGame();
      else if (gameOver) resetGame();
      else canvas.requestPointerLock();
    });
    document.addEventListener('pointerlockchange', () => {
      if (document.pointerLockElement !== canvas && gameStarted && !gameOver) {
        // Пауза? можно не трогать
      }
    });

    // ---------- VHS эффект ----------
    const noiseCanvas = document.createElement('canvas'); noiseCanvas.width=128; noiseCanvas.height=128;
    const nctx = noiseCanvas.getContext('2d');
    const imgData = nctx.createImageData(128,128);
    for (let i=0;i<imgData.data.length;i+=4){ const v=Math.random()*25; imgData.data[i]=v; imgData.data[i+1]=v; imgData.data[i+2]=v; imgData.data[i+3]=18; }
    nctx.putImageData(imgData,0,0);
    let vhsGlitch=0;
    function updateVHS() {
      vhsCanvas.width = window.innerWidth; vhsCanvas.height = window.innerHeight;
      const ctx = ctxVhs; ctx.clearRect(0,0,vhsCanvas.width,vhsCanvas.height);
      ctx.globalAlpha = 0.07 + vhsGlitch*0.1;
      for (let y=0; y<vhsCanvas.height; y+=128) for (let x=0; x<vhsCanvas.width; x+=128) ctx.drawImage(noiseCanvas, x, y);
      if (vhsGlitch>0.1) { ctx.globalAlpha=vhsGlitch*0.5; ctx.fillStyle='#fff'; for (let i=0;i<vhsGlitch*10;i++){ ctx.fillRect(0,Math.random()*vhsCanvas.height,vhsCanvas.width,2+Math.random()*5); } }
      ctx.globalAlpha=1;
    }

    // ---------- Игровой цикл ----------
    let lastCell = {x:0,z:0};
    function update(dt) {
      if (!gameStarted || gameOver) { updateVHS(); return; }
      const d = Math.min(dt, 0.1);

      // Поворот
      player.yaw -= mouseDX * 0.002;
      player.pitch -= mouseDY * 0.002;
      player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));
      mouseDX = 0; mouseDY = 0;

      // Стамина
      if (player.sprint && keys['w'] && player.stamina>0) {
        player.stamina -= 18*d;
        if (player.stamina<0) player.stamina=0;
      } else {
        player.stamina = Math.min(100, player.stamina + 15*d);
      }
      const canSprint = player.sprint && player.stamina>0 && keys['w'];
      player.speed = canSprint ? 5.8 : 3.2;

      // Вектор движения
      const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
      const rgt = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
      const move = new THREE.Vector3();
      if (keys['w'] || keys['arrowup']) move.add(fwd);
      if (keys['s'] || keys['arrowdown']) move.sub(fwd);
      if (keys['a'] || keys['arrowleft']) move.sub(rgt);
      if (keys['d'] || keys['arrowright']) move.add(rgt);
      if (move.length() > 1) move.normalize();
      player.pos.add(move.multiplyScalar(player.speed * d));
      player.pos.y = 1.7;

      // Дистанция
      player.dist += player.pos.distanceTo(player.lastPos);
      player.lastPos.copy(player.pos);
      distanceEl.textContent = `DISTANCE: ${Math.floor(player.dist)}m`;

      camera.position.copy(player.pos);
      camera.rotation.y = player.yaw;
      camera.rotation.x = player.pitch;

      const gx = Math.round(player.pos.x / CELL);
      const gz = Math.round(player.pos.z / CELL);
      if (gx !== lastCell.x || gz !== lastCell.z) {
        ensureArea(gx, gz, 8);
        removeFar(gx, gz, 11);
        lastCell = {x:gx, z:gz};
      }

      playerLight.position.set(player.pos.x, player.pos.y+1.1, player.pos.z);

      // Монстр
      const lookDir = new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
      const toMon = monsterPos.clone().sub(player.pos);
      const dist = toMon.length();
      const looks = toMon.normalize().dot(lookDir) > 0.4 && dist < 20;
      const speed = looks ? 2.0 : 4.5;
      if (dist > 0.7) {
        const dir = toMon.clone().normalize();
        monsterPos.add(dir.multiplyScalar(Math.min(speed*d, dist-0.7)));
        monsterGroup.position.copy(monsterPos);
        monsterGroup.lookAt(player.pos.x, 1.5, player.pos.z);
      }

      vhsGlitch = Math.max(0, (7-dist)/7)*0.7;
      if (dist < 3) vhsGlitch = 0.9;
      if (dist < 0.8) { endGame(); return; }

      // Мерцание ламп
      const time = Date.now()*0.001;
      cells.forEach(c => {
        const dmon = Math.hypot(c.gx - Math.round(monsterPos.x/CELL), c.gz - Math.round(monsterPos.z/CELL))*CELL;
        let flicker = 1;
        if (dmon < 12) flicker = 1 - Math.max(0,1-dmon/12)*0.6*Math.abs(Math.sin(time*8 + c.flickerOffset));
        flicker *= 0.85 + 0.15*Math.sin(time*c.flickerSpeed + c.flickerOffset);
        c.lamp.material.emissiveIntensity = c.baseEmissive * Math.max(0.2, flicker);
      });

      updateAudio(dist);
      staminaFill.style.width = player.stamina + '%';
      staminaFill.style.background = player.stamina<30 ? '#ff3333' : player.stamina<60 ? 'linear-gradient(90deg,#ff4444,#ffaa44)' : 'linear-gradient(90deg,#ff4444,#ffaa44,#44ff44)';
      updateVHS();
    }

    function render() { renderer.render(scene, camera); }
    function gameLoop() { requestAnimationFrame(gameLoop); update(0.016); render(); }

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
    });

    // ---------- Первоначальная загрузка ----------
    ensureArea(0,0,6);
    monsterPos.set(0,0,-16);
    createMonster();
    gameLoop();

    console.log('✅ Игра готова. Нажмите WASD для движения после клика.');
  </script>
</body>
</html>
