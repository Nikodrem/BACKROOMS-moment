<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Backrooms: The Chase – Solid Ground</title>
    <style>
        :root { --bg: #000; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#000; overflow:hidden; font-family:'Courier New',monospace;
            cursor:none; user-select:none; -webkit-user-select:none;
            height:100vh; width:100vw; touch-action:none;
        }
        #game-canvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; display:block; }
        #vhs-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%; z-index:2; pointer-events:none;
            mix-blend-mode:overlay; opacity:0.55;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 2px, transparent 2px, transparent 4px),
                        radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
            animation:scanline-drift 0.1s linear infinite;
        }
        #vhs-overlay::before {
            content:''; position:absolute; top:0; left:0; width:100%; height:100%;
            background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 2px);
            animation:flicker 0.05s linear infinite;
        }
        #vhs-overlay::after {
            content:''; position:absolute; top:0; left:0; width:100%; height:100%;
            background: radial-gradient(ellipse at center, rgba(30,20,10,0.2) 0%, rgba(10,5,0,0.5) 70%, rgba(0,0,0,0.8) 100%);
            animation:chromatic-shift 0.15s ease-in-out infinite;
        }
        #noise-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%; z-index:3; pointer-events:none; opacity:0.25;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            background-size:200px 200px; animation:noise-shift 0.08s linear infinite;
        }
        #chroma-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%; z-index:4; pointer-events:none; opacity:0.12;
            box-shadow: inset 3px 0 0 rgba(255,0,0,0.15), inset -3px 0 0 rgba(0,180,255,0.15);
            animation:chroma-drift 0.2s ease-in-out infinite;
        }
        #hud {
            position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:10; pointer-events:none;
            color:#c8b87d; font-family:'Courier New',monospace; font-size:13px; letter-spacing:3px;
            text-align:center; opacity:0.7; text-shadow:0 0 10px rgba(200,180,120,0.5);
            animation:hud-pulse 2s ease-in-out infinite;
        }
        #stamina-bar {
            position:fixed; bottom:80px; left:50%; transform:translateX(-50%); z-index:10; pointer-events:none;
            width:200px; height:4px; background:rgba(255,255,255,0.1); border-radius:2px; overflow:hidden;
        }
        #stamina-fill { height:100%; background:#c8b87d; transition:width 0.15s; border-radius:2px; box-shadow:0 0 8px rgba(200,180,120,0.6); }
        #jumpscare {
            position:fixed; top:0; left:0; width:100%; height:100%; z-index:100; pointer-events:none;
            background:#000; opacity:0; transition:opacity 0.08s; display:flex; align-items:center; justify-content:center;
        }
        #jumpscare.active { opacity:1; }
        #jumpscare canvas { width:100%; height:100%; object-fit:cover; image-rendering:pixelated; }
        #restart-prompt {
            position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:110; pointer-events:all;
            color:#ff3333; font-family:'Courier New',monospace; font-size:22px; letter-spacing:4px;
            text-align:center; display:none; text-shadow:0 0 20px rgba(255,0,0,0.8); cursor:pointer;
            animation:blink-text 0.8s ease-in-out infinite;
        }
        #restart-prompt.visible { display:block; }
        #restart-prompt span { display:block; font-size:12px; margin-top:10px; letter-spacing:2px; color:#aaa; }
        @keyframes scanline-drift { 0%{background-position:0 0;} 100%{background-position:0 4px;} }
        @keyframes flicker { 0%,100%{opacity:1;} 30%{opacity:0.85;} 60%{opacity:1;} 92%{opacity:0.7;} }
        @keyframes noise-shift { 0%{background-position:0 0;} 25%{background-position:-50px 30px;} 50%{background-position:20px -20px;} 75%{background-position:-30px -40px;} 100%{background-position:40px 10px;} }
        @keyframes chroma-drift { 0%,100%{box-shadow:inset 3px 0 0 rgba(255,0,0,0.15), inset -3px 0 0 rgba(0,180,255,0.15);} 50%{box-shadow:inset 5px 0 0 rgba(255,30,0,0.2), inset -4px 0 0 rgba(0,200,255,0.18);} }
        @keyframes hud-pulse { 0%,100%{opacity:0.7;} 50%{opacity:0.4;} }
        @keyframes blink-text { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <div id="vhs-overlay"></div>
    <div id="noise-overlay"></div>
    <div id="chroma-overlay"></div>
    <div id="hud">KEEP RUNNING</div>
    <div id="stamina-bar"><div id="stamina-fill" style="width:100%"></div></div>
    <div id="jumpscare"><canvas id="jumpscare-canvas" width="512" height="512"></canvas></div>
    <div id="restart-prompt">YOU DIDN'T ESCAPE<span>click or tap to try again</span></div>

    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ── DOM ──
        const canvas = document.getElementById('game-canvas');
        const hudEl = document.getElementById('hud');
        const staminaFill = document.getElementById('stamina-fill');
        const jumpscareEl = document.getElementById('jumpscare');
        const jumpscareCanvas = document.getElementById('jumpscare-canvas');
        const restartPrompt = document.getElementById('restart-prompt');

        // ── THREE.JS ──
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1408);
        scene.fog = new THREE.FogExp2(0x1a1408, 0.0002);
        const camera = new THREE.PerspectiveCamera(78, window.innerWidth / window.innerHeight, 0.3, 80);
        camera.position.set(0, 1.5, 0);
        camera.rotation.order = 'YXZ';

        // ── AUDIO ──
        let audioCtx, ambientOsc, humGain, heartbeatOsc, heartbeatGain;
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext||window.webkitAudioContext)();
            humGain = audioCtx.createGain(); humGain.gain.value=0.09; humGain.connect(audioCtx.destination);
            ambientOsc = audioCtx.createOscillator(); ambientOsc.type='sawtooth'; ambientOsc.frequency.value=58;
            const humFilter = audioCtx.createBiquadFilter(); humFilter.type='lowpass'; humFilter.frequency.value=120; humFilter.Q.value=5;
            ambientOsc.connect(humFilter); humFilter.connect(humGain);
            const lfo = audioCtx.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.3;
            const lfoGain = audioCtx.createGain(); lfoGain.gain.value=15; lfo.connect(lfoGain); lfoGain.connect(humFilter.frequency);
            lfo.start(); ambientOsc.start();
            heartbeatGain = audioCtx.createGain(); heartbeatGain.gain.value=0; heartbeatGain.connect(audioCtx.destination);
            heartbeatOsc = audioCtx.createOscillator(); heartbeatOsc.type='sine'; heartbeatOsc.frequency.value=40;
            const hbFilter = audioCtx.createBiquadFilter(); hbFilter.type='lowpass'; hbFilter.frequency.value=80;
            heartbeatOsc.connect(hbFilter); hbFilter.connect(heartbeatGain); heartbeatOsc.start();
        }
        function setHeartbeat(intensity) {
            if(!heartbeatGain) return;
            heartbeatGain.gain.value = Math.min(intensity*0.35,0.5);
            if(heartbeatOsc && intensity>0.1) heartbeatOsc.frequency.value = 35 + intensity*50;
        }

        // ── TEXTURES ──
        function createMonsterFaceTexture() {
            const tc = document.createElement('canvas'); tc.width=256; tc.height=256; const ctx=tc.getContext('2d');
            const skin = ctx.createRadialGradient(128,110,20,128,128,160);
            skin.addColorStop(0,'#d4c8b8'); skin.addColorStop(0.5,'#b8a898'); skin.addColorStop(0.8,'#6b5b4a'); skin.addColorStop(1,'#1a1008');
            ctx.fillStyle=skin; ctx.fillRect(0,0,256,256);
            ctx.strokeStyle='rgba(30,10,10,0.5)'; ctx.lineWidth=1.5;
            for(let i=0;i<30;i++){ ctx.beginPath(); const sx=60+Math.random()*136, sy=40+Math.random()*140; ctx.moveTo(sx,sy); ctx.bezierCurveTo(sx+(Math.random()-0.5)*60, sy+(Math.random()-0.5)*40, sx+(Math.random()-0.5)*80, sy+(Math.random()-0.5)*60, sx+(Math.random()-0.5)*50, sy+30+Math.random()*50); ctx.stroke(); }
            const drawEye = (cx,cy,rx,ry)=>{
                const g=ctx.createRadialGradient(cx,cy,rx*0.3,cx,cy,rx*1.4);
                g.addColorStop(0,'#000'); g.addColorStop(0.6,'#0a0505'); g.addColorStop(1,'rgba(60,30,20,0.3)');
                ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.fill();
                ctx.strokeStyle='rgba(80,15,15,0.7)'; ctx.lineWidth=2; ctx.stroke();
            };
            drawEye(100,95,28,32); drawEye(160,90,30,34);
            const glint1=ctx.createRadialGradient(105,88,2,105,88,10); glint1.addColorStop(0,'rgba(255,200,150,0.9)'); glint1.addColorStop(1,'rgba(255,100,50,0)'); ctx.fillStyle=glint1; ctx.beginPath(); ctx.arc(105,88,10,0,Math.PI*2); ctx.fill();
            const glint2=ctx.createRadialGradient(165,83,2,165,83,10); glint2.addColorStop(0,'rgba(255,200,150,0.85)'); glint2.addColorStop(1,'rgba(255,100,50,0)'); ctx.fillStyle=glint2; ctx.beginPath(); ctx.arc(165,83,10,0,Math.PI*2); ctx.fill();
            const mouth=ctx.createLinearGradient(80,145,176,170); mouth.addColorStop(0,'#1a0000'); mouth.addColorStop(0.5,'#3a0000'); mouth.addColorStop(1,'#0a0000'); ctx.fillStyle=mouth; ctx.beginPath(); ctx.moveTo(75,148); ctx.quadraticCurveTo(100,175,128,158); ctx.quadraticCurveTo(155,140,180,152); ctx.quadraticCurveTo(160,180,128,172); ctx.quadraticCurveTo(90,185,75,148); ctx.fill();
            ctx.fillStyle='#c8c0b0'; for(let t=0;t<14;t++){ const tx=82+t*7.5; ctx.beginPath(); ctx.moveTo(tx-2,150+Math.sin(t*0.7)*10-3); ctx.lineTo(tx+2,150+Math.sin(t*0.7)*10-3); ctx.lineTo(tx,150+Math.sin(t*0.7)*10+5+Math.random()*4); ctx.fill(); }
            for(let m=0;m<80;m++){ ctx.fillStyle=`rgba(${20+Math.random()*40},${10+Math.random()*20},${5+Math.random()*10},0.25)`; ctx.beginPath(); ctx.arc(Math.random()*256,Math.random()*256,3+Math.random()*8,0,Math.PI*2); ctx.fill(); }
            return new THREE.CanvasTexture(tc);
        }
        function createJumpscareTexture() {
            const ctx=jumpscareCanvas.getContext('2d'); ctx.fillStyle='#000'; ctx.fillRect(0,0,512,512);
            const g=ctx.createRadialGradient(256,240,30,256,256,350); g.addColorStop(0,'#c8b8a0'); g.addColorStop(0.4,'#6b5040'); g.addColorStop(0.7,'#1a0808'); g.addColorStop(1,'#000'); ctx.fillStyle=g; ctx.fillRect(0,0,512,512);
            [[200,200],[320,190]].forEach(([ex,ey])=>{ const eg=ctx.createRadialGradient(ex,ey,10,ex,ey,55); eg.addColorStop(0,'#000'); eg.addColorStop(0.7,'#0a0000'); eg.addColorStop(1,'rgba(80,20,10,0.6)'); ctx.fillStyle=eg; ctx.beginPath(); ctx.ellipse(ex,ey,50,55,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#ffaa55'; ctx.beginPath(); ctx.arc(ex+8,ey-6,8,0,Math.PI*2); ctx.fill(); });
            ctx.fillStyle='#0a0000'; ctx.beginPath(); ctx.moveTo(160,290); ctx.quadraticCurveTo(200,340,256,310); ctx.quadraticCurveTo(310,280,360,300); ctx.quadraticCurveTo(320,370,256,350); ctx.quadraticCurveTo(180,380,160,290); ctx.fill();
            ctx.fillStyle='#ddd8cc'; for(let t=0;t<22;t++){ const tx=170+t*9; ctx.beginPath(); ctx.moveTo(tx-3,300+Math.sin(t*0.5)*10); ctx.lineTo(tx+3,298+Math.sin(t*0.5)*10); ctx.lineTo(tx,312+Math.random()*10); ctx.fill(); }
        }
        createJumpscareTexture();

        // ── CORRIDOR DATA ──
        const CELL_SIZE = 4;
        const VIEW_RADIUS = 16;
        const pathCells = new Set();
        const cellDataMap = new Map();
        function cellKey(x,z){ return `${x},${z}`; }
        function isCorridor(x,z){ return pathCells.has(cellKey(x,z)); }
        
        // Добавление клетки с немедленным созданием меша, если рядом
        function addPathCell(x, z, forceLight = false) {
            const key = cellKey(x, z);
            if (pathCells.has(key)) return;
            pathCells.add(key);
            const data = {
                hasLight: forceLight || Math.random() < 0.55,
                lightFlickerPhase: Math.random() * Math.PI * 2
            };
            cellDataMap.set(key, data);
            // Если клетка в радиусе видимости, сразу строим меш
            if (Math.abs(x - playerGridX) + Math.abs(z - playerGridZ) <= VIEW_RADIUS) {
                createCellMeshes(x, z);
            }
        }
        
        function removePathCell(x, z) {
            const key = cellKey(x, z);
            if (!pathCells.has(key)) return;
            pathCells.delete(key);
            cellDataMap.delete(key);
            removeCellMeshes(key);
        }

        function ensurePlayerArea(px, pz, radius = 1) {
            for (let dx = -radius; dx <= radius; dx++) {
                for (let dz = -radius; dz <= radius; dz++) {
                    if (Math.abs(dx) + Math.abs(dz) <= radius) {
                        addPathCell(px + dx, pz + dz, true);
                    }
                }
            }
        }

        function extendPathAhead(px, pz, dirX, dirZ) {
            addPathCell(px, pz, true);
            let cx = px, cz = pz;
            const steps = 8 + Math.floor(Math.random() * 5);
            for (let i = 0; i < steps; i++) {
                const turn = Math.random();
                let dx = dirX, dz = dirZ;
                if (turn < 0.25) {
                    if (Math.random() < 0.5) { dx = -dz; dz = dx === 0 ? (Math.random() < 0.5 ? 1 : -1) : 0; }
                    else { dx = dz; dz = -dx; }
                } else if (turn < 0.4 && i > 2) {
                    const bx = cx + (Math.random() < 0.5 ? -dz : dz);
                    const bz = cz + (Math.random() < 0.5 ? dx : -dx);
                    if (!isCorridor(bx, bz)) {
                        addPathCell(bx, bz);
                        if (Math.random() < 0.5) {
                            addPathCell(bx + (Math.random() < 0.5 ? 1 : -1), bz);
                            addPathCell(bx, bz + (Math.random() < 0.5 ? 1 : -1));
                        }
                    }
                }
                cx += dx; cz += dz;
                addPathCell(cx, cz);
            }
        }

        function pruneDistantCells(px, pz, maxDist = 30) {
            const toRemove = [];
            for (const key of pathCells) {
                const [x, z] = key.split(',').map(Number);
                if (Math.abs(x - px) + Math.abs(z - pz) > maxDist) {
                    toRemove.push({ x, z, key });
                }
            }
            for (const { x, z, key } of toRemove) {
                removePathCell(x, z);
            }
        }

        // ── 3D MESHES ──
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xc8b07a, roughness: 0.7, metalness: 0.05 });
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xb8a080, roughness: 0.85, metalness: 0.02, side: THREE.DoubleSide });
        const ceilMat = new THREE.MeshStandardMaterial({ color: 0xe0dcd0, roughness: 0.6, metalness: 0.03, side: THREE.DoubleSide });
        const lightMat = new THREE.MeshStandardMaterial({ color: 0xfafaf5, roughness: 0.3, metalness: 0.4, emissive: 0xfffef5, emissiveIntensity: 0.7 });
        const wallGeo = new THREE.PlaneGeometry(CELL_SIZE, 3.2);
        const floorGeo = new THREE.PlaneGeometry(CELL_SIZE, CELL_SIZE);
        const ceilGeo = new THREE.PlaneGeometry(CELL_SIZE, CELL_SIZE);
        const lightGeo = new THREE.BoxGeometry(1.2, 0.12, 3.2);
        const activeMeshes = new Map();
        const pointLights = [];

        function createCellMeshes(cx, cz) {
            const key = cellKey(cx, cz);
            if (activeMeshes.has(key) || !isCorridor(cx, cz)) return;
            const worldX = cx * CELL_SIZE, worldZ = cz * CELL_SIZE;
            const group = new THREE.Group();
            group.position.set(worldX, 0, worldZ);

            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -1.6;
            floor.receiveShadow = true;
            group.add(floor);

            const ceil = new THREE.Mesh(ceilGeo, ceilMat);
            ceil.rotation.x = Math.PI / 2;
            ceil.position.y = 1.65;
            group.add(ceil);

            const neighbors = {
                north: isCorridor(cx, cz - 1),
                south: isCorridor(cx, cz + 1),
                east: isCorridor(cx + 1, cz),
                west: isCorridor(cx - 1, cz),
            };
            const walls = [
                { dir: 'north', rotY: 0, posZ: -CELL_SIZE/2 },
                { dir: 'south', rotY: Math.PI, posZ: CELL_SIZE/2 },
                { dir: 'east', rotY: Math.PI/2, posX: CELL_SIZE/2 },
                { dir: 'west', rotY: -Math.PI/2, posX: -CELL_SIZE/2 },
            ];
            for (const w of walls) {
                if (!neighbors[w.dir]) {
                    const wall = new THREE.Mesh(wallGeo, wallMat);
                    wall.rotation.y = w.rotY;
                    wall.position.set(w.posX || 0, 0, w.posZ || 0);
                    wall.castShadow = true;
                    wall.receiveShadow = true;
                    group.add(wall);
                }
            }

            const data = cellDataMap.get(key);
            let pl = null;
            if (data && data.hasLight) {
                const fix = new THREE.Mesh(lightGeo, lightMat);
                fix.position.y = 1.55;
                group.add(fix);
                pl = new THREE.PointLight(0xfffbe8, 32, 14, 1.5);
                pl.position.set(worldX, 1.4, worldZ);
                pl.castShadow = true;
                pl.shadow.mapSize.width = 128;
                pl.shadow.mapSize.height = 128;
                pl.shadow.camera.near = 0.3;
                pl.shadow.camera.far = 16;
                pl.shadow.bias = -0.005;
                pl.userData = { baseIntensity: 32, flickerPhase: data.lightFlickerPhase };
                scene.add(pl);
                pointLights.push(pl);
                group.userData.pointLight = pl;
            }
            group.userData.cellX = cx;
            group.userData.cellZ = cz;
            scene.add(group);
            activeMeshes.set(key, group);
        }

        function removeCellMeshes(key) {
            const group = activeMeshes.get(key);
            if (!group) return;
            if (group.userData.pointLight) {
                scene.remove(group.userData.pointLight);
                const idx = pointLights.indexOf(group.userData.pointLight);
                if (idx >= 0) pointLights.splice(idx, 1);
            }
            scene.remove(group);
            activeMeshes.delete(key);
        }

        function updateVisibleMeshes() {
            // Этот метод только удаляет слишком далёкие меши; создание происходит в addPathCell
            const desired = new Set();
            for (const key of pathCells) {
                const [x, z] = key.split(',').map(Number);
                if (Math.abs(x - playerGridX) + Math.abs(z - playerGridZ) <= VIEW_RADIUS) {
                    desired.add(key);
                }
            }
            for (const key of activeMeshes.keys()) {
                if (!desired.has(key)) {
                    removeCellMeshes(key);
                }
            }
            // Ограничиваем количество точечных ламп
            while (pointLights.length > 70) {
                const old = pointLights.shift();
                scene.remove(old);
            }
        }

        // ── MONSTER ──
        let monsterGroup;
        function createMonster() {
            monsterGroup = new THREE.Group();
            const faceTex = createMonsterFaceTexture();
            faceTex.colorSpace = THREE.SRGBColorSpace;
            const skinMat = new THREE.MeshStandardMaterial({ map: faceTex, roughness: 0.5, metalness: 0.05 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x1a1010, roughness: 0.6, metalness: 0.1 });
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2a1815, roughness: 0.55, metalness: 0.08 });
            const headGeo = new THREE.SphereGeometry(0.5, 32, 28); headGeo.scale(1, 1.2, 0.9);
            const head = new THREE.Mesh(headGeo, skinMat); head.position.y = 2.15; head.castShadow = true; monsterGroup.add(head);
            const eyeGeo = new THREE.SphereGeometry(0.08, 8, 8); const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff9944 });
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat); leftEye.position.set(-0.15, 2.28, -0.38); monsterGroup.add(leftEye);
            const rightEye = new THREE.Mesh(eyeGeo, eyeMat); rightEye.position.set(0.17, 2.26, -0.38); monsterGroup.add(rightEye);
            const torsoGeo = new THREE.CylinderGeometry(0.28, 0.35, 1.3, 16); const torso = new THREE.Mesh(torsoGeo, bodyMat); torso.position.y = 1.1; torso.castShadow = true; monsterGroup.add(torso);
            const armGeo = new THREE.CylinderGeometry(0.1, 0.13, 1.3, 10);
            const leftArm = new THREE.Mesh(armGeo, darkMat); leftArm.position.set(-0.45, 1.25, 0); leftArm.rotation.z = 0.25; leftArm.castShadow = true; monsterGroup.add(leftArm);
            const rightArm = new THREE.Mesh(armGeo, darkMat); rightArm.position.set(0.45, 1.25, 0); rightArm.rotation.z = -0.25; rightArm.castShadow = true; monsterGroup.add(rightArm);
            const legGeo = new THREE.CylinderGeometry(0.12, 0.16, 1.1, 10);
            const leftLeg = new THREE.Mesh(legGeo, darkMat); leftLeg.position.set(-0.2, 0.3, 0); leftLeg.castShadow = true; monsterGroup.add(leftLeg);
            const rightLeg = new THREE.Mesh(legGeo, darkMat); rightLeg.position.set(0.2, 0.3, 0); rightLeg.castShadow = true; monsterGroup.add(rightLeg);
            monsterGroup.userData = { head, leftEye, rightEye, leftArm, rightArm };
            scene.add(monsterGroup);
        }
        function updateMonsterPosition() {
            if (!monsterGroup || gameOver) return;
            const wx = monsterGridX * CELL_SIZE, wz = monsterGridZ * CELL_SIZE;
            monsterGroup.position.lerp(new THREE.Vector3(wx, 0, wz), 0.3);
            const angle = Math.atan2(playerWorldPos.x - wx, playerWorldPos.z - wz);
            monsterGroup.rotation.y = angle;
        }
        function updateMonsterAnimation(dt) {
            if (!monsterGroup || gameOver) return;
            const u = monsterGroup.userData;
            const bob = Math.sin(time * 3.5) * 0.08;
            u.head.position.y = 2.15 + bob;
            u.head.rotation.z = Math.sin(time * 2.3) * 0.08;
            u.head.rotation.x = Math.cos(time * 2.7) * 0.05;
            u.leftArm.rotation.z = 0.25 + Math.sin(time * 2.5) * 0.2;
            u.rightArm.rotation.z = -0.25 + Math.cos(time * 2.5) * 0.2;
            const glow = 0.6 + Math.sin(time * 5 + Math.PI) * 0.4;
            u.leftEye.material.color.setRGB(1, 0.5 + glow * 0.3, 0.15 + glow * 0.2);
            u.rightEye.material.color.setRGB(1, 0.5 + glow * 0.3, 0.15 + glow * 0.2);
            u.leftEye.scale.setScalar(0.7 + glow * 0.6);
            u.rightEye.scale.setScalar(0.7 + glow * 0.6);
        }

        // ── MONSTER AI ──
        function bfsPath(sx, sz, tx, tz) {
            const visited = new Set();
            const queue = [[{ x: sx, z: sz }]];
            visited.add(cellKey(sx, sz));
            const maxSteps = 60;
            while (queue.length) {
                const path = queue.shift();
                const cur = path[path.length - 1];
                if (cur.x === tx && cur.z === tz) return path.length > 1 ? path[1] : cur;
                if (path.length >= maxSteps) continue;
                const neighbors = [
                    { x: cur.x + 1, z: cur.z }, { x: cur.x - 1, z: cur.z },
                    { x: cur.x, z: cur.z + 1 }, { x: cur.x, z: cur.z - 1 }
                ];
                for (let i = neighbors.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [neighbors[i], neighbors[j]] = [neighbors[j], neighbors[i]];
                }
                for (const n of neighbors) {
                    const nk = cellKey(n.x, n.z);
                    if (!visited.has(nk) && isCorridor(n.x, n.z)) {
                        visited.add(nk);
                        queue.push([...path, n]);
                    }
                }
            }
            return null;
        }
        function updateMonsterAI(dt) {
            if (gameOver) return;
            monsterSurgeTimer -= dt;
            monsterSurgeCooldown -= dt;
            let spd = monsterSpeed;
            if (monsterSurgeTimer > 0) spd *= 1.7;
            else if (monsterSurgeCooldown <= 0 && Math.random() < 0.008) {
                monsterSurgeTimer = 1.5 + Math.random() * 2;
                monsterSurgeCooldown = 6 + Math.random() * 8;
            }
            const distToPlayer = Math.abs(monsterGridX - playerGridX) + Math.abs(monsterGridZ - playerGridZ);
            if (distToPlayer <= 1 && Math.random() < 0.35) { triggerGameOver(); return; }
            const next = bfsPath(monsterGridX, monsterGridZ, playerGridX, playerGridZ);
            if (next) {
                const wx = monsterGridX * CELL_SIZE, wz = monsterGridZ * CELL_SIZE;
                const tx = next.x * CELL_SIZE, tz = next.z * CELL_SIZE;
                const dx = tx - wx, dz = tz - wz, dist = Math.sqrt(dx*dx + dz*dz);
                if (dist < 0.15) { monsterGridX = next.x; monsterGridZ = next.z; }
                else {
                    const ratio = Math.min((spd * dt) / dist, 1);
                    const newWX = wx + dx * ratio, newWZ = wz + dz * ratio;
                    const nx = Math.round(newWX / CELL_SIZE), nz = Math.round(newWZ / CELL_SIZE);
                    if (isCorridor(nx, nz)) { monsterGridX = nx; monsterGridZ = nz; }
                }
            }
            const worldDist = Math.sqrt((monsterGridX*CELL_SIZE - playerWorldPos.x)**2 + (monsterGridZ*CELL_SIZE - playerWorldPos.z)**2);
            if (worldDist < 2.2) triggerGameOver();
            setHeartbeat(Math.max(0, 1 - worldDist/25));
            hudEl.textContent = worldDist < 8 ? "IT'S CLOSE" : (worldDist < 16 ? "KEEP RUNNING" : "KEEP MOVING");
            hudEl.style.color = worldDist < 8 ? '#ff6644' : '#c8b87d';
        }
        function triggerGameOver() {
            if (gameOver) return; gameOver = true;
            jumpscareEl.classList.add('active'); restartPrompt.classList.add('visible');
            hudEl.textContent = ''; staminaFill.style.width = '0%'; setHeartbeat(0);
            if (audioCtx) {
                const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                o.type = 'square'; o.frequency.value = 80;
                g.gain.setValueAtTime(0.6, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.8);
            }
            setTimeout(() => jumpscareEl.classList.remove('active'), 400);
        }

        // ── PLAYER ──
        let playerWorldPos = new THREE.Vector3(0, 1.5, 0);
        let playerGridX = 0, playerGridZ = 0;
        let stamina = 100, isSprinting = false;
        const NORMAL_SPEED = 7.5, SPRINT_SPEED = 12.5;

        function clampPlayerToNearestCorridor() {
            if (!isCorridor(playerGridX, playerGridZ)) {
                let bestDist = Infinity, bestX = playerGridX, bestZ = playerGridZ;
                for (const key of pathCells) {
                    const [x, z] = key.split(',').map(Number);
                    const d = Math.abs(x - playerGridX) + Math.abs(z - playerGridZ);
                    if (d < bestDist) { bestDist = d; bestX = x; bestZ = z; }
                }
                if (bestDist < Infinity) {
                    playerGridX = bestX;
                    playerGridZ = bestZ;
                    playerWorldPos.x = playerGridX * CELL_SIZE;
                    playerWorldPos.z = playerGridZ * CELL_SIZE;
                }
            }
        }

        function updatePlayer(dt) {
            if (gameOver) return;
            // Stamina
            if (isSprinting && stamina > 0 && (keys['KeyW'] || keys['ArrowUp'])) {
                stamina = Math.max(0, stamina - 28 * dt);
                if (stamina <= 0) isSprinting = false;
            } else {
                stamina = Math.min(100, stamina + 18 * dt);
                if (stamina >= 15 && keys['ShiftLeft'] && (keys['KeyW'] || keys['ArrowUp'])) isSprinting = true;
                else if (!keys['ShiftLeft'] || !(keys['KeyW'] || keys['ArrowUp'])) isSprinting = false;
            }
            staminaFill.style.width = Math.round(stamina) + '%';
            staminaFill.style.background = stamina < 25 ? '#ff6644' : '#c8b87d';

            const speed = isSprinting ? SPRINT_SPEED : NORMAL_SPEED;
            const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)).normalize();
            const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)).normalize();
            let moveX = 0, moveZ = 0;
            if (keys['KeyW'] || keys['ArrowUp']) { moveX += forward.x; moveZ += forward.z; }
            if (keys['KeyS'] || keys['ArrowDown']) { moveX -= forward.x; moveZ -= forward.z; }
            if (keys['KeyA'] || keys['ArrowLeft']) { moveX -= right.x; moveZ -= right.z; }
            if (keys['KeyD'] || keys['ArrowRight']) { moveX += right.x; moveZ += right.z; }
            const len = Math.sqrt(moveX * moveX + moveZ * moveZ);
            if (len > 1) { moveX /= len; moveZ /= len; }
            const isMoving = len > 0.1;

            const deltaX = moveX * speed * dt;
            const deltaZ = moveZ * speed * dt;
            const newPos = playerWorldPos.clone();
            newPos.x += deltaX;
            newPos.z += deltaZ;

            const newGridX = Math.round(newPos.x / CELL_SIZE);
            const newGridZ = Math.round(newPos.z / CELL_SIZE);

            if (isCorridor(newGridX, newGridZ)) {
                playerWorldPos.copy(newPos);
            } else {
                const posX = playerWorldPos.clone(); posX.x += deltaX;
                const gx = Math.round(posX.x / CELL_SIZE), gz = Math.round(posX.z / CELL_SIZE);
                if (isCorridor(gx, gz)) { playerWorldPos.copy(posX); }
                else {
                    const posZ = playerWorldPos.clone(); posZ.z += deltaZ;
                    const gx2 = Math.round(posZ.x / CELL_SIZE), gz2 = Math.round(posZ.z / CELL_SIZE);
                    if (isCorridor(gx2, gz2)) { playerWorldPos.copy(posZ); }
                }
            }

            playerGridX = Math.round(playerWorldPos.x / CELL_SIZE);
            playerGridZ = Math.round(playerWorldPos.z / CELL_SIZE);

            // Сначала гарантируем область вокруг, потом принудительно ставим меши, потом фиксируем позицию
            ensurePlayerArea(playerGridX, playerGridZ, 1);
            if (isMoving) {
                const dirX = Math.round(moveX), dirZ = Math.round(moveZ);
                if (dirX !== 0 || dirZ !== 0) extendPathAhead(playerGridX, playerGridZ, dirX, dirZ);
            }
            // Принудительно обновляем видимые меши (удаляем дальние и добавляем новые, если ещё не)
            updateVisibleMeshes();
            clampPlayerToNearestCorridor();

            // Камера
            if (isMoving) headBobPhase += dt * (isSprinting ? 14 : 10);
            const bobY = isMoving ? Math.sin(headBobPhase) * 0.06 : 0;
            const bobX = isMoving ? Math.cos(headBobPhase * 2) * 0.03 : 0;
            camera.position.set(playerWorldPos.x + bobX, 1.5 + bobY, playerWorldPos.z);
            camera.rotation.set(pitch, yaw, 0);
        }

        // ── LIGHTING ──
        function setupLighting() {
            scene.add(new THREE.AmbientLight(0x5c4a3a, 1.4));
            const fill = new THREE.PointLight(0x443820, 20, 25, 2);
            fill.position.set(0, 3, 0);
            scene.add(fill);
        }
        function updateFlickeringLights(t) {
            for (const pl of pointLights) {
                if (!pl.userData || pl.userData.baseIntensity === undefined) continue;
                const p = pl.userData.flickerPhase || 0;
                const flicker = 1 + Math.sin(t*8+p)*0.15 + Math.sin(t*19+p*1.7)*0.1 + Math.sin(t*37+p*2.3)*0.08;
                const dip = Math.sin(t*2.1+p*3) > 0.85 ? 0.35 : 1;
                pl.intensity = pl.userData.baseIntensity * Math.max(0.2, flicker * dip);
            }
        }

        // ── INPUT ──
        const keys = {};
        let gameOver = false, gameStarted = false, mouseLocked = false;
        let yaw = 0, pitch = -0.05, headBobPhase = 0, time = 0;
        let monsterGridX = 0, monsterGridZ = -6, monsterSpeed = 6.2, monsterSurgeTimer = 0, monsterSurgeCooldown = 0;
        function onKeyDown(e) {
            keys[e.code] = true;
            if (!gameStarted && !gameOver) {
                gameStarted = true;
                initAudio();
            }
            if (gameOver && e.code === 'KeyR') restartGame();
        }
        function onKeyUp(e) { keys[e.code] = false; if (e.code === 'ShiftLeft') isSprinting = false; }
        function onMouseMove(e) {
            if (!mouseLocked || gameOver) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-1.2, Math.min(0.5, pitch));
        }
        function onMouseDown() {
            if (gameOver) { restartGame(); return; }
            if (!mouseLocked) {
                canvas.requestPointerLock();
                initAudio();
                if (!gameStarted) {
                    gameStarted = true;
                }
            }
        }
        function onPointerLockChange() { mouseLocked = document.pointerLockElement === canvas; }
        function onResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        }
        let touchStartX = 0, touchStartY = 0, touchActive = false;
        function onTouchStart(e) {
            if (gameOver) { restartGame(); return; }
            initAudio();
            if (!gameStarted) { gameStarted = true; }
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchActive = true;
                keys['KeyW'] = true;
            }
            if (e.touches.length === 2) isSprinting = true;
        }
        function onTouchMove(e) {
            if (!touchActive || gameOver) return;
            const dx = e.touches[0].clientX - touchStartX;
            const dy = e.touches[0].clientY - touchStartY;
            yaw -= dx * 0.004;
            pitch -= dy * 0.004;
            pitch = Math.max(-1.2, Math.min(0.5, pitch));
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }
        function onTouchEnd() { touchActive = false; keys['KeyW'] = false; isSprinting = false; }

        // ── RESTART ──
        function restartGame() {
            gameOver = false;
            gameStarted = true;
            // Очистка
            for (const key of activeMeshes.keys()) {
                removeCellMeshes(key);
            }
            pathCells.clear();
            cellDataMap.clear();
            pointLights.length = 0;
            activeMeshes.clear();

            playerWorldPos.set(0, 1.5, 0);
            playerGridX = 0; playerGridZ = 0;
            stamina = 100; isSprinting = false;
            monsterGridX = 0; monsterGridZ = -6;
            monsterSurgeTimer = 0; monsterSurgeCooldown = 4;
            yaw = 0; pitch = -0.05; headBobPhase = 0; time = 0;

            ensurePlayerArea(0, 0, 1);
            extendPathAhead(0, 0, 0, -1);
            updateVisibleMeshes();
            monsterGroup.position.set(monsterGridX * CELL_SIZE, 0, monsterGridZ * CELL_SIZE);
            camera.position.set(0, 1.5, 0);
            camera.rotation.set(pitch, yaw, 0);
            jumpscareEl.classList.remove('active');
            restartPrompt.classList.remove('visible');
            hudEl.textContent = 'KEEP RUNNING';
            hudEl.style.color = '#c8b87d';
            staminaFill.style.width = '100%';
            setHeartbeat(0);
        }

        // ── GAME LOOP ──
        const clock = new THREE.Clock();
        let lastPrune = 0;
        function gameLoop() {
            requestAnimationFrame(gameLoop);
            const dt = Math.min(clock.getDelta(), 0.15);
            time += dt;
            if (!gameOver && gameStarted) {
                updatePlayer(dt);
                updateMonsterAI(dt);
                updateMonsterPosition();
                updateMonsterAnimation(dt);
                updateFlickeringLights(time);
                lastPrune += dt;
                if (lastPrune > 1.5) {
                    lastPrune = 0;
                    pruneDistantCells(playerGridX, playerGridZ, 28);
                }
            }
            renderer.render(scene, camera);
            if (!gameOver && gameStarted) {
                const dist = Math.sqrt((monsterGridX - playerGridX)**2 + (monsterGridZ - playerGridZ)**2) * CELL_SIZE;
                const vhs = Math.max(0.4, Math.min(1, 1 - dist/30));
                document.getElementById('vhs-overlay').style.opacity = 0.35 + vhs * 0.35;
                document.getElementById('noise-overlay').style.opacity = 0.15 + vhs * 0.25;
                document.getElementById('chroma-overlay').style.opacity = 0.06 + vhs * 0.14;
            }
        }

        // ── INIT ──
        function init() {
            setupLighting();
            createMonster();
            // Создаём начальный коридор и меши
            ensurePlayerArea(0, 0, 1);
            extendPathAhead(0, 0, 0, -1);
            updateVisibleMeshes();
            monsterGroup.position.set(monsterGridX * CELL_SIZE, 0, monsterGridZ * CELL_SIZE);
            playerWorldPos.set(0, 1.5, 0);
            camera.position.copy(playerWorldPos);

            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('keyup', onKeyUp);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mousedown', onMouseDown);
            document.addEventListener('pointerlockchange', onPointerLockChange);
            window.addEventListener('resize', onResize);
            window.addEventListener('touchstart', onTouchStart, { passive: false });
            window.addEventListener('touchmove', onTouchMove, { passive: false });
            window.addEventListener('touchend', onTouchEnd);
            restartPrompt.addEventListener('click', restartGame);
            restartPrompt.addEventListener('touchend', e => { e.preventDefault(); restartGame(); });
            window.addEventListener('contextmenu', e => e.preventDefault());
            gameLoop();
        }
        init();
    </script>
</body>
</html>
