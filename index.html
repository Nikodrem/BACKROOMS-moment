                drawParticles();
                drawCueBallPlacementIndicator();
                // Pocketed balls indicator near pockets
                for (const ball of balls) {
                    if (ball.pocketed && ball.x && ball.y) {
                        ctx.fillStyle = ball.color;
                        ctx.globalAlpha = 0.5;
                        ctx.beginPath();
                        ctx.arc(ball.x, ball.y, BALL_R * 0.7, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.globalAlpha = 1;
                    }
                }
            }

            // ==================== INPUT HANDLING ====================
            function getInternalCoords(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = INTERNAL_W / rect.width;
                const scaleY = INTERNAL_H / rect.height;
                return {
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY,
                };
            }

            canvas.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                mouseOnCanvas = true;
                if (gameState === 'aiming' || gameState === 'charging') {
                    updateAimDirection();
                }
                if (gameState === 'placing_cue') {
                    // Just update preview
                }
            });

            canvas.addEventListener('mousedown', (e) => {
                initAudio();
                if (e.button !== 0) return;
                if (gameState === 'placing_cue') {
                    placeCueBall(e);
                    return;
                }
                if (gameState === 'aiming' && currentPlayer === 1) {
                    mouseDown = true;
                    chargeStartTime = Date.now();
                    gameState = 'charging';
                    powerMeterContainer.classList.add('active');
                    powerMeterFill.style.width = '0%';
                }
                if (gameState === 'aiming' && gameMode === 'practice') {
                    mouseDown = true;
                    chargeStartTime = Date.now();
                    gameState = 'charging';
                    powerMeterContainer.classList.add('active');
                    powerMeterFill.style.width = '0%';
                }
            });

            canvas.addEventListener('mouseup', (e) => {
                if (e.button !== 0) return;
                if (gameState === 'charging') {
                    const elapsed = Date.now() - chargeStartTime;
                    const power = Math.min(elapsed / maxChargeTime, 1);
                    shootCueBall(power);
                    mouseDown = false;
                    powerMeterContainer.classList.remove('active');
                }
                mouseDown = false;
            });

            canvas.addEventListener('mouseleave', () => {
                mouseOnCanvas = false;
                if (gameState === 'charging') {
                    const elapsed = Date.now() - chargeStartTime;
                    const power = Math.min(elapsed / maxChargeTime, 1);
                    shootCueBall(power);
                    mouseDown = false;
                    powerMeterContainer.classList.remove('active');
                }
                mouseDown = false;
            });

            canvas.addEventListener('mouseenter', () => {
                mouseOnCanvas = true;
            });

            // Touch support
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                initAudio();
                if (gameState === 'placing_cue') {
                    const touch = e.touches[0];
                    mouseX = touch.clientX;
                    mouseY = touch.clientY;
                    placeCueBall({ clientX: touch.clientX, clientY: touch.clientY });
                    return;
                }
                if ((gameState === 'aiming' && (currentPlayer === 1 || gameMode === 'practice')) || gameMode ===
                    'practice') {
                    const touch = e.touches[0];
                    mouseX = touch.clientX;
                    mouseY = touch.clientY;
                    updateAimDirection();
                    mouseDown = true;
                    chargeStartTime = Date.now();
                    gameState = 'charging';
                    powerMeterContainer.classList.add('active');
                    powerMeterFill.style.width = '0%';
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (e.touches.length > 0) {
                    mouseX = e.touches[0].clientX;
                    mouseY = e.touches[0].clientY;
                    if (gameState === 'aiming' || gameState === 'charging') updateAimDirection();
                }
            }, { passive: false });

            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (gameState === 'charging') {
                    const elapsed = Date.now() - chargeStartTime;
                    const power = Math.min(elapsed / maxChargeTime, 1);
                    shootCueBall(power);
                }
                mouseDown = false;
                powerMeterContainer.classList.remove('active');
            }, { passive: false });

            function placeCueBall(e) {
                if (gameState !== 'placing_cue') return;
                const coords = getInternalCoords(e);
                let px = coords.x;
                let py = coords.y;
                const legalXMin = PLAY_LEFT + BALL_R;
                const legalXMax = PLAY_RIGHT - BALL_R;
                const legalYMin = PLAY_TOP + BALL_R;
                const legalYMax = PLAY_BOTTOM - BALL_R;
                px = Math.max(legalXMin, Math.min(legalXMax, px));
                py = Math.max(legalYMin, Math.min(legalYMax, py));
                const active = getActiveBalls().filter(b => !b.isCue);
                const overlap = active.some(b => Math.sqrt((px - b.x) ** 2 + (py - b.y) ** 2) < BALL_R * 2.2);
                if (overlap) {
                    showToast('Здесь занято!', 'foul');
                    return;
                }
                let cue = getCueBall();
                if (!cue) {
                    cue = new Ball(0, px, py);
                    balls.push(cue);
                } else {
                    cue.pocketed = false;
                    cue.x = px;
                    cue.y = py;
                    cue.resetVelocity();
                }
                placingCueBall = false;
                cueBallInHand = false;
                gameState = 'aiming';
                showToast('Биток размещён', 'info');
                updateHUD();
            }

            // ==================== UI BUTTONS ====================
            settingsToggle.addEventListener('click', () => {
                initAudio();
                settingsPanel.classList.toggle('hidden');
            });

            document.getElementById('restart-btn').addEventListener('click', () => {
                initAudio();
                resetGame();
                settingsPanel.classList.add('hidden');
                showToast('Игра перезапущена', 'info');
            });

            document.getElementById('start-game-btn').addEventListener('click', () => {
                initAudio();
                const selectedCard = document.querySelector('.mode-card.selected');
                if (selectedCard) {
                    gameMode = selectedCard.dataset.mode;
                }
                resetGame();
                modeScreen.classList.add('hidden');
                if (gameMode === 'practice') currentPlayer = 1;
                updateHUD();
            });

            document.getElementById('win-restart-btn').addEventListener('click', () => {
                initAudio();
                resetGame();
                winScreen.classList.add('hidden');
            });

            document.getElementById('win-menu-btn').addEventListener('click', () => {
                initAudio();
                gameState = 'menu';
                winScreen.classList.add('hidden');
                modeScreen.classList.remove('hidden');
                balls = [];
                particles = [];
                totalPocketedByP1 = [];
                totalPocketedByP2 = [];
                updateHUD();
            });

            // Mode card selection
            document.querySelectorAll('.mode-card').forEach(card => {
                card.addEventListener('click', () => {
                    initAudio();
                    document.querySelectorAll('.mode-card').forEach(c => c.classList.remove(
                        'selected'));
                    card.classList.add('selected');
                });
            });

            // Settings change handlers
            aiDifficultySelect.addEventListener('change', () => {
                aiDifficulty = aiDifficultySelect.value;
                initAudio();
            });
            frictionSelect.addEventListener('change', () => {
                frictionLevel = frictionSelect.value;
                initAudio();
            });
            soundToggleSelect.addEventListener('change', () => {
                soundEnabled = soundToggleSelect.value === 'on';
                initAudio();
            });

            // ==================== RESIZE HANDLER ====================
            function resizeCanvas() {
                const rect = wrapper.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                canvas.style.width = rect.width + 'px';
                canvas.style.height = rect.height + 'px';
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(rect.width / INTERNAL_W, rect.height / INTERNAL_H);
            }

            window.addEventListener('resize', resizeCanvas);

            // ==================== GAME LOOP ====================
            let lastTime = performance.now();
            let aiShotScheduled = false;

            function gameLoop(timestamp) {
                let dt = (timestamp - lastTime) / 1000;
                if (dt <= 0) dt = 0.016;
                if (dt > 0.1) dt = 0.1;
                lastTime = timestamp;

                // Update power meter
                if (gameState === 'charging') {
                    const elapsed = Date.now() - chargeStartTime;
                    const power = Math.min(elapsed / maxChargeTime, 1);
                    powerMeterFill.style.width = (power * 100) + '%';
                }

                // Physics simulation
                if (gameState === 'simulating') {
                    simulatePhysics(dt);
                    if (allBallsStopped()) {
                        stopAllBalls();
                        processTurnEnd();
                        aiShotScheduled = false;
                    }
                }

                // AI turn
                if (gameState === 'aiming' && currentPlayer === 2 && gameMode !== 'practice' && !aiShotScheduled &&
                    !gameOverData) {
                    aiShotScheduled = true;
                    updateAimDirection();
                    executeAIShot();
                }

                // Update particles during aiming too
                if (gameState === 'aiming' || gameState === 'placing_cue') {
                    for (const p of particles) p.update(dt);
                    particles = particles.filter(p => p.alive);
                }

                // Render
                resizeCanvas();
                render();
                updateHUD();

                requestAnimationFrame(gameLoop);
            }

            // ==================== STARTUP ====================
            function init() {
                resizeCanvas();
                resetPockets();
                balls = createRack8Ball();
                gameState = 'menu';
                modeScreen.classList.remove('hidden');
                winScreen.classList.add('hidden');
                settingsPanel.classList.add('hidden');
                powerMeterContainer.classList.remove('active');
                updateHUD();
                ballsRack.innerHTML = '<span style="font-size:11px;opacity:0.7;">Выберите режим</span>';
                playerIndicator.textContent = '🎱 Бильярд';
                playerIndicator.classList.remove('ai-turn');
                requestAnimationFrame(gameLoop);
            }

            init();
            console.log('🎱 Бильярд с жидким стеклом готов!');
            console.log('Режимы: 8-Ball | 9-Ball | Тренировка');
            console.log('Управление: мышь для прицеливания, зажать и отпустить для удара');
            console.log('ИИ-противник играет по правилам бильярда');
            console.log('Настройки — шестерёнка справа вверху');
        })();
    </script>
</body>
</html>
