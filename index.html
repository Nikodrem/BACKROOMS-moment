<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BACKROOMS - RUN</title>
    <style>
        :root { --bg: #0a0a05; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); overflow: hidden; font-family: 'Courier New', monospace; cursor: none; user-select: none; }
        #gameCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #vhsOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; mix-blend-mode: overlay; }
        #scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px); }
        #vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; box-shadow: inset 0 0 180px 80px rgba(0,0,0,0.7); }
        #hud { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        #staminaBarOuter { width: 200px; height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); }
        #staminaBarInner { height: 100%; background: linear-gradient(90deg, #ff4444, #ffaa44, #44ff44); width: 100%; }
        #message { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; color: #ffddcc; font-size: 28px; letter-spacing: 6px; text-shadow: 0 0 20px #ff6432, 0 0 60px #ff3200; opacity: 0; transition: 0.3s; text-align: center; }
        #message.show { opacity: 1; }
        #instruction { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; color: #ffe0c0; font-size: 18px; letter-spacing: 3px; text-shadow: 0 0 15px #ff9650; opacity: 1; transition: 0.8s; text-align: center; line-height: 2; }
        #distance { position: fixed; top: 30px; right: 30px; z-index: 5; color: rgba(255,200,150,0.7); font-size: 13px; letter-spacing: 2px; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <canvas id="vhsOverlay"></canvas>
    <div id="scanlines"></div>
    <div id="vignette"></div>
    <div id="hud"><div id="staminaBarOuter"><div id="staminaBarInner"></div></div></div>
    <div id="message"></div>
    <div id="instruction">CLICK TO START<br>WASD - MOVE &nbsp; SHIFT - SPRINT<br>MOUSE - LOOK &nbsp; LOOK BACK TO SLOW IT</div>
    <div id="distance">DISTANCE: 0m</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- DOM ----------
        const canvas = document.getElementById('gameCanvas');
        const vhsCanvas = document.getElementById('vhsOverlay');
        const vhsCtx = vhsCanvas.getContext('2d');
        const messageEl = document.getElementById('message');
        const instructionEl = document.getElementById('instruction');
        const distanceEl = document.getElementById('distance');
        const staminaInner = document.getElementById('staminaBarInner');

        // ---------- THREE.JS ----------
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = false;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.9;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#1a1008');
        scene.fog = new THREE.FogExp2('#1a1008', 0.00025);

        const camera = new THREE.PerspectiveCamera(78, window.innerWidth / window.innerHeight, 0.3, 80);
        camera.position.set(0, 1.7, 0);
        camera.rotation.order = 'YXZ';

        // ---------- AUDIO ----------
        let audioCtx;
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const master = audioCtx.createGain(); master.gain.value = 0.25; master.connect(audioCtx.destination);
            const buzz = audioCtx.createOscillator(); buzz.type = 'sawtooth'; buzz.frequency.value = 57;
            const buzzGain = audioCtx.createGain(); buzzGain.gain.value = 0.07; buzz.connect(buzzGain); buzzGain.connect(master);
            buzz.start();
        }

        // ---------- TEXTURES ----------
        function texWall() {
            const c = document.createElement('canvas'); c.width = c.height = 256;
            const t = c.getContext('2d'); t.fillStyle = '#d4b96a'; t.fillRect(0,0,256,256);
            for(let i=0;i<500;i++){ t.fillStyle=`rgba(180,140,70,${Math.random()*0.1})`; t.fillRect(Math.random()*256,Math.random()*256,3+Math.random()*6,2+Math.random()*3);}
            return new THREE.CanvasTexture(c);
        }
        function texFloor() {
            const c = document.createElement('canvas'); c.width = c.height = 256;
            const t = c.getContext('2d'); t.fillStyle = '#6b5c48'; t.fillRect(0,0,256,256);
            for(let i=0;i<1500;i++){ const b=70+Math.random()*40; t.fillStyle=`rgba(${b},${b*0.8},${b*0.5},0.06)`; t.fillRect(Math.random()*256,Math.random()*256,2,2);}
            const tx = new THREE.CanvasTexture(c); tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(2,2); return tx;
        }
        function texCeil() {
            const c = document.createElement('canvas'); c.width = c.height = 128;
            const t = c.getContext('2d'); t.fillStyle = '#e8e4d8'; t.fillRect(0,0,128,128);
            return new THREE.CanvasTexture(c);
        }
        function texMonster() {
            const c = document.createElement('canvas'); c.width = c.height = 256;
            const t = c.getContext('2d'); t.fillStyle = '#3d1a1a'; t.fillRect(0,0,256,256);
            for(let i=0;i<400;i++){ const x=Math.random()*256,y=Math.random()*256; t.fillStyle=`rgba(80,20,20,${Math.random()*0.4})`; t.beginPath(); t.arc(x,y,3+Math.random()*10,0,Math.PI*2); t.fill();}
            return new THREE.CanvasTexture(c);
        }

        const matWall = new THREE.MeshStandardMaterial({ map: texWall(), roughness:0.7 });
        const matFloor = new THREE.MeshStandardMaterial({ map: texFloor(), roughness:0.9 });
        const matCeil = new THREE.MeshStandardMaterial({ map: texCeil(), roughness:0.8 });
        const matMonster = new THREE.MeshStandardMaterial({ map: texMonster(), roughness:0.4, color:'#cc8888' });
        const matLamp = new THREE.MeshStandardMaterial({ color:'#fffef5', emissive:'#fffef0', emissiveIntensity:1.5 });

        // ---------- LIGHTING ----------
        scene.add(new THREE.AmbientLight('#3d3020', 0.7));
        const playerLight = new THREE.PointLight('#fffbe8', 30, 12, 2);
        scene.add(playerLight);

        // ---------- CORRIDOR SYSTEM ----------
        const CELL = 4.0, WALL_H = 3.0, WALL_D = 0.3;
        const cells = new Map();

        function addCell(gx, gz) {
            const key = `${gx},${gz}`;
            if (cells.has(key)) return;
            const group = new THREE.Group();
            const wx = gx*CELL, wz = gz*CELL;

            group.add(new THREE.Mesh(new THREE.PlaneGeometry(CELL, CELL), matFloor).rotateX(-Math.PI/2).position.set(wx,0.01,wz));
            group.add(new THREE.Mesh(new THREE.PlaneGeometry(CELL, CELL), matCeil).rotateX(Math.PI/2).position.set(wx,WALL_H,wz));

            const wallN = new THREE.Mesh(new THREE.BoxGeometry(CELL, WALL_H, WALL_D), matWall);
            wallN.position.set(wx, WALL_H/2, wz - CELL/2);
            const wallS = new THREE.Mesh(new THREE.BoxGeometry(CELL, WALL_H, WALL_D), matWall);
            wallS.position.set(wx, WALL_H/2, wz + CELL/2);
            const wallE = new THREE.Mesh(new THREE.BoxGeometry(WALL_D, WALL_H, CELL), matWall);
            wallE.position.set(wx + CELL/2, WALL_H/2, wz);
            const wallW = new THREE.Mesh(new THREE.BoxGeometry(WALL_D, WALL_H, CELL), matWall);
            wallW.position.set(wx - CELL/2, WALL_H/2, wz);

            const walls = { n: wallN, s: wallS, e: wallE, w: wallW };
            group.add(wallN, wallS, wallE, wallW);

            const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.8,0.08,1.6), matLamp);
            lamp.position.set(wx, WALL_H-0.08, wz);
            group.add(lamp);

            scene.add(group);
            cells.set(key, { group, walls, lamp, gx, gz, baseEmissive: 1.5 + Math.random()*0.5 });

            const dirs = [
                { dx:0, dz:-1, my:'n', their:'s' }, { dx:0, dz:1, my:'s', their:'n' },
                { dx:1, dz:0, my:'e', their:'w' }, { dx:-1, dz:0, my:'w', their:'e' }
            ];
            dirs.forEach(({dx, dz, my, their}) => {
                const nkey = `${gx+dx},${gz+dz}`;
                if (cells.has(nkey)) {
                    const nb = cells.get(nkey);
                    if (walls[my]) { group.remove(walls[my]); walls[my] = null; }
                    if (nb.walls[their]) { nb.group.remove(nb.walls[their]); nb.walls[their] = null; }
                }
            });
        }

        function ensureArea(gx,gz,r=8) {
            for(let dx=-r;dx<=r;dx++) for(let dz=-r;dz<=r;dz++)
                if(Math.abs(dx)+Math.abs(dz)<=r) addCell(gx+dx,gz+dz);
        }
        function removeFar(cx,cz,keep=10) {
            cells.forEach((c,k)=>{
                if(Math.abs(c.gx-cx)+Math.abs(c.gz-cz)>keep) {
                    scene.remove(c.group);
                    cells.delete(k);
                }
            });
        }

        // ---------- MONSTER ----------
        let monsterGroup;
        const monsterPos = new THREE.Vector3(0,0,-16);
        function createMonster() {
            monsterGroup = new THREE.Group();
            monsterGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.4,1.4,8), matMonster).translateY(1.5));
            monsterGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.35,8,6), matMonster).translateY(2.4));
            for(let s=-1;s<=1;s+=2){
                monsterGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.12,1.1,6), matMonster).translateX(s*0.5).translateY(1.8).rotateZ(s*0.4));
            }
            monsterGroup.position.copy(monsterPos);
            scene.add(monsterGroup);
        }

        // ---------- PLAYER ----------
        const player = {
            pos: new THREE.Vector3(0,1.7,0), yaw:0, pitch:0,
            stamina:100, sprint:false, speed:3.2, dist:0,
            lastPos: new THREE.Vector3(0,1.7,0)
        };
        let gameStarted=false, gameOver=false;

        function startGame() {
            if(gameStarted||gameOver) return;
            initAudio();
            gameStarted=true; gameOver=false;
            messageEl.classList.remove('show'); instructionEl.style.opacity='0';
            player.pos.set(0,1.7,0); player.lastPos.copy(player.pos);
            player.yaw=0; player.pitch=0; player.stamina=100; player.dist=0;
            monsterPos.set(0,0,-16);
            if(monsterGroup) monsterGroup.position.copy(monsterPos);
            canvas.requestPointerLock();
        }
        function endGame() {
            if(!gameStarted||gameOver) return;
            gameOver=true; gameStarted=false;
            document.exitPointerLock();
            messageEl.textContent='IT GOT YOU'; messageEl.classList.add('show');
            setTimeout(()=>{
                messageEl.classList.remove('show');
                instructionEl.style.opacity='1';
                instructionEl.innerHTML='CLICK TO TRY AGAIN<br>WASD - MOVE &nbsp; SHIFT - SPRINT<br>MOUSE - LOOK';
            },2500);
        }
        function resetGame() {
            gameStarted=gameOver=false;
            if(monsterGroup){ scene.remove(monsterGroup); monsterGroup=null; }
            cells.forEach(c=>scene.remove(c.group)); cells.clear();
            player.pos.set(0,1.7,0); player.yaw=0; player.pitch=0; player.stamina=100; player.dist=0;
            messageEl.classList.remove('show'); instructionEl.style.opacity='1';
            distanceEl.textContent='DISTANCE: 0m';
            ensureArea(0,0,6);
            monsterPos.set(0,0,-16); createMonster();
            canvas.requestPointerLock();
        }

        // ---------- INPUT (FIXED: window listeners) ----------
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === 'Shift') player.sprint = true;
        });
        window.addEventListener('keyup', e => {
            keys[e.key.toLowerCase()] = false;
            if (e.key === 'Shift') player.sprint = false;
        });

        let mouseDX = 0, mouseDY = 0;
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement === canvas) {
                mouseDX += e.movementX;
                mouseDY += e.movementY;
            }
        });

        canvas.addEventListener('click', () => {
            if (!gameStarted && !gameOver) startGame();
            else if (gameOver) resetGame();
            else canvas.requestPointerLock();
        });

        // ---------- VHS ----------
        const noiseCanvas = document.createElement('canvas'); noiseCanvas.width=128; noiseCanvas.height=128;
        const nctx = noiseCanvas.getContext('2d');
        const imgData = nctx.createImageData(128,128);
        for(let i=0;i<imgData.data.length;i+=4){ const v=Math.random()*25; imgData.data[i]=v; imgData.data[i+1]=v; imgData.data[i+2]=v; imgData.data[i+3]=18; }
        nctx.putImageData(imgData,0,0);
        let vhsGlitch=0;
        function updateVHS() {
            vhsCanvas.width=window.innerWidth; vhsCanvas.height=window.innerHeight;
            const ctx=vhsCtx; ctx.clearRect(0,0,vhsCanvas.width,vhsCanvas.height);
            ctx.globalAlpha=0.07+vhsGlitch*0.1;
            for(let y=0;y<vhsCanvas.height;y+=128) for(let x=0;x<vhsCanvas.width;x+=128) ctx.drawImage(noiseCanvas,x,y);
            if(vhsGlitch>0.1){ ctx.globalAlpha=vhsGlitch*0.5; ctx.fillStyle='#fff'; for(let i=0;i<vhsGlitch*10;i++){ ctx.fillRect(0,Math.random()*vhsCanvas.height,vhsCanvas.width,2+Math.random()*5); } }
            ctx.globalAlpha=1;
        }

        // ---------- GAME LOOP ----------
        let lastCell={x:0,z:0};
        function update(dt) {
            if(!gameStarted||gameOver){ updateVHS(); return; }
            const d = Math.min(dt,0.1);

            player.yaw -= mouseDX*0.002;
            player.pitch -= mouseDY*0.002;
            player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));
            mouseDX=0; mouseDY=0;

            if(player.sprint && keys['w'] && player.stamina>0){
                player.stamina -= 18*d; if(player.stamina<0) player.stamina=0;
            } else player.stamina = Math.min(100, player.stamina+15*d);
            const canSprint = player.sprint && player.stamina>0 && keys['w'];
            player.speed = canSprint ? 5.8 : 3.2;

            const fwd = new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
            const rgt = new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
            const move = new THREE.Vector3();
            if(keys['w'] || keys['arrowup']) move.add(fwd);
            if(keys['s'] || keys['arrowdown']) move.sub(fwd);
            if(keys['a'] || keys['arrowleft']) move.sub(rgt);
            if(keys['d'] || keys['arrowright']) move.add(rgt);
            if(move.length()>1) move.normalize();
            player.pos.add(move.multiplyScalar(player.speed*d));
            player.pos.y = 1.7;

            player.dist += player.pos.distanceTo(player.lastPos);
            player.lastPos.copy(player.pos);
            distanceEl.textContent = `DISTANCE: ${Math.floor(player.dist)}m`;

            camera.position.copy(player.pos);
            camera.rotation.y = player.yaw;
            camera.rotation.x = player.pitch;

            const gx = Math.round(player.pos.x/CELL);
            const gz = Math.round(player.pos.z/CELL);
            if(gx!==lastCell.x || gz!==lastCell.z){
                ensureArea(gx,gz,8);
                removeFar(gx,gz,11);
                lastCell={x:gx,z:gz};
            }

            playerLight.position.set(player.pos.x, player.pos.y+1.1, player.pos.z);

            const lookDir = new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
            const toMon = monsterPos.clone().sub(player.pos);
            const dist = toMon.length();
            const looks = toMon.normalize().dot(lookDir) > 0.4 && dist < 20;
            const speed = looks ? 2.0 : 4.5;
            if(dist>0.7){
                const dir = toMon.clone().normalize();
                monsterPos.add(dir.multiplyScalar(Math.min(speed*d, dist-0.7)));
                monsterGroup.position.copy(monsterPos);
                monsterGroup.lookAt(player.pos.x, 1.5, player.pos.z);
            }
            vhsGlitch = Math.max(0, (7-dist)/7)*0.7;
            if(dist<3) vhsGlitch=0.9;
            if(dist<0.8) endGame();

            const time = Date.now()*0.001;
            cells.forEach(c=>{
                const dmon = Math.hypot(c.gx - Math.round(monsterPos.x/CELL), c.gz - Math.round(monsterPos.z/CELL))*CELL;
                let flicker = 1;
                if(dmon<12) flicker = 1 - Math.max(0,1-dmon/12)*0.6*Math.abs(Math.sin(time*8 + c.gx*c.gz));
                flicker *= 0.85 + 0.15*Math.sin(time*2 + c.gx);
                c.lamp.material.emissiveIntensity = c.baseEmissive * Math.max(0.2, flicker);
            });

            staminaInner.style.width = player.stamina+'%';
            staminaInner.style.background = player.stamina<30 ? '#ff3333' : player.stamina<60 ? 'linear-gradient(90deg,#ff4444,#ffaa44)' : 'linear-gradient(90deg,#ff4444,#ffaa44,#44ff44)';
            updateVHS();
        }

        function render(){ renderer.render(scene, camera); }
        function gameLoop(){ requestAnimationFrame(gameLoop); update(0.016); render(); }

        window.addEventListener('resize', ()=>{
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
        });

        // ---------- INIT ----------
        ensureArea(0,0,6);
        monsterPos.set(0,0,-16);
        createMonster();
        gameLoop();
        canvas.addEventListener('click', ()=>{ if(!audioCtx) initAudio(); }, {once:true});
        console.log('🏃 Backrooms Runner Ready — Move with WASD, Sprint with Shift');
    </script>
</body>
</html>
