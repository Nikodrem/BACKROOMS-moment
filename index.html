<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BACKROOMS - RUN (FIXED)</title>
    <style>
        :root { --bg: #0a0a05; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); overflow: hidden; font-family: 'Courier New', monospace; cursor: none; user-select: none; height: 100vh; width: 100vw; }
        #gameCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #vhsOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; mix-blend-mode: overlay; }
        #scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px); }
        #vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; box-shadow: inset 0 0 180px 80px rgba(0,0,0,0.7); }
        #hud { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 5; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        #staminaBarOuter { width: 200px; height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); }
        #staminaBarInner { height: 100%; background: linear-gradient(90deg, #ff4444, #ffaa44, #44ff44); transition: width 0.1s; border-radius: 2px; width: 100%; }
        #message { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none; color: #ffddcc; font-size: 28px; letter-spacing: 6px; text-shadow: 0 0 20px rgba(255,100,50,0.8), 0 0 60px rgba(255,50,0,0.5); opacity: 0; transition: opacity 0.3s; text-align: center; }
        #message.visible { opacity: 1; }
        #instruction { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none; color: #ffe0c0; font-size: 18px; letter-spacing: 3px; text-shadow: 0 0 15px rgba(255,150,80,0.7); opacity: 1; transition: opacity 0.8s; text-align: center; line-height: 2; }
        #distance { position: fixed; top: 30px; right: 30px; z-index: 5; pointer-events: none; color: rgba(255,200,150,0.6); font-size: 13px; letter-spacing: 2px; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <canvas id="vhsOverlay"></canvas>
    <div id="scanlines"></div>
    <div id="vignette"></div>
    <div id="hud"><div id="staminaBarOuter"><div id="staminaBarInner"></div></div></div>
    <div id="message"></div>
    <div id="instruction">CLICK TO START<br>WASD - MOVE &nbsp; SHIFT - SPRINT<br>MOUSE - LOOK &nbsp; LOOK BACK TO SLOW IT</div>
    <div id="distance">DISTANCE: 0m</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== DOM ====================
        const canvas = document.getElementById('gameCanvas');
        const vhsCanvas = document.getElementById('vhsOverlay');
        const vhsCtx = vhsCanvas.getContext('2d');
        const messageEl = document.getElementById('message');
        const instructionEl = document.getElementById('instruction');
        const distanceEl = document.getElementById('distance');
        const staminaInner = document.getElementById('staminaBarInner');

        // ==================== THREE.JS SETUP ====================
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = false;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.9;
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#1a1008');
        scene.fog = new THREE.FogExp2('#1a1008', 0.00025);

        const camera = new THREE.PerspectiveCamera(78, window.innerWidth / window.innerHeight, 0.3, 80);
        camera.position.set(0, 1.7, 0);
        camera.rotation.order = 'YXZ';

        // ==================== AUDIO ====================
        let audioCtx, buzzGain, heartbeatGain;
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const master = audioCtx.createGain(); master.gain.value = 0.25; master.connect(audioCtx.destination);
            const buzz = audioCtx.createOscillator(); buzz.type = 'sawtooth'; buzz.frequency.value = 57;
            buzzGain = audioCtx.createGain(); buzzGain.gain.value = 0.07; buzz.connect(buzzGain); buzzGain.connect(master);
            buzz.start();
            const hb = audioCtx.createOscillator(); hb.type = 'sine'; hb.frequency.value = 35;
            heartbeatGain = audioCtx.createGain(); heartbeatGain.gain.value = 0; hb.connect(heartbeatGain);
            heartbeatGain.connect(master); hb.start();
        }
        function updateAudio(monsterDist) {
            if (!audioCtx) return;
            const prox = Math.max(0, 1 - monsterDist / 15);
            buzzGain.gain.value = 0.07 + Math.sin(Date.now() * 0.02) * 0.01;
            heartbeatGain.gain.value = prox * 0.5;
        }

        // ==================== TEXTURES ====================
        function texWall() { const s=256,c=document.createElement('canvas');c.width=s;c.height=s;const t=c.getContext('2d');t.fillStyle='#d4b96a';t.fillRect(0,0,s,s);for(let i=0;i<800;i++){t.fillStyle=`rgba(180,140,70,${Math.random()*0.08})`;t.fillRect(Math.random()*s,Math.random()*s,3+Math.random()*6,2+Math.random()*3);}for(let x=0;x<s;x+=32){t.fillStyle='rgba(0,0,0,0.03)';t.fillRect(x+14,0,4,s);}return new THREE.CanvasTexture(c); }
        function texFloor() { const s=256,c=document.createElement('canvas');c.width=s;c.height=s;const t=c.getContext('2d');t.fillStyle='#6b5c48';t.fillRect(0,0,s,s);for(let i=0;i<2000;i++){const b=75+Math.random()*45;t.fillStyle=`rgba(${b},${b*0.8},${b*0.5},0.06)`;t.fillRect(Math.random()*s,Math.random()*s,2,2);}const tx=new THREE.CanvasTexture(c);tx.wrapS=THREE.RepeatWrapping;tx.wrapT=THREE.RepeatWrapping;tx.repeat.set(2,2);return tx; }
        function texCeil() { const s=128,c=document.createElement('canvas');c.width=s;c.height=s;const t=c.getContext('2d');t.fillStyle='#e8e4d8';t.fillRect(0,0,s,s);t.strokeStyle='rgba(0,0,0,0.08)';t.lineWidth=1;for(let x=0;x<s;x+=32){t.beginPath();t.moveTo(x,0);t.lineTo(x,s);t.stroke();}for(let y=0;y<s;y+=32){t.beginPath();t.moveTo(0,y);t.lineTo(s,y);t.stroke();}return new THREE.CanvasTexture(c); }
        function texMonster() { const s=256,c=document.createElement('canvas');c.width=s;c.height=s;const t=c.getContext('2d');const g=t.createLinearGradient(0,0,s,s);g.addColorStop(0,'#3d1a1a');g.addColorStop(0.5,'#4a2020');g.addColorStop(1,'#2d1010');t.fillStyle=g;t.fillRect(0,0,s,s);for(let i=0;i<500;i++){const x=Math.random()*s,y=Math.random()*s,r=3+Math.random()*15;const sg=t.createRadialGradient(x,y,0,x,y,r);sg.addColorStop(0,`rgba(${40+Math.random()*50},${Math.random()*20},${Math.random()*15},0.4)`);sg.addColorStop(1,'rgba(0,0,0,0)');t.fillStyle=sg;t.beginPath();t.arc(x,y,r,0,Math.PI*2);t.fill();}t.strokeStyle='rgba(80,20,20,0.3)';t.lineWidth=0.5;for(let i=0;i<100;i++){t.beginPath();let sx=Math.random()*s,sy=Math.random()*s;t.moveTo(sx,sy);for(let j=0;j<5;j++){sx+=(Math.random()-0.5)*40;sy+=(Math.random()-0.5)*40;t.lineTo(sx,sy);}t.stroke();}return new THREE.CanvasTexture(c); }
        function texFace() { const s=256,c=document.createElement('canvas');c.width=s;c.height=s;const t=c.getContext('2d');t.fillStyle='#d4c8b8';t.fillRect(0,0,s,s);for(let i=0;i<300;i++){const x=Math.random()*s,y=Math.random()*s;const g=t.createRadialGradient(x,y,0,x,y,10);g.addColorStop(0,'rgba(160,140,120,0.35)');g.addColorStop(1,'rgba(0,0,0,0)');t.fillStyle=g;t.beginPath();t.arc(x,y,10,0,Math.PI*2);t.fill();}for(let ex=0;ex<2;ex++){const sx=s*0.35+ex*s*0.3,sy=s*0.38;const g=t.createRadialGradient(sx,sy,8,sx,sy,30);g.addColorStop(0,'#000');g.addColorStop(0.5,'#1a0a05');g.addColorStop(1,'rgba(0,0,0,0)');t.fillStyle=g;t.beginPath();t.ellipse(sx,sy,25,30,0,0,Math.PI*2);t.fill();}const mouth=t.createRadialGradient(s*0.5,s*0.62,5,s*0.5,s*0.62,35);mouth.addColorStop(0,'#1a0505');mouth.addColorStop(0.6,'#3a1510');mouth.addColorStop(1,'rgba(0,0,0,0)');t.fillStyle=mouth;t.beginPath();t.ellipse(s*0.5,s*0.62,30,12,0,0,Math.PI*2);t.fill();return new THREE.CanvasTexture(c); }

        const matWall = new THREE.MeshStandardMaterial({ map: texWall(), roughness:0.75, metalness:0.02, color:'#e8d59c' });
        const matFloor = new THREE.MeshStandardMaterial({ map: texFloor(), roughness:0.9, metalness:0 });
        const matCeil = new THREE.MeshStandardMaterial({ map: texCeil(), roughness:0.8, metalness:0.03 });
        const matMonster = new THREE.MeshStandardMaterial({ map: texMonster(), roughness:0.35, metalness:0.05, color:'#cc9988' });
        const matFace = new THREE.MeshStandardMaterial({ map: texFace(), roughness:0.4, metalness:0.02 });
        const matLight = new THREE.MeshStandardMaterial({ color:'#fffef5', roughness:0.2, metalness:0.1, emissive:'#fffef0', emissiveIntensity:1.8 });

        // ==================== LIGHTING ====================
        const ambient = new THREE.AmbientLight('#3d3020', 0.7);
        scene.add(ambient);
        const playerLight = new THREE.PointLight('#fffbe8', 30, 15, 2);
        playerLight.position.set(0, 2.7, 0);
        scene.add(playerLight);
        // Для локальных ламп будем создавать PointLight только вблизи игрока

        // ==================== CORRIDOR SYSTEM ====================
        const CELL = 4.0;
        const WALL_H = 3.0;
        const WALL_D = 0.15;
        const cells = new Map(); // key -> { group, walls, fixture, light (может быть null), gx, gz, baseEmissive, flickerOffset, flickerSpeed }

        function addCell(gx, gz) {
            const key = `${gx},${gz}`;
            if (cells.has(key)) return;
            const group = new THREE.Group();
            const wx = gx * CELL, wz = gz * CELL;

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(CELL, CELL), matFloor);
            floor.rotation.x = -Math.PI/2; floor.position.set(wx, 0.01, wz); group.add(floor);
            const ceil = new THREE.Mesh(new THREE.PlaneGeometry(CELL, CELL), matCeil);
            ceil.rotation.x = Math.PI/2; ceil.position.set(wx, WALL_H, wz); group.add(ceil);

            const createWall = (x, z, rotY) => {
                const w = new THREE.Mesh(new THREE.BoxGeometry(CELL, WALL_H, WALL_D), matWall);
                w.position.set(x, WALL_H/2, z); w.rotation.y = rotY; return w;
            };
            const walls = {
                n: createWall(wx, wz - CELL/2, 0),
                s: createWall(wx, wz + CELL/2, 0),
                e: createWall(wx + CELL/2, wz, Math.PI/2),
                w: createWall(wx - CELL/2, wz, Math.PI/2),
            };
            Object.values(walls).forEach(w => group.add(w));

            const fixture = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.08, 1.6), matLight);
            fixture.position.set(wx, WALL_H - 0.08, wz);
            group.add(fixture);

            scene.add(group);
            cells.set(key, {
                group, walls, fixture,
                light: null, // будет создан, если клетка рядом
                gx, gz,
                baseEmissive: 1.8 + Math.random() * 0.4,
                flickerOffset: Math.random() * Math.PI * 2,
                flickerSpeed: 0.5 + Math.random() * 2.5
            });

            // Удаляем стены, смежные с уже существующими соседями
            const neighbors = [
                { dx: 0, dz: -1, my: 'n', their: 's' },
                { dx: 0, dz: 1, my: 's', their: 'n' },
                { dx: 1, dz: 0, my: 'e', their: 'w' },
                { dx: -1, dz: 0, my: 'w', their: 'e' }
            ];
            neighbors.forEach(({ dx, dz, my, their }) => {
                const nkey = `${gx + dx},${gz + dz}`;
                if (cells.has(nkey)) {
                    const nb = cells.get(nkey);
                    if (walls[my]) { group.remove(walls[my]); walls[my] = null; }
                    if (nb.walls[their]) { nb.group.remove(nb.walls[their]); nb.walls[their] = null; }
                }
            });
        }

        function ensureArea(gx, gz, radius = 8) {
            for (let dx = -radius; dx <= radius; dx++)
                for (let dz = -radius; dz <= radius; dz++)
                    if (Math.abs(dx) + Math.abs(dz) <= radius) addCell(gx + dx, gz + dz);
        }

        function removeFar(cx, cz, keep = 10) {
            const todel = [];
            cells.forEach((c, k) => {
                if (Math.abs(c.gx - cx) + Math.abs(c.gz - cz) > keep) todel.push(k);
            });
            todel.forEach(k => {
                const c = cells.get(k);
                if (c.light) { c.light.removeFromParent(); c.light = null; }
                scene.remove(c.group);
                cells.delete(k);
            });
        }

        // Управление точечными источниками света для ламп
        function updateLocalLights(playerGx, playerGz) {
            const lightRadius = 4; // клетки вокруг игрока, где лампы будут настоящими источниками
            cells.forEach(c => {
                const dist = Math.abs(c.gx - playerGx) + Math.abs(c.gz - playerGz);
                if (dist <= lightRadius && !c.light) {
                    c.light = new THREE.PointLight('#fffef5', 5, 6, 2);
                    c.light.position.set(c.gx * CELL, WALL_H - 0.2, c.gz * CELL);
                    scene.add(c.light);
                } else if (dist > lightRadius && c.light) {
                    c.light.removeFromParent();
                    c.light = null;
                }
            });
        }

        // ==================== MONSTER ====================
        let monsterGroup, monsterGlow;
        const monsterPos = new THREE.Vector3(0, 0, -16);
        function createMonster() {
            monsterGroup = new THREE.Group();
            const t = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 1.4, 8), matMonster); t.position.y = 1.5; monsterGroup.add(t);
            const h = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 6), matFace); h.position.y = 2.4; monsterGroup.add(h);
            for (let s = -1; s <= 1; s += 2) {
                const a = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 1.1, 6), matMonster); a.position.set(s * 0.5, 1.8, 0); a.rotation.z = s * 0.4; monsterGroup.add(a);
                const hand = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.5, 6), matMonster); hand.position.set(s * 0.65, 1.2, 0.2); hand.rotation.z = s * 0.7; monsterGroup.add(hand);
            }
            for (let s = -1; s <= 1; s += 2) {
                const l = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.9, 6), matMonster); l.position.set(s * 0.2, 0.8, 0); monsterGroup.add(l);
            }
            monsterGlow = new THREE.PointLight('#441111', 2, 6, 2); monsterGlow.position.y = 1.6; monsterGroup.add(monsterGlow);
            monsterGroup.position.copy(monsterPos);
            scene.add(monsterGroup);
        }

        // ==================== PLAYER ====================
        const player = {
            pos: new THREE.Vector3(0, 1.7, 0),
            yaw: 0, pitch: 0,
            stamina: 100, sprint: false, speed: 3.2, dist: 0,
            lastPos: new THREE.Vector3(0, 1.7, 0)
        };
        let gameStarted = false, gameOver = false, deathTimer = null;

        function resetGame() {
            gameStarted = gameOver = false;
            if (deathTimer) clearTimeout(deathTimer);
            if (monsterGroup) { scene.remove(monsterGroup); monsterGroup = null; }
            cells.forEach(c => { if(c.light) c.light.removeFromParent(); scene.remove(c.group); });
            cells.clear();
            player.pos.set(0, 1.7, 0); player.yaw = 0; player.pitch = 0; player.stamina = 100; player.dist = 0; player.lastPos.copy(player.pos);
            messageEl.classList.remove('visible'); instructionEl.style.opacity = '1'; instructionEl.innerHTML = 'CLICK TO START<br>WASD - MOVE &nbsp; SHIFT - SPRINT<br>MOUSE - LOOK &nbsp; LOOK BACK TO SLOW IT';
            distanceEl.textContent = 'DISTANCE: 0m';
            ensureArea(0, 0, 6);
            monsterPos.set(0, 0, -16); createMonster();
            updateLocalLights(0, 0);
            canvas.requestPointerLock();
        }
        function startGame() {
            if (gameStarted || gameOver) return;
            initAudio();
            gameStarted = true; gameOver = false;
            messageEl.classList.remove('visible'); instructionEl.style.opacity = '0';
            player.pos.set(0, 1.7, 0); player.lastPos.copy(player.pos); player.yaw = 0; player.pitch = 0; player.stamina = 100; player.dist = 0;
            monsterPos.set(0, 0, -16); if (monsterGroup) monsterGroup.position.copy(monsterPos);
            canvas.requestPointerLock();
        }
        function endGame() {
            if (!gameStarted || gameOver) return;
            gameOver = true; gameStarted = false;
            document.exitPointerLock();
            messageEl.textContent = 'IT GOT YOU'; messageEl.classList.add('visible');
            if (deathTimer) clearTimeout(deathTimer);
            deathTimer = setTimeout(() => {
                messageEl.classList.remove('visible');
                instructionEl.style.opacity = '1'; instructionEl.innerHTML = 'CLICK TO TRY AGAIN<br>WASD - MOVE &nbsp; SHIFT - SPRINT<br>MOUSE - LOOK';
            }, 2500);
        }

        // ==================== INPUT ====================
        const keys = {};
        window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key === 'Shift') player.sprint = true; });
        window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; if (e.key === 'Shift') player.sprint = false; });
        let mouseDX = 0, mouseDY = 0;
        document.addEventListener('mousemove', e => { if (document.pointerLockElement === canvas) { mouseDX += e.movementX; mouseDY += e.movementY; } });
        canvas.addEventListener('click', () => {
            if (!gameStarted && !gameOver) startGame();
            else if (gameOver) resetGame();
            else canvas.requestPointerLock();
        });

        // ==================== VHS ====================
        const noiseCanvas = document.createElement('canvas'); noiseCanvas.width = 128; noiseCanvas.height = 128;
        const nctx = noiseCanvas.getContext('2d');
        const imgData = nctx.createImageData(128, 128);
        for (let i = 0; i < imgData.data.length; i += 4) { const v = Math.random() * 25; imgData.data[i] = v; imgData.data[i + 1] = v; imgData.data[i + 2] = v; imgData.data[i + 3] = 18; }
        nctx.putImageData(imgData, 0, 0);
        let vhsGlitch = 0;
        function updateVHS() {
            vhsCanvas.width = window.innerWidth; vhsCanvas.height = window.innerHeight;
            const ctx = vhsCtx; ctx.clearRect(0, 0, vhsCanvas.width, vhsCanvas.height);
            ctx.globalAlpha = 0.07 + vhsGlitch * 0.1;
            for (let y = 0; y < vhsCanvas.height; y += 128) for (let x = 0; x < vhsCanvas.width; x += 128) ctx.drawImage(noiseCanvas, x, y);
            if (vhsGlitch > 0.1) { ctx.globalAlpha = vhsGlitch * 0.5; ctx.fillStyle = '#fff'; for (let i = 0; i < vhsGlitch * 10; i++) { const y = Math.random() * vhsCanvas.height; ctx.fillRect(0, y, vhsCanvas.width, 2 + Math.random() * 5); } }
            ctx.globalAlpha = 1;
        }

        // ==================== GAME LOOP ====================
        let lastCell = { x: 0, z: 0 };
        function update(dt) {
            if (!gameStarted || gameOver) { updateVHS(); return; }
            const d = Math.min(dt, 0.1);

            // Поворот
            player.yaw -= mouseDX * 0.002;
            player.pitch -= mouseDY * 0.002;
            player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));
            mouseDX = 0; mouseDY = 0;

            // Стамина и скорость
            if (player.sprint && (keys['w'] || keys['arrowup']) && player.stamina > 0) {
                player.stamina -= 18 * d; if (player.stamina < 0) player.stamina = 0;
            } else { player.stamina = Math.min(100, player.stamina + 15 * d); }
            const canSprint = player.sprint && player.stamina > 0 && (keys['w'] || keys['arrowup']);
            player.speed = canSprint ? 5.8 : 3.2;

            // Движение
            const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
            const rgt = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
            const move = new THREE.Vector3();
            if (keys['w'] || keys['arrowup']) move.add(fwd);
            if (keys['s'] || keys['arrowdown']) move.sub(fwd);
            if (keys['a'] || keys['arrowleft']) move.sub(rgt);
            if (keys['d'] || keys['arrowright']) move.add(rgt);
            if (move.length() > 1) move.normalize();
            player.pos.add(move.multiplyScalar(player.speed * d));
            player.pos.y = 1.7;

            // Дистанция
            player.dist += player.pos.distanceTo(player.lastPos);
            player.lastPos.copy(player.pos);
            distanceEl.textContent = `DISTANCE: ${Math.floor(player.dist)}m`;

            camera.position.copy(player.pos);
            camera.rotation.y = player.yaw;
            camera.rotation.x = player.pitch;

            const gx = Math.round(player.pos.x / CELL);
            const gz = Math.round(player.pos.z / CELL);
            if (gx !== lastCell.x || gz !== lastCell.z) {
                ensureArea(gx, gz, 8);
                removeFar(gx, gz, 11);
                updateLocalLights(gx, gz);
                lastCell = { x: gx, z: gz };
            }

            playerLight.position.set(player.pos.x, player.pos.y + 1.1, player.pos.z);

            // Монстр
            const lookDir = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
            const toMon = monsterPos.clone().sub(player.pos);
            const dist = toMon.length();
            const looks = toMon.normalize().dot(lookDir) > 0.4 && dist < 20;
            const speed = looks ? 2.0 : 4.5;
            if (dist > 0.7) {
                const dir = toMon.clone().normalize();
                monsterPos.add(dir.multiplyScalar(Math.min(speed * d, dist - 0.7)));
                monsterGroup.position.copy(monsterPos);
                monsterGroup.lookAt(player.pos.x, 1.5, player.pos.z);
            }
            if (monsterGlow) monsterGlow.intensity = 1.5 + Math.max(0, (10 - dist)) * 1.2;
            vhsGlitch = Math.max(0, (7 - dist) / 7) * 0.7;
            if (dist < 3) vhsGlitch = 0.9;
            if (dist < 0.8) endGame();

            // Мерцание ламп
            const time = Date.now() * 0.001;
            cells.forEach(c => {
                const dmon = Math.hypot(c.gx - Math.round(monsterPos.x / CELL), c.gz - Math.round(monsterPos.z / CELL)) * CELL;
                let flicker = 1;
                if (dmon < 12) {
                    const p = Math.max(0, 1 - dmon / 12);
                    flicker = 1 - p * 0.7 * Math.abs(Math.sin(time * 8 + c.flickerOffset));
                }
                flicker *= 0.85 + 0.15 * Math.sin(time * c.flickerSpeed + c.flickerOffset);
                flicker = Math.max(0.2, flicker);
                c.fixture.material.emissiveIntensity = c.baseEmissive * flicker;
                if (c.light) {
                    c.light.intensity = 5 * flicker;
                }
            });

            updateAudio(dist);
            updateVHS();
            staminaInner.style.width = player.stamina + '%';
            staminaInner.style.background = player.stamina < 30 ? '#ff3333' : player.stamina < 60 ? 'linear-gradient(90deg,#ff4444,#ffaa44)' : 'linear-gradient(90deg,#ff4444,#ffaa44,#44ff44)';
        }

        function render() { renderer.render(scene, camera); }
        function gameLoop() { requestAnimationFrame(gameLoop); update(0.016); render(); }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        // ==================== INIT ====================
        ensureArea(0, 0, 6);
        updateLocalLights(0, 0);
        monsterPos.set(0, 0, -16);
        createMonster();
        gameLoop();
        canvas.addEventListener('click', () => { if (!audioCtx) initAudio(); }, { once: true });
        console.log('✅ READY');
    </script>
</body>
</html>
