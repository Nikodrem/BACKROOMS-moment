<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BACKROOMS – БЕГИ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0502; overflow: hidden; font-family: 'Courier New', monospace; }
    canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
    #vhs { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; mix-blend-mode: overlay; }
    #scanlines {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 3;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    }
    #vignette {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 4;
      pointer-events: none;
      box-shadow: inset 0 0 150px 60px rgba(0,0,0,0.8);
    }
    #hud {
      position: fixed; bottom: 35px; left: 50%; transform: translateX(-50%); z-index: 5;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      pointer-events: none;
    }
    #stamina-bar {
      width: 200px; height: 5px; background: rgba(255,255,255,0.15);
      border-radius: 2px; border: 1px solid rgba(255,255,255,0.2);
      overflow: hidden;
    }
    #stamina-fill {
      height: 100%; width: 100%; background: #ffaa44;
      transition: width 0.1s;
    }
    #message {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 10; color: #ffccaa; font-size: 2rem; letter-spacing: 5px;
      text-shadow: 0 0 30px #ff4422; opacity: 0; transition: 0.3s;
      text-align: center; pointer-events: none;
    }
    #message.show { opacity: 1; }
    #instruction {
      position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%);
      z-index: 10; color: #eeddcc; font-size: 1.1rem; letter-spacing: 2px;
      text-shadow: 0 0 15px #aa4422; text-align: center; line-height: 2;
      pointer-events: none; transition: opacity 0.8s;
    }
    #distance {
      position: fixed; top: 25px; right: 30px; z-index: 5;
      color: rgba(255,200,150,0.7); font-size: 0.9rem; letter-spacing: 2px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="vhs"></canvas>
  <div id="scanlines"></div>
  <div id="vignette"></div>
  <div id="hud">
    <div id="stamina-bar"><div id="stamina-fill"></div></div>
  </div>
  <div id="message"></div>
  <div id="instruction">КЛИКНИТЕ, ЧТОБЫ НАЧАТЬ<br>WASD – ДВИЖЕНИЕ | SHIFT – БЕГ<br>МЫШЬ – ОБЗОР | ОГЛЯНИТЕСЬ, ЧТОБЫ ЗАМЕДЛИТЬ ЕГО</div>
  <div id="distance">ДИСТАНЦИЯ: 0м</div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ────────────────────────────── ЭЛЕМЕНТЫ ИНТЕРФЕЙСА ──────────────────────────────
    const canvas = document.getElementById('game');
    const vhsCanvas = document.getElementById('vhs');
    const ctxVhs = vhsCanvas.getContext('2d');
    const msgEl = document.getElementById('message');
    const instrEl = document.getElementById('instruction');
    const distEl = document.getElementById('distance');
    const staminaFill = document.getElementById('stamina-fill');

    // ────────────────────────────── THREE.JS НАСТРОЙКА ──────────────────────────────
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
    renderer.setPixelRatio(1); // форсим низкое разрешение для производительности
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = false; // БЕЗ ТЕНЕЙ – огромный прирост FPS
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.8;
    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1008');
    scene.fog = new THREE.FogExp2('#1a1008', 0.0003);

    const camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.3, 40);
    camera.position.set(0, 1.7, 0);
    camera.rotation.order = 'YXZ';

    // ────────────────────────────── ПРОЦЕДУРНЫЕ ТЕКСТУРЫ (уменьшенные) ──────────────────────────────
    function texWall() {
      const c = document.createElement('canvas'); c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#d4b96a'; ctx.fillRect(0,0,128,128);
      for(let i=0;i<600;i++){ ctx.fillStyle=`rgba(180,140,70,${Math.random()*0.1})`; ctx.fillRect(Math.random()*128,Math.random()*128,2+Math.random()*4,1+Math.random()*3);}
      return new THREE.CanvasTexture(c);
    }
    function texFloor() {
      const c = document.createElement('canvas'); c.width = 128; c.height = 128;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#6b5c48'; ctx.fillRect(0,0,128,128);
      for(let i=0;i<2000;i++){ ctx.fillStyle=`rgba(${70+Math.random()*40},${50+Math.random()*30},${30+Math.random()*20},0.08)`; ctx.fillRect(Math.random()*128,Math.random()*128,1.5,1.5);}
      return new THREE.CanvasTexture(c);
    }
    function texCeil() {
      const c = document.createElement('canvas'); c.width = 64; c.height = 64;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#e8e4d8'; ctx.fillRect(0,0,64,64);
      return new THREE.CanvasTexture(c);
    }
    function texMonster() {
      const c = document.createElement('canvas'); c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#3d1a1a'; ctx.fillRect(0,0,256,256);
      for(let i=0;i<800;i++){ ctx.fillStyle=`rgba(${40+Math.random()*60},${Math.random()*30},${Math.random()*20},0.3)`; ctx.beginPath(); ctx.arc(Math.random()*256,Math.random()*256,4+Math.random()*12,0,Math.PI*2); ctx.fill();}
      return new THREE.CanvasTexture(c);
    }

    const matWall = new THREE.MeshStandardMaterial({ map: texWall(), roughness: 0.8 });
    const matFloor = new THREE.MeshStandardMaterial({ map: texFloor(), roughness: 0.9 });
    const matCeil = new THREE.MeshStandardMaterial({ map: texCeil(), roughness: 0.8 });
    const matMonster = new THREE.MeshStandardMaterial({ map: texMonster(), roughness: 0.4, color: '#cc9988' });

    // ────────────────────────────── ОСВЕЩЕНИЕ (ОДНА ЛАМПА) ──────────────────────────────
    const ambient = new THREE.AmbientLight('#4a3a2a', 0.5);
    scene.add(ambient);
    const playerLight = new THREE.PointLight('#fffbe8', 25, 9, 2);
    playerLight.position.set(0, 2.6, 0);
    scene.add(playerLight);
    // Дополнительный свет для монстра
    const monsterGlow = new THREE.PointLight('#441111', 2, 4, 2);
    monsterGlow.position.set(0,1.5,0);

    // ────────────────────────────── СИСТЕМА КОРИДОРОВ (ЛЁГКАЯ) ──────────────────────────────
    const CELL = 4.0, HALF = CELL/2, WALL_H = 3.0, WALL_D = 0.15;
    const cells = new Map(); // key "x,z" -> { mesh, walls: {n,s,e,w} }
    
    function addCell(gx, gz) {
      const key = `${gx},${gz}`;
      if (cells.has(key)) return;
      const group = new THREE.Group();
      const wx = gx*CELL, wz = gz*CELL;
      
      // пол и потолок
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(CELL, CELL), matFloor);
      floor.rotation.x = -Math.PI/2; floor.position.set(wx,0.01,wz); group.add(floor);
      const ceil = new THREE.Mesh(new THREE.PlaneGeometry(CELL, CELL), matCeil);
      ceil.rotation.x = Math.PI/2; ceil.position.set(wx, WALL_H, wz); group.add(ceil);
      
      // стены
      const walls = { n: null, s: null, e: null, w: null };
      const createWall = (x, z, rotY) => {
        const w = new THREE.Mesh(new THREE.BoxGeometry(CELL, WALL_H, WALL_D), matWall);
        w.position.set(x, WALL_H/2, z);
        w.rotation.y = rotY;
        return w;
      };
      // все четыре стены, потом лишние удалим
      walls.n = createWall(wx, wz - HALF, 0);
      walls.s = createWall(wx, wz + HALF, 0);
      walls.e = createWall(wx + HALF, wz, Math.PI/2);
      walls.w = createWall(wx - HALF, wz, Math.PI/2);
      Object.values(walls).forEach(w => group.add(w));
      
      scene.add(group);
      cells.set(key, { group, walls, gx, gz });
      
      // удаляем стены, смежные с уже существующими клетками
      const neighbors = [
        [gx, gz-1, 'n', 's'], [gx, gz+1, 's', 'n'],
        [gx+1, gz, 'e', 'w'], [gx-1, gz, 'w', 'e']
      ];
      neighbors.forEach(([nx, nz, myWall, theirWall]) => {
        const nkey = `${nx},${nz}`;
        if (cells.has(nkey)) {
          // убираем свою стену
          if (walls[myWall]) { group.remove(walls[myWall]); walls[myWall] = null; }
          // убираем стену соседа
          const neighbor = cells.get(nkey);
          if (neighbor.walls[theirWall]) {
            neighbor.group.remove(neighbor.walls[theirWall]);
            neighbor.walls[theirWall] = null;
          }
        }
      });
    }

    function ensurePath(gx, gz, radius = 6) {
      for (let dx = -radius; dx <= radius; dx++) {
        for (let dz = -radius; dz <= radius; dz++) {
          if (Math.abs(dx) + Math.abs(dz) > radius) continue;
          addCell(gx+dx, gz+dz);
        }
      }
    }

    // ────────────────────────────── МОНСТР (упрощён) ──────────────────────────────
    let monsterGroup;
    const monsterPos = new THREE.Vector3(0,0,-16);
    function spawnMonster() {
      monsterGroup = new THREE.Group();
      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.4,1.4,6), matMonster);
      torso.position.y = 1.5; monsterGroup.add(torso);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.35,6,4), matMonster);
      head.position.y = 2.4; monsterGroup.add(head);
      monsterGroup.add(monsterGlow);
      monsterGroup.position.copy(monsterPos);
      scene.add(monsterGroup);
    }

    function moveMonster(dt, playerPos, looking) {
      if (!monsterGroup) return 20;
      const speed = looking ? 2.0 : 4.5;
      const dir = playerPos.clone().sub(monsterPos); dir.y = 0;
      const dist = dir.length();
      if (dist < 0.7) return dist;
      dir.normalize();
      monsterPos.add(dir.multiplyScalar(Math.min(speed * dt, dist)));
      monsterGroup.position.copy(monsterPos);
      monsterGroup.lookAt(playerPos.x, 1.5, playerPos.z);
      return dist;
    }

    // ────────────────────────────── ИГРОК ──────────────────────────────
    const player = {
      pos: new THREE.Vector3(0,1.7,0), yaw: 0, pitch: 0,
      stamina: 100, sprint: false, speed: 3.5, dist: 0,
      lastPos: new THREE.Vector3(0,1.7,0)
    };
    let gameStarted = false, gameOver = false, lock = false;
    
    function startGame() {
      gameStarted = true; gameOver = false;
      player.pos.set(0,1.7,0); player.yaw = 0; player.pitch = 0;
      player.stamina = 100; player.dist = 0;
      player.lastPos.copy(player.pos);
      monsterPos.set(0,0,-16);
      if (monsterGroup) { scene.remove(monsterGroup); monsterGroup = null; }
      spawnMonster();
      msgEl.classList.remove('show');
      instrEl.style.opacity = '0';
      // очистить старые клетки (простой способ – перезагрузка страницы лучше, но мы удалим)
      cells.forEach(c => scene.remove(c.group));
      cells.clear();
      ensurePath(0,0,5);
      canvas.requestPointerLock();
    }

    function endGame() {
      gameOver = true; gameStarted = false;
      document.exitPointerLock();
      msgEl.textContent = 'ОН ДОГНАЛ';
      msgEl.classList.add('show');
      instrEl.style.opacity = '1';
      setTimeout(() => { msgEl.classList.remove('show'); }, 2000);
    }

    // ────────────────────────────── УПРАВЛЕНИЕ ──────────────────────────────
    const keys = {};
    window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key === 'Shift') player.sprint = true; });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; if (e.key === 'Shift') player.sprint = false; });
    let mouseX=0, mouseY=0;
    document.addEventListener('mousemove', e => { if (lock) { mouseX += e.movementX; mouseY += e.movementY; } });
    canvas.addEventListener('click', () => { if (!gameStarted) startGame(); else canvas.requestPointerLock(); });
    document.addEventListener('pointerlockchange', () => { lock = document.pointerLockElement === canvas; });

    // ────────────────────────────── VHS (БЫСТРЫЙ) ──────────────────────────────
    const noiseCanvas = document.createElement('canvas');
    noiseCanvas.width = 128; noiseCanvas.height = 128;
    const nctx = noiseCanvas.getContext('2d');
    const noiseData = nctx.createImageData(128,128);
    for (let i=0; i<noiseData.data.length; i+=4) {
      const v = Math.random()*30;
      noiseData.data[i]=v; noiseData.data[i+1]=v; noiseData.data[i+2]=v; noiseData.data[i+3]=15;
    }
    nctx.putImageData(noiseData,0,0);
    
    function drawVHS(glitch) {
      vhsCanvas.width = window.innerWidth; vhsCanvas.height = window.innerHeight;
      const ctx = vhsCanvas;
      ctx.clearRect(0,0,vhsCanvas.width, vhsCanvas.height);
      // шумовая текстура со смещением
      ctx.globalAlpha = 0.08 + glitch*0.1;
      for (let y=0; y<vhsCanvas.height; y+=128) {
        for (let x=0; x<vhsCanvas.width; x+=128) {
          ctx.drawImage(noiseCanvas, x, y);
        }
      }
      // случайные горизонтальные полосы
      if (glitch > 0.1) {
        ctx.globalAlpha = glitch*0.6;
        for (let i=0; i<glitch*5; i++) {
          const y = Math.random()*vhsCanvas.height;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, y, vhsCanvas.width, 2+Math.random()*8);
        }
      }
      ctx.globalAlpha = 1;
    }

    // ────────────────────────────── ГЛАВНЫЙ ЦИКЛ ──────────────────────────────
    let lastCell = {x:0, z:0};
    let glitchAmt = 0;
    
    function loop() {
      requestAnimationFrame(loop);
      const dt = Math.min(0.1, 0.016); // фиксированный небольшой шаг для стабильности
      
      if (gameStarted && !gameOver) {
        // поворот
        player.yaw -= mouseX * 0.002;
        player.pitch -= mouseY * 0.002;
        player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));
        mouseX = 0; mouseY = 0;
        
        // стамина
        if (player.sprint && (keys['w']||keys['arrowup']) && player.stamina > 0) {
          player.stamina -= 18*dt;
          if (player.stamina < 0) player.stamina = 0;
        } else {
          player.stamina = Math.min(100, player.stamina + 12*dt);
        }
        const canSprint = player.sprint && player.stamina > 0 && (keys['w']||keys['arrowup']);
        player.speed = canSprint ? 5.8 : 3.2;
        
        // движение
        const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
        const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
        const move = new THREE.Vector3();
        if (keys['w']||keys['arrowup']) move.add(forward);
        if (keys['s']||keys['arrowdown']) move.sub(forward);
        if (keys['a']||keys['arrowleft']) move.sub(right);
        if (keys['d']||keys['arrowright']) move.add(right);
        if (move.length() > 1) move.normalize();
        player.pos.add(move.multiplyScalar(player.speed*dt));
        player.pos.y = 1.7;
        
        // дистанция
        player.dist += player.pos.distanceTo(player.lastPos);
        player.lastPos.copy(player.pos);
        distEl.textContent = `ДИСТАНЦИЯ: ${Math.floor(player.dist)}м`;
        
        // камера
        camera.position.copy(player.pos);
        camera.rotation.y = player.yaw;
        camera.rotation.x = player.pitch;
        
        // генерация клеток при переходе в новую
        const gx = Math.round(player.pos.x/CELL);
        const gz = Math.round(player.pos.z/CELL);
        if (gx !== lastCell.x || gz !== lastCell.z) {
          ensurePath(gx, gz, 7);
          // удаляем очень далёкие (редко)
          cells.forEach((c, key) => {
            const [cx, cz] = key.split(',').map(Number);
            if (Math.abs(cx-gx)+Math.abs(cz-gz) > 9) {
              scene.remove(c.group);
              cells.delete(key);
            }
          });
          lastCell = {x: gx, z: gz};
        }
        
        // монстр
        const lookDir = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
        const toMonster = monsterPos.clone().sub(player.pos);
        const monsterDist = toMonster.length();
        const looking = toMonster.normalize().dot(lookDir) > 0.4 && monsterDist < 18;
        const newDist = moveMonster(dt, player.pos, looking);
        
        if (newDist < 0.8) endGame();
        
        // эффекты приближения
        glitchAmt = Math.max(0, (7 - newDist) / 7) * 0.5;
        if (newDist < 3) glitchAmt = 0.8;
        monsterGlow.intensity = 1 + Math.max(0, (10-newDist))*0.8;
        
        // свет следит за игроком
        playerLight.position.copy(player.pos).add(new THREE.Vector3(0,2.6,0));
        
        staminaFill.style.width = player.stamina + '%';
      }
      
      drawVHS(glitchAmt);
      renderer.render(scene, camera);
      glitchAmt *= 0.9;
    }

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });

    // начальная загрузка минимальной сцены
    ensurePath(0,0,4);
    spawnMonster();
    monsterPos.set(0,0,-16);
    loop();
  </script>
</body>
</html>
