<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Backrooms: The Chase – Fixed</title>
    <style>
        :root {
            --bg: #000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            cursor: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            height: 100vh;
            width: 100vw;
            touch-action: none;
        }

        #game-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: block;
        }

        #vhs-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            mix-blend-mode: overlay;
            opacity: 0.55;
            background:
                repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.15) 0px, rgba(0, 0, 0, 0.15) 2px, transparent 2px, transparent 4px),
                radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
            animation: scanline-drift 0.1s linear infinite;
        }

        #vhs-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.03) 0px, rgba(255, 255, 255, 0.03) 1px, transparent 1px, transparent 2px);
            animation: flicker 0.05s linear infinite;
        }

        #vhs-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(30, 20, 10, 0.2) 0%, rgba(10, 5, 0, 0.5) 70%, rgba(0, 0, 0, 0.8) 100%);
            animation: chromatic-shift 0.15s ease-in-out infinite;
        }

        #noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            opacity: 0.25;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            background-size: 200px 200px;
            animation: noise-shift 0.08s linear infinite;
        }

        #chroma-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
            opacity: 0.12;
            box-shadow: inset 3px 0 0 rgba(255, 0, 0, 0.15), inset -3px 0 0 rgba(0, 180, 255, 0.15);
            animation: chroma-drift 0.2s ease-in-out infinite;
        }

        #hud {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            color: #c8b87d;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            letter-spacing: 3px;
            text-align: center;
            opacity: 0.7;
            text-shadow: 0 0 10px rgba(200, 180, 120, 0.5);
            animation: hud-pulse 2s ease-in-out infinite;
        }

        #stamina-bar {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        #stamina-fill {
            height: 100%;
            background: #c8b87d;
            transition: width 0.15s;
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(200, 180, 120, 0.6);
        }

        #jumpscare {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
            background: #000;
            opacity: 0;
            transition: opacity 0.08s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #jumpscare.active {
            opacity: 1;
        }
        #jumpscare canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
        }

        #restart-prompt {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 110;
            pointer-events: all;
            color: #ff3333;
            font-family: 'Courier New', monospace;
            font-size: 22px;
            letter-spacing: 4px;
            text-align: center;
            display: none;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            cursor: pointer;
            animation: blink-text 0.8s ease-in-out infinite;
        }
        #restart-prompt.visible {
            display: block;
        }
        #restart-prompt span {
            display: block;
            font-size: 12px;
            margin-top: 10px;
            letter-spacing: 2px;
            color: #aaa;
        }

        @keyframes scanline-drift {
            0% { background-position: 0 0; }
            100% { background-position: 0 4px; }
        }
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            30% { opacity: 0.85; }
            60% { opacity: 1; }
            92% { opacity: 0.7; }
        }
        @keyframes noise-shift {
            0% { background-position: 0 0; }
            25% { background-position: -50px 30px; }
            50% { background-position: 20px -20px; }
            75% { background-position: -30px -40px; }
            100% { background-position: 40px 10px; }
        }
        @keyframes chroma-drift {
            0%, 100% { box-shadow: inset 3px 0 0 rgba(255, 0, 0, 0.15), inset -3px 0 0 rgba(0, 180, 255, 0.15); }
            50% { box-shadow: inset 5px 0 0 rgba(255, 30, 0, 0.2), inset -4px 0 0 rgba(0, 200, 255, 0.18); }
        }
        @keyframes hud-pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 0.4; }
        }
        @keyframes blink-text {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>
    <div id="vhs-overlay"></div>
    <div id="noise-overlay"></div>
    <div id="chroma-overlay"></div>
    <div id="hud">KEEP RUNNING</div>
    <div id="stamina-bar"><div id="stamina-fill" style="width:100%"></div></div>
    <div id="jumpscare"><canvas id="jumpscare-canvas" width="512" height="512"></canvas></div>
    <div id="restart-prompt">YOU DIDN'T ESCAPE<span>click or tap to try again</span></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ─────────────────────────────────────
        // DOM ELEMENTS
        // ─────────────────────────────────────
        const canvas = document.getElementById('game-canvas');
        const hudEl = document.getElementById('hud');
        const staminaFill = document.getElementById('stamina-fill');
        const jumpscareEl = document.getElementById('jumpscare');
        const jumpscareCanvas = document.getElementById('jumpscare-canvas');
        const restartPrompt = document.getElementById('restart-prompt');

        // ─────────────────────────────────────
        // THREE.JS SETUP
        // ─────────────────────────────────────
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1408);
        scene.fog = new THREE.FogExp2(0x1a1408, 0.0002);

        const camera = new THREE.PerspectiveCamera(78, window.innerWidth / window.innerHeight, 0.3, 80);
        camera.position.set(0, 1.55, 0);
        camera.rotation.order = 'YXZ';

        // ─────────────────────────────────────
        // AUDIO SYSTEM
        // ─────────────────────────────────────
        let audioCtx = null;
        let ambientOsc = null;
        let humGain = null;
        let heartbeatOsc = null;
        let heartbeatGain = null;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new(window.AudioContext || window.webkitAudioContext)();
            humGain = audioCtx.createGain();
            humGain.gain.value = 0.09;
            humGain.connect(audioCtx.destination);

            ambientOsc = audioCtx.createOscillator();
            ambientOsc.type = 'sawtooth';
            ambientOsc.frequency.value = 58;
            const humFilter = audioCtx.createBiquadFilter();
            humFilter.type = 'lowpass';
            humFilter.frequency.value = 120;
            humFilter.Q.value = 5;
            ambientOsc.connect(humFilter);
            humFilter.connect(humGain);

            const lfo = audioCtx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.value = 0.3;
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 15;
            lfo.connect(lfoGain);
            lfoGain.connect(humFilter.frequency);
            lfo.start();
            ambientOsc.start();

            heartbeatGain = audioCtx.createGain();
            heartbeatGain.gain.value = 0;
            heartbeatGain.connect(audioCtx.destination);
            heartbeatOsc = audioCtx.createOscillator();
            heartbeatOsc.type = 'sine';
            heartbeatOsc.frequency.value = 40;
            const hbFilter = audioCtx.createBiquadFilter();
            hbFilter.type = 'lowpass';
            hbFilter.frequency.value = 80;
            heartbeatOsc.connect(hbFilter);
            hbFilter.connect(heartbeatGain);
            heartbeatOsc.start();
        }

        function setHeartbeat(intensity) {
            if (!heartbeatGain) return;
            heartbeatGain.gain.value = Math.min(intensity * 0.35, 0.5);
            if (heartbeatOsc && intensity > 0.1) {
                heartbeatOsc.frequency.value = 35 + intensity * 50;
            }
        }

        // ─────────────────────────────────────
        // MONSTER TEXTURES
        // ─────────────────────────────────────
        function createMonsterFaceTexture() {
            const texCanvas = document.createElement('canvas');
            texCanvas.width = 256;
            texCanvas.height = 256;
            const ctx = texCanvas.getContext('2d');
            const skinGrad = ctx.createRadialGradient(128, 110, 20, 128, 128, 160);
            skinGrad.addColorStop(0, '#d4c8b8');
            skinGrad.addColorStop(0.5, '#b8a898');
            skinGrad.addColorStop(0.8, '#6b5b4a');
            skinGrad.addColorStop(1, '#1a1008');
            ctx.fillStyle = skinGrad;
            ctx.fillRect(0, 0, 256, 256);

            ctx.strokeStyle = 'rgba(30,10,10,0.5)';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < 30; i++) {
                ctx.beginPath();
                const sx = 60 + Math.random() * 136;
                const sy = 40 + Math.random() * 140;
                ctx.moveTo(sx, sy);
                ctx.bezierCurveTo(sx + (Math.random() - 0.5) * 60, sy + (Math.random() - 0.5) * 40, sx + (Math.random() -
                    0.5) * 80, sy + (Math.random() - 0.5) * 60, sx + (Math.random() - 0.5) * 50, sy + 30 + Math.random() *
                    50);
                ctx.stroke();
            }

            const drawEyeSocket = (cx, cy, rx, ry) => {
                const socketGrad = ctx.createRadialGradient(cx, cy, rx * 0.3, cx, cy, rx * 1.4);
                socketGrad.addColorStop(0, '#000000');
                socketGrad.addColorStop(0.6, '#0a0505');
                socketGrad.addColorStop(1, 'rgba(60,30,20,0.3)');
                ctx.fillStyle = socketGrad;
                ctx.beginPath();
                ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(80,15,15,0.7)';
                ctx.lineWidth = 2;
                ctx.stroke();
            };
            drawEyeSocket(100, 95, 28, 32);
            drawEyeSocket(160, 90, 30, 34);

            const glintGrad = ctx.createRadialGradient(105, 88, 2, 105, 88, 10);
            glintGrad.addColorStop(0, 'rgba(255,200,150,0.9)');
            glintGrad.addColorStop(1, 'rgba(255,100,50,0)');
            ctx.fillStyle = glintGrad;
            ctx.beginPath();
            ctx.arc(105, 88, 10, 0, Math.PI * 2);
            ctx.fill();
            const glintGrad2 = ctx.createRadialGradient(165, 83, 2, 165, 83, 10);
            glintGrad2.addColorStop(0, 'rgba(255,200,150,0.85)');
            glintGrad2.addColorStop(1, 'rgba(255,100,50,0)');
            ctx.fillStyle = glintGrad2;
            ctx.beginPath();
            ctx.arc(165, 83, 10, 0, Math.PI * 2);
            ctx.fill();

            const mouthGrad = ctx.createLinearGradient(80, 145, 176, 170);
            mouthGrad.addColorStop(0, '#1a0000');
            mouthGrad.addColorStop(0.5, '#3a0000');
            mouthGrad.addColorStop(1, '#0a0000');
            ctx.fillStyle = mouthGrad;
            ctx.beginPath();
            ctx.moveTo(75, 148);
            ctx.quadraticCurveTo(100, 175, 128, 158);
            ctx.quadraticCurveTo(155, 140, 180, 152);
            ctx.quadraticCurveTo(160, 180, 128, 172);
            ctx.quadraticCurveTo(90, 185, 75, 148);
            ctx.fill();

            ctx.fillStyle = '#c8c0b0';
            for (let t = 0; t < 14; t++) {
                const tx = 82 + t * 7.5;
                const ty = 150 + Math.sin(t * 0.7) * 10;
                ctx.beginPath();
                ctx.moveTo(tx - 2, ty - 3);
                ctx.lineTo(tx + 2, ty - 3);
                ctx.lineTo(tx, ty + 5 + Math.random() * 4);
                ctx.fill();
            }

            for (let m = 0; m < 80; m++) {
                ctx.fillStyle = `rgba(${20+Math.random()*40},${10+Math.random()*20},${5+Math.random()*10},0.25)`;
                ctx.beginPath();
                ctx.arc(Math.random() * 256, Math.random() * 256, 3 + Math.random() * 8, 0, Math.PI * 2);
                ctx.fill();
            }
            return new THREE.CanvasTexture(texCanvas);
        }

        function createJumpscareTexture() {
            const jctx = jumpscareCanvas.getContext('2d');
            jctx.fillStyle = '#000';
            jctx.fillRect(0, 0, 512, 512);
            const grad = jctx.createRadialGradient(256, 240, 30, 256, 256, 350);
            grad.addColorStop(0, '#c8b8a0');
            grad.addColorStop(0.4, '#6b5040');
            grad.addColorStop(0.7, '#1a0808');
            grad.addColorStop(1, '#000000');
            jctx.fillStyle = grad;
            jctx.fillRect(0, 0, 512, 512);
            [
                [200, 200],
                [320, 190]
            ].forEach(([ex, ey]) => {
                const eg = jctx.createRadialGradient(ex, ey, 10, ex, ey, 55);
                eg.addColorStop(0, '#000');
                eg.addColorStop(0.7, '#0a0000');
                eg.addColorStop(1, 'rgba(80,20,10,0.6)');
                jctx.fillStyle = eg;
                jctx.beginPath();
                jctx.ellipse(ex, ey, 50, 55, 0, 0, Math.PI * 2);
                jctx.fill();
                jctx.fillStyle = '#ffaa55';
                jctx.beginPath();
                jctx.arc(ex + 8, ey - 6, 8, 0, Math.PI * 2);
                jctx.fill();
            });
            jctx.fillStyle = '#0a0000';
            jctx.beginPath();
            jctx.moveTo(160, 290);
            jctx.quadraticCurveTo(200, 340, 256, 310);
            jctx.quadraticCurveTo(310, 280, 360, 300);
            jctx.quadraticCurveTo(320, 370, 256, 350);
            jctx.quadraticCurveTo(180, 380, 160, 290);
            jctx.fill();
            jctx.fillStyle = '#ddd8cc';
            for (let t = 0; t < 22; t++) {
                const tx = 170 + t * 9;
                jctx.beginPath();
                jctx.moveTo(tx - 3, 300 + Math.sin(t * 0.5) * 10);
                jctx.lineTo(tx + 3, 298 + Math.sin(t * 0.5) * 10);
                jctx.lineTo(tx, 312 + Math.random() * 10);
                jctx.fill();
            }
        }
        createJumpscareTexture();

        // ─────────────────────────────────────
        // MAZE PATH DATA (the core fix)
        // ─────────────────────────────────────
        const CELL_SIZE = 4;
        const pathCells = new Set(); // keys of walkable corridor cells
        const cellDataMap = new Map(); // key -> { hasLight, lightFlickerPhase }

        function cellKey(x, z) { return `${x},${z}`; }

        function isCorridor(x, z) {
            return pathCells.has(cellKey(x, z));
        }

        function addPathCell(x, z, forceLight = false) {
            const key = cellKey(x, z);
            if (pathCells.has(key)) return;
            pathCells.add(key);
            const hasLight = forceLight || Math.random() < 0.55;
            cellDataMap.set(key, {
                hasLight,
                lightFlickerPhase: Math.random() * Math.PI * 2,
            });
        }

        function removePathCell(x, z) {
            const key = cellKey(x, z);
            pathCells.delete(key);
            cellDataMap.delete(key);
        }

        // Extend the path forward from the player's position, creating a narrow corridor
        function extendPathAhead(px, pz, directionX, directionZ) {
            // Always ensure current cell is path
            addPathCell(px, pz, true);
            // Generate a segment of 5-10 cells forward with occasional branches
            let cx = px;
            let cz = pz;
            const steps = 8 + Math.floor(Math.random() * 5);
            for (let i = 0; i < steps; i++) {
                // Bias toward direction but allow slight turns
                const randTurn = Math.random();
                let dx = directionX;
                let dz = directionZ;
                if (randTurn < 0.25) {
                    // perpendicular turn
                    if (Math.random() < 0.5) {
                        dx = -dz;
                        dz = dx === 0 ? (Math.random() < 0.5 ? 1 : -1) : 0;
                    } else {
                        dx = dz;
                        dz = -dx;
                    }
                } else if (randTurn < 0.4 && i > 2) {
                    // small branch: create a side cell
                    const bx = cx + (Math.random() < 0.5 ? -dz : dz);
                    const bz = cz + (Math.random() < 0.5 ? dx : -dx);
                    if (!isCorridor(bx, bz)) {
                        addPathCell(bx, bz);
                        // maybe extend branch one more
                        if (Math.random() < 0.5) {
                            addPathCell(bx + (Math.random() < 0.5 ? 1 : -1), bz);
                            addPathCell(bx, bz + (Math.random() < 0.5 ? 1 : -1));
                        }
                    }
                }
                cx += dx;
                cz += dz;
                addPathCell(cx, cz);
            }
            // Ensure at least a few cells around player to avoid dead ends immediately
            for (let dx = -1; dx <= 1; dx++) {
                for (let dz = -1; dz <= 1; dz++) {
                    if (Math.abs(dx) + Math.abs(dz) <= 1) {
                        addPathCell(px + dx, pz + dz, true);
                    }
                }
            }
        }

        // Prune path cells too far from player to keep memory low
        function pruneDistantCells(playerX, playerZ, maxDist = 30) {
            const toRemove = [];
            for (const key of pathCells) {
                const [x, z] = key.split(',').map(Number);
                if (Math.abs(x - playerX) + Math.abs(z - playerZ) > maxDist) {
                    toRemove.push({ x, z, key });
                }
            }
            for (const { x, z, key } of toRemove) {
                removePathCell(x, z);
            }
        }

        // ─────────────────────────────────────
        // 3D MESH MANAGEMENT
        // ─────────────────────────────────────
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0xc8b07a, roughness: 0.7, metalness: 0.05 });
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0xb8a080, roughness: 0.85, metalness: 0.02 });
        const ceilingMaterial = new THREE.MeshStandardMaterial({ color: 0xe0dcd0, roughness: 0.6, metalness: 0.03 });
        const lightFixtureMaterial = new THREE.MeshStandardMaterial({ color: 0xfafaf5, roughness: 0.3, metalness: 0.4,
            emissive: 0xfffef5, emissiveIntensity: 0.7 });

        const wallGeo = new THREE.PlaneGeometry(CELL_SIZE, 3.2);
        const floorGeo = new THREE.PlaneGeometry(CELL_SIZE, CELL_SIZE);
        const ceilingGeo = new THREE.PlaneGeometry(CELL_SIZE, CELL_SIZE);
        const lightGeo = new THREE.BoxGeometry(1.2, 0.12, 3.2);

        const activeMeshes = new Map();
        const pointLights = [];

        function createCellMeshes(cellX, cellZ) {
            const key = cellKey(cellX, cellZ);
            if (activeMeshes.has(key) || !isCorridor(cellX, cellZ)) return;

            const worldX = cellX * CELL_SIZE;
            const worldZ = cellZ * CELL_SIZE;
            const group = new THREE.Group();
            group.position.set(worldX, 0, worldZ);

            const floor = new THREE.Mesh(floorGeo, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -1.6;
            floor.receiveShadow = true;
            group.add(floor);

            const ceiling = new THREE.Mesh(ceilingGeo, ceilingMaterial);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = 1.65;
            group.add(ceiling);

            const neighbors = {
                north: isCorridor(cellX, cellZ - 1),
                south: isCorridor(cellX, cellZ + 1),
                east: isCorridor(cellX + 1, cellZ),
                west: isCorridor(cellX - 1, cellZ),
            };

            const wallConfigs = [
                { dir: 'north', rotY: 0, posZ: -CELL_SIZE / 2 },
                { dir: 'south', rotY: Math.PI, posZ: CELL_SIZE / 2 },
                { dir: 'east', rotY: Math.PI / 2, posX: CELL_SIZE / 2 },
                { dir: 'west', rotY: -Math.PI / 2, posX: -CELL_SIZE / 2 },
            ];

            for (const cfg of wallConfigs) {
                if (!neighbors[cfg.dir]) {
                    const wall = new THREE.Mesh(wallGeo, wallMaterial);
                    wall.rotation.y = cfg.rotY;
                    wall.position.set(cfg.posX || 0, 0, cfg.posZ || 0);
                    wall.castShadow = true;
                    wall.receiveShadow = true;
                    group.add(wall);
                }
            }

            const cellData = cellDataMap.get(key);
            let pointLight = null;
            if (cellData && cellData.hasLight) {
                const lightFixture = new THREE.Mesh(lightGeo, lightFixtureMaterial);
                lightFixture.position.y = 1.55;
                group.add(lightFixture);

                pointLight = new THREE.PointLight(0xfffbe8, 32, 14, 1.5);
                pointLight.position.set(worldX, 1.4, worldZ);
                pointLight.castShadow = true;
                pointLight.shadow.mapSize.width = 128;
                pointLight.shadow.mapSize.height = 128;
                pointLight.shadow.camera.near = 0.3;
                pointLight.shadow.camera.far = 16;
                pointLight.shadow.bias = -0.005;
                pointLight.userData = {
                    baseIntensity: 32,
                    flickerPhase: cellData.lightFlickerPhase,
                };
                scene.add(pointLight);
                pointLights.push(pointLight);
                group.userData.pointLight = pointLight;
            }

            group.userData.cellX = cellX;
            group.userData.cellZ = cellZ;
            scene.add(group);
            activeMeshes.set(key, group);
        }

        function removeCellMeshes(key) {
            const group = activeMeshes.get(key);
            if (!group) return;
            if (group.userData.pointLight) {
                scene.remove(group.userData.pointLight);
                const idx = pointLights.indexOf(group.userData.pointLight);
                if (idx >= 0) pointLights.splice(idx, 1);
            }
            scene.remove(group);
            activeMeshes.delete(key);
        }

        function updateVisibleMeshes() {
            const radius = 16;
            const desired = new Set();
            for (const key of pathCells) {
                const [x, z] = key.split(',').map(Number);
                if (Math.abs(x - playerGridX) + Math.abs(z - playerGridZ) <= radius) {
                    desired.add(key);
                }
            }
            for (const key of activeMeshes.keys()) {
                if (!desired.has(key)) removeCellMeshes(key);
            }
            for (const key of desired) {
                if (!activeMeshes.has(key)) {
                    const [x, z] = key.split(',').map(Number);
                    createCellMeshes(x, z);
                }
            }
            while (pointLights.length > 70) {
                const old = pointLights.shift();
                scene.remove(old);
            }
        }

        // ─────────────────────────────────────
        // MONSTER CREATION
        // ─────────────────────────────────────
        let monsterGroup = null;

        function createMonster() {
            monsterGroup = new THREE.Group();
            const faceTexture = createMonsterFaceTexture();
            faceTexture.colorSpace = THREE.SRGBColorSpace;
            const skinMaterial = new THREE.MeshStandardMaterial({ map: faceTexture, roughness: 0.5, metalness: 0.05 });
            const darkMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1010, roughness: 0.6, metalness: 0.1 });
            const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0x2a1815, roughness: 0.55, metalness: 0.08 });

            const headGeo = new THREE.SphereGeometry(0.5, 32, 28);
            headGeo.scale(1, 1.2, 0.9);
            const head = new THREE.Mesh(headGeo, skinMaterial);
            head.position.y = 2.15;
            head.castShadow = true;
            monsterGroup.add(head);

            const eyeGlowGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const eyeGlowMat = new THREE.MeshBasicMaterial({ color: 0xff9944 });
            const leftEye = new THREE.Mesh(eyeGlowGeo, eyeGlowMat);
            leftEye.position.set(-0.15, 2.28, -0.38);
            monsterGroup.add(leftEye);
            const rightEye = new THREE.Mesh(eyeGlowGeo, eyeGlowMat);
            rightEye.position.set(0.17, 2.26, -0.38);
            monsterGroup.add(rightEye);

            const torsoGeo = new THREE.CylinderGeometry(0.28, 0.35, 1.3, 16);
            const torso = new THREE.Mesh(torsoGeo, bodyMaterial);
            torso.position.y = 1.1;
            torso.castShadow = true;
            monsterGroup.add(torso);

            const armGeo = new THREE.CylinderGeometry(0.1, 0.13, 1.3, 10);
            const leftArm = new THREE.Mesh(armGeo, darkMaterial);
            leftArm.position.set(-0.45, 1.25, 0);
            leftArm.rotation.z = 0.25;
            leftArm.castShadow = true;
            monsterGroup.add(leftArm);
            const rightArm = new THREE.Mesh(armGeo, darkMaterial);
            rightArm.position.set(0.45, 1.25, 0);
            rightArm.rotation.z = -0.25;
            rightArm.castShadow = true;
            monsterGroup.add(rightArm);

            const legGeo = new THREE.CylinderGeometry(0.12, 0.16, 1.1, 10);
            const leftLeg = new THREE.Mesh(legGeo, darkMaterial);
            leftLeg.position.set(-0.2, 0.3, 0);
            leftLeg.castShadow = true;
            monsterGroup.add(leftLeg);
            const rightLeg = new THREE.Mesh(legGeo, darkMaterial);
            rightLeg.position.set(0.2, 0.3, 0);
            rightLeg.castShadow = true;
            monsterGroup.add(rightLeg);

            scene.add(monsterGroup);
        }

        function updateMonsterPosition() {
            if (!monsterGroup || gameOver) return;
            const wx = monsterGridX * CELL_SIZE;
            const wz = monsterGridZ * CELL_SIZE;
            monsterGroup.position.lerp(new THREE.Vector3(wx, 0, wz), 0.3);
            const playerWX = playerGridX * CELL_SIZE;
            const playerWZ = playerGridZ * CELL_SIZE;
            const angle = Math.atan2(playerWX - wx, playerWZ - wz);
            monsterGroup.rotation.y = angle;
        }

        function updateMonsterAnimation(dt) {
            if (!monsterGroup || gameOver) return;
            const ud = monsterGroup.userData;
            const bob = Math.sin(time * 3.5) * 0.08;
            ud.head.position.y = 2.15 + bob;
            ud.head.rotation.z = Math.sin(time * 2.3) * 0.08;
            ud.head.rotation.x = Math.cos(time * 2.7) * 0.05;
            ud.leftArm.rotation.z = 0.25 + Math.sin(time * 2.5) * 0.2;
            ud.rightArm.rotation.z = -0.25 + Math.cos(time * 2.5) * 0.2;
            const glow = 0.6 + Math.sin(time * 5 + Math.PI) * 0.4;
            ud.leftEye.material.color.setRGB(1, 0.5 + glow * 0.3, 0.15 + glow * 0.2);
            ud.rightEye.material.color.setRGB(1, 0.5 + glow * 0.3, 0.15 + glow * 0.2);
            ud.leftEye.scale.setScalar(0.7 + glow * 0.6);
            ud.rightEye.scale.setScalar(0.7 + glow * 0.6);
        }

        // ─────────────────────────────────────
        // MONSTER AI (BFS on path cells)
        // ─────────────────────────────────────
        function bfsPath(startX, startZ, targetX, targetZ) {
            const visited = new Set();
            const queue = [
                [{ x: startX, z: startZ }]
            ];
            visited.add(cellKey(startX, startZ));
            const maxSteps = 60;
            while (queue.length > 0) {
                const path = queue.shift();
                const current = path[path.length - 1];
                if (current.x === targetX && current.z === targetZ) return path.length > 1 ? path[1] : current;
                if (path.length >= maxSteps) continue;
                const neighbors = [
                    { x: current.x + 1, z: current.z },
                    { x: current.x - 1, z: current.z },
                    { x: current.x, z: current.z + 1 },
                    { x: current.x, z: current.z - 1 },
                ];
                for (let i = neighbors.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [neighbors[i], neighbors[j]] = [neighbors[j], neighbors[i]];
                }
                for (const n of neighbors) {
                    const nk = cellKey(n.x, n.z);
                    if (!visited.has(nk) && isCorridor(n.x, n.z)) {
                        visited.add(nk);
                        queue.push([...path, n]);
                    }
                }
            }
            return null;
        }

        function updateMonsterAI(dt) {
            if (gameOver) return;
            monsterSurgeTimer -= dt;
            monsterSurgeCooldown -= dt;
            let currentSpeed = monsterSpeed;
            if (monsterSurgeTimer > 0) currentSpeed = monsterSpeed * 1.7;
            else if (monsterSurgeCooldown <= 0 && Math.random() < 0.008) {
                monsterSurgeTimer = 1.5 + Math.random() * 2;
                monsterSurgeCooldown = 6 + Math.random() * 8;
            }

            const distToPlayer = Math.abs(monsterGridX - playerGridX) + Math.abs(monsterGridZ - playerGridZ);
            if (distToPlayer <= 1 && Math.random() < 0.35) {
                triggerGameOver();
                return;
            }
            const nextStep = bfsPath(monsterGridX, monsterGridZ, playerGridX, playerGridZ);
            if (nextStep) {
                const wx = monsterGridX * CELL_SIZE;
                const wz = monsterGridZ * CELL_SIZE;
                const targetWX = nextStep.x * CELL_SIZE;
                const targetWZ = nextStep.z * CELL_SIZE;
                const dx = targetWX - wx;
                const dz = targetWZ - wz;
                const dist = Math.sqrt(dx * dx + dz * dz);
                if (dist < 0.15) {
                    monsterGridX = nextStep.x;
                    monsterGridZ = nextStep.z;
                } else {
                    const ratio = Math.min((currentSpeed * dt) / dist, 1);
                    const newWX = wx + dx * ratio;
                    const newWZ = wz + dz * ratio;
                    const newX = Math.round(newWX / CELL_SIZE);
                    const newZ = Math.round(newWZ / CELL_SIZE);
                    if (isCorridor(newX, newZ)) {
                        monsterGridX = newX;
                        monsterGridZ = newZ;
                    }
                }
            }

            const monWX = monsterGridX * CELL_SIZE;
            const monWZ = monsterGridZ * CELL_SIZE;
            const playWX = playerGridX * CELL_SIZE;
            const playWZ = playerGridZ * CELL_SIZE;
            const worldDist = Math.sqrt((monWX - playWX) ** 2 + (monWZ - playWZ) ** 2);
            if (worldDist < 2.2) triggerGameOver();
            setHeartbeat(Math.max(0, 1 - worldDist / 25));
            hudEl.textContent = worldDist < 8 ? "IT'S CLOSE" : worldDist < 16 ? "KEEP RUNNING" : "KEEP MOVING";
            hudEl.style.color = worldDist < 8 ? '#ff6644' : '#c8b87d';
        }

        function triggerGameOver() {
            if (gameOver) return;
            gameOver = true;
            jumpscareEl.classList.add('active');
            restartPrompt.classList.add('visible');
            hudEl.textContent = '';
            staminaFill.style.width = '0%';
            setHeartbeat(0);
            if (audioCtx) {
                const burst = audioCtx.createOscillator();
                const burstGain = audioCtx.createGain();
                burst.type = 'square';
                burst.frequency.value = 80;
                burstGain.gain.setValueAtTime(0.6, audioCtx.currentTime);
                burstGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                burst.connect(burstGain);
                burstGain.connect(audioCtx.destination);
                burst.start();
                burst.stop(audioCtx.currentTime + 0.8);
            }
            setTimeout(() => jumpscareEl.classList.remove('active'), 400);
        }

        function restartGame() {
            gameOver = false;
            gameStarted = true;
            pathCells.clear();
            cellDataMap.clear();
            for (const key of activeMeshes.keys()) removeCellMeshes(key);
            pointLights.length = 0;
            activeMeshes.clear();

            playerGridX = 0;
            playerGridZ = 0;
            stamina = 100;
            isSprinting = false;
            monsterGridX = 0;
            monsterGridZ = -6;
            monsterSurgeTimer = 0;
            monsterSurgeCooldown = 4;
            yaw = 0;
            pitch = -0.05;
            headBobPhase = 0;
            time = 0;

            addPathCell(0, 0, true);
            extendPathAhead(0, 0, 0, -1);
            updateVisibleMeshes();
            if (monsterGroup) monsterGroup.position.set(monsterGridX * CELL_SIZE, 0, monsterGridZ * CELL_SIZE);
            camera.position.set(0, 1.55, 0);
            camera.rotation.set(pitch, yaw, 0);
            jumpscareEl.classList.remove('active');
            restartPrompt.classList.remove('visible');
            hudEl.textContent = 'KEEP RUNNING';
            hudEl.style.color = '#c8b87d';
            staminaFill.style.width = '100%';
            setHeartbeat(0);
        }

        // ─────────────────────────────────────
        // PLAYER MOVEMENT
        // ─────────────────────────────────────
        function updatePlayer(dt) {
            if (gameOver) return;
            if (isSprinting && stamina > 0 && (keys['KeyW'] || keys['ArrowUp'])) {
                stamina = Math.max(0, stamina - 28 * dt);
                if (stamina <= 0) isSprinting = false;
            } else {
                stamina = Math.min(100, stamina + 18 * dt);
                if (stamina >= 15 && keys['ShiftLeft'] && (keys['KeyW'] || keys['ArrowUp'])) isSprinting = true;
                else if (!keys['ShiftLeft'] || !(keys['KeyW'] || keys['ArrowUp'])) isSprinting = false;
            }
            staminaFill.style.width = Math.round(stamina) + '%';
            staminaFill.style.background = stamina < 25 ? '#ff6644' : '#c8b87d';

            const speed = isSprinting ? 12.5 : 7.5;
            const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)).normalize();
            const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)).normalize();

            let moveX = 0,
                moveZ = 0;
            if (keys['KeyW'] || keys['ArrowUp']) { moveX += forward.x;
                moveZ += forward.z; }
            if (keys['KeyS'] || keys['ArrowDown']) { moveX -= forward.x;
                moveZ -= forward.z; }
            if (keys['KeyA'] || keys['ArrowLeft']) { moveX -= right.x;
                moveZ -= right.z; }
            if (keys['KeyD'] || keys['ArrowRight']) { moveX += right.x;
                moveZ += right.z; }

            const len = Math.sqrt(moveX * moveX + moveZ * moveZ);
            if (len > 1) { moveX /= len;
                moveZ /= len; }
            const isMoving = len > 0.1;

            const worldX = playerGridX * CELL_SIZE;
            const worldZ = playerGridZ * CELL_SIZE;
            let newWorldX = worldX + moveX * speed * dt;
            let newWorldZ = worldZ + moveZ * speed * dt;
            let newGridX = Math.round(newWorldX / CELL_SIZE);
            let newGridZ = Math.round(newWorldZ / CELL_SIZE);

            if (!isCorridor(newGridX, newGridZ)) {
                if (isCorridor(newGridX, playerGridZ)) newGridZ = playerGridZ;
                else if (isCorridor(playerGridX, newGridZ)) newGridX = playerGridX;
                else { newGridX = playerGridX;
                    newGridZ = playerGridZ; }
            }
            playerGridX = newGridX;
            playerGridZ = newGridZ;

            if (isMoving) headBobPhase += dt * (isSprinting ? 14 : 10);
            const bobY = isMoving ? Math.sin(headBobPhase) * 0.06 : 0;
            const bobX = isMoving ? Math.cos(headBobPhase * 2) * 0.03 : 0;
            camera.position.set(playerGridX * CELL_SIZE + bobX, 1.55 + bobY, playerGridZ * CELL_SIZE);
            camera.rotation.set(pitch, yaw, 0);

            // Extend path in movement direction
            const moveDirX = isMoving ? Math.round(moveX) : 0;
            const moveDirZ = isMoving ? Math.round(moveZ) : 0;
            if (moveDirX !== 0 || moveDirZ !== 0) {
                extendPathAhead(playerGridX, playerGridZ, moveDirX, moveDirZ);
            } else {
                // ensure current cell is path
                addPathCell(playerGridX, playerGridZ, true);
            }
            pruneDistantCells(playerGridX, playerGridZ, 28);
            updateVisibleMeshes();
        }

        // ─────────────────────────────────────
        // LIGHTING
        // ─────────────────────────────────────
        function setupLighting() {
            const ambient = new THREE.AmbientLight(0x5c4a3a, 1.2);
            scene.add(ambient);
            const fillLight = new THREE.PointLight(0x443820, 18, 25, 2);
            fillLight.position.set(0, 3, 0);
            scene.add(fillLight);
        }

        function updateFlickeringLights(t) {
            for (const pl of pointLights) {
                if (!pl.userData || pl.userData.baseIntensity === undefined) continue;
                const phase = pl.userData.flickerPhase || 0;
                const flicker = 1 + Math.sin(t * 8 + phase) * 0.15 + Math.sin(t * 19 + phase * 1.7) * 0.1 + Math.sin(t * 37 +
                    phase * 2.3) * 0.08;
                const dip = Math.sin(t * 2.1 + phase * 3) > 0.85 ? 0.35 : 1;
                pl.intensity = pl.userData.baseIntensity * Math.max(0.2, flicker * dip);
            }
        }

        // ─────────────────────────────────────
        // INPUT
        // ─────────────────────────────────────
        const keys = {};
        let gameOver = false;
        let gameStarted = false;
        let mouseLocked = false;
        let yaw = 0,
            pitch = -0.05;
        const mouseSensitivity = 0.002;
        let headBobPhase = 0,
            time = 0;
        let playerGridX = 0,
            playerGridZ = 0;
        let stamina = 100;
        let isSprinting = false;
        let monsterGridX = 0,
            monsterGridZ = -6;
        let monsterSpeed = 6.2;
        let monsterSurgeTimer = 0,
            monsterSurgeCooldown = 0;

        function onKeyDown(e) {
            keys[e.code] = true;
            if (!gameStarted && !gameOver) {
                gameStarted = true;
                initAudio();
                extendPathAhead(0, 0, 0, -1);
                updateVisibleMeshes();
            }
            if (gameOver && e.code === 'KeyR') restartGame();
        }

        function onKeyUp(e) { keys[e.code] = false; if (e.code === 'ShiftLeft') isSprinting = false; }

        function onMouseMove(e) {
            if (!mouseLocked || gameOver) return;
            yaw -= e.movementX * mouseSensitivity;
            pitch -= e.movementY * mouseSensitivity;
            pitch = Math.max(-1.2, Math.min(0.5, pitch));
            while (yaw > Math.PI * 2) yaw -= Math.PI * 2;
            while (yaw < -Math.PI * 2) yaw += Math.PI * 2;
        }

        function onMouseDown() {
            if (gameOver) { restartGame(); return; }
            if (!mouseLocked && !gameOver) {
                canvas.requestPointerLock();
                initAudio();
                if (!gameStarted) {
                    gameStarted = true;
                    extendPathAhead(0, 0, 0, -1);
                    updateVisibleMeshes();
                }
            }
        }

        function onPointerLockChange() { mouseLocked = document.pointerLockElement === canvas; }

        function onResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        }

        let touchStartX = 0,
            touchStartY = 0,
            touchActive = false;

        function onTouchStart(e) {
            if (gameOver) { restartGame(); return; }
            initAudio();
            if (!gameStarted) {
                gameStarted = true;
                extendPathAhead(0, 0, 0, -1);
                updateVisibleMeshes();
            }
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchActive = true;
                keys['KeyW'] = true;
            }
            if (e.touches.length === 2) isSprinting = true;
        }

        function onTouchMove(e) {
            if (!touchActive || gameOver) return;
            const dx = e.touches[0].clientX - touchStartX;
            const dy = e.touches[0].clientY - touchStartY;
            yaw -= dx * 0.004;
            pitch -= dy * 0.004;
            pitch = Math.max(-1.2, Math.min(0.5, pitch));
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }

        function onTouchEnd() { touchActive = false;
            keys['KeyW'] = false;
            isSprinting = false; }

        // ─────────────────────────────────────
        // GAME LOOP
        // ─────────────────────────────────────
        const clock = new THREE.Clock();
        let lastPrune = 0;

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            const rawDt = Math.min(clock.getDelta(), 0.15);
            time += rawDt;
            if (!gameOver && gameStarted) {
                updatePlayer(rawDt);
                updateMonsterAI(rawDt);
                updateMonsterPosition();
                updateMonsterAnimation(rawDt);
                updateFlickeringLights(time);
                lastPrune += rawDt;
                if (lastPrune > 1.5) {
                    lastPrune = 0;
                    pruneDistantCells(playerGridX, playerGridZ, 28);
                }
            }
            renderer.render(scene, camera);
            if (!gameOver && gameStarted) {
                const dist = Math.sqrt((monsterGridX - playerGridX) ** 2 + (monsterGridZ - playerGridZ) ** 2) * CELL_SIZE;
                const vhs = Math.max(0.4, Math.min(1, 1 - dist / 30));
                document.getElementById('vhs-overlay').style.opacity = 0.35 + vhs * 0.35;
                document.getElementById('noise-overlay').style.opacity = 0.15 + vhs * 0.25;
                document.getElementById('chroma-overlay').style.opacity = 0.06 + vhs * 0.14;
            }
        }

        // ─────────────────────────────────────
        // INIT
        // ─────────────────────────────────────
        function init() {
            setupLighting();
            createMonster();
            addPathCell(0, 0, true);
            extendPathAhead(0, 0, 0, -1);
            updateVisibleMeshes();
            monsterGroup.position.set(monsterGridX * CELL_SIZE, 0, monsterGridZ * CELL_SIZE);
            camera.position.set(0, 1.55, 0);

            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('keyup', onKeyUp);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mousedown', onMouseDown);
            document.addEventListener('pointerlockchange', onPointerLockChange);
            window.addEventListener('resize', onResize);
            window.addEventListener('touchstart', onTouchStart, { passive: false });
            window.addEventListener('touchmove', onTouchMove, { passive: false });
            window.addEventListener('touchend', onTouchEnd);
            restartPrompt.addEventListener('click', restartGame);
            restartPrompt.addEventListener('touchend', (e) => { e.preventDefault();
                restartGame(); });
            window.addEventListener('contextmenu', e => e.preventDefault());
            gameLoop();
        }

        init();
    </script>
</body>
