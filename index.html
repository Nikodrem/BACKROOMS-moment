<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BACKROOMS – БЕГИ</title>
  <style>
    :root {
      --bg: #0a0502;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: var(--bg);
      overflow: hidden;
      font-family: 'Courier New', monospace;
      touch-action: none;
      cursor: none;
    }
    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #vhs-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      mix-blend-mode: overlay;
    }
    #scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.04) 2px,
        rgba(0, 0, 0, 0.04) 4px
      );
    }
    #vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
      box-shadow: inset 0 0 200px 80px rgba(0, 0, 0, 0.75);
    }
    #hud {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    #stamina-bar {
      width: 220px;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      overflow: hidden;
    }
    #stamina-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff4444, #ffaa44, #44ff44);
      transition: width 0.1s;
    }
    #message-box {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      opacity: 0;
      transition: opacity 0.4s;
    }
    #message-box.show {
      opacity: 1;
    }
    #message-text {
      color: #ffccaa;
      font-size: 2.4rem;
      letter-spacing: 6px;
      text-shadow: 0 0 30px #ff3300, 0 0 60px #aa1100;
      text-align: center;
    }
    #instruction-text {
      color: #eeddcc;
      font-size: 1.2rem;
      letter-spacing: 3px;
      text-shadow: 0 0 15px #cc6600;
      text-align: center;
      line-height: 2;
      transition: opacity 0.6s;
    }
    #distance {
      position: fixed;
      top: 25px;
      right: 30px;
      z-index: 5;
      pointer-events: none;
      color: rgba(255, 200, 150, 0.7);
      font-size: 0.9rem;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="vhs-overlay"></canvas>
  <div id="scanlines"></div>
  <div id="vignette"></div>
  <div id="hud">
    <div id="stamina-bar"><div id="stamina-fill"></div></div>
  </div>
  <div id="message-box">
    <div id="message-text"></div>
    <div id="instruction-text"></div>
  </div>
  <div id="distance">ДИСТАНЦИЯ: 0м</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ======================== ДОМ-ЭЛЕМЕНТЫ ========================
    const canvas = document.getElementById('game');
    const vhsCanvas = document.getElementById('vhs-overlay');
    const ctxVhs = vhsCanvas.getContext('2d');
    const msgText = document.getElementById('message-text');
    const instrText = document.getElementById('instruction-text');
    const msgBox = document.getElementById('message-box');
    const distanceEl = document.getElementById('distance');
    const staminaFill = document.getElementById('stamina-fill');

    // ======================== THREE.JS НАСТРОЙКА ========================
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // ограничиваем для производительности
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = false; // без теней – радикальное ускорение
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.9;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1008'); // тёмно-коричневый, не чёрный
    scene.fog = new THREE.FogExp2('#1a1008', 0.00025);

    const camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.3, 60);
    camera.position.set(0, 1.7, 0);
    camera.rotation.order = 'YXZ';

    // ======================== ПРОЦЕДУРНЫЕ ТЕКСТУРЫ (оптимизированные) ========================
    function createWallTexture() {
      const size = 128;
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#d4b96a';
      ctx.fillRect(0, 0, size, size);
      for (let i = 0; i < 400; i++) {
        ctx.fillStyle = `rgba(180,140,70,${Math.random() * 0.08})`;
        ctx.fillRect(Math.random() * size, Math.random() * size, 3 + Math.random() * 6, 1 + Math.random() * 3);
      }
      return new THREE.CanvasTexture(c);
    }

    function createFloorTexture() {
      const size = 128;
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#6b5c48';
      ctx.fillRect(0, 0, size, size);
      for (let i = 0; i < 1500; i++) {
        const b = 70 + Math.random() * 40;
        ctx.fillStyle = `rgba(${b},${b * 0.8},${b * 0.5},0.06)`;
        ctx.fillRect(Math.random() * size, Math.random() * size, 1.5, 1.5);
      }
      return new THREE.CanvasTexture(c);
    }

    function createCeilingTexture() {
      const size = 64;
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#e8e4d8';
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(c);
    }

    function createMonsterTexture() {
      const size = 256;
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');
      // Базовая тёмная плоть
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#3d1a1a');
      grad.addColorStop(0.5, '#4a2020');
      grad.addColorStop(1, '#2d1010');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);
      // Пятна и бугры
      for (let i = 0; i < 600; i++) {
        const x = Math.random() * size;
        const y = Math.random() * size;
        const r = 3 + Math.random() * 15;
        const spotGrad = ctx.createRadialGradient(x, y, 0, x, y, r);
        spotGrad.addColorStop(0, `rgba(${30+Math.random()*50},${Math.random()*20},${Math.random()*15},0.4)`);
        spotGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = spotGrad;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      // Вены
      ctx.strokeStyle = 'rgba(80,20,20,0.3)';
      ctx.lineWidth = 0.5;
      for (let i = 0; i < 150; i++) {
        ctx.beginPath();
        let sx = Math.random() * size, sy = Math.random() * size;
        ctx.moveTo(sx, sy);
        for (let j = 0; j < 4; j++) {
          sx += (Math.random() - 0.5) * 50;
          sy += (Math.random() - 0.5) * 50;
          ctx.lineTo(sx, sy);
        }
        ctx.stroke();
      }
      return new THREE.CanvasTexture(c);
    }

    // Применяем текстуры с правильным цветовым пространством
    const wallTex = createWallTexture(); wallTex.colorSpace = THREE.SRGBColorSpace;
    const floorTex = createFloorTexture(); floorTex.colorSpace = THREE.SRGBColorSpace;
    floorTex.wrapS = THREE.RepeatWrapping; floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(2, 2);
    const ceilTex = createCeilingTexture(); ceilTex.colorSpace = THREE.SRGBColorSpace;
    ceilTex.wrapS = THREE.RepeatWrapping; ceilTex.wrapT = THREE.RepeatWrapping; ceilTex.repeat.set(2, 2);
    const monsterTex = createMonsterTexture(); monsterTex.colorSpace = THREE.SRGBColorSpace;

    // ======================== МАТЕРИАЛЫ ========================
    const matWall = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.75, metalness: 0.02, color: '#e8d59c' });
    const matFloor = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.9, metalness: 0, color: '#7a6b55' });
    const matCeil = new THREE.MeshStandardMaterial({ map: ceilTex, roughness: 0.8, metalness: 0.03, color: '#e8e2d4' });
    const matMonster = new THREE.MeshStandardMaterial({ map: monsterTex, roughness: 0.4, metalness: 0.05, color: '#cc9988' });

    // ======================== ОСВЕЩЕНИЕ ========================
    const ambientLight = new THREE.AmbientLight('#4a3a2a', 0.6);
    scene.add(ambientLight);
    // Динамический свет, всегда висит над игроком
    const overheadLight = new THREE.PointLight('#fffbe8', 30, 12, 2);
    overheadLight.position.set(0, 2.8, 0);
    scene.add(overheadLight);
    // Слабый свет для монстра (находится в его группе)
    const monsterGlowLight = new THREE.PointLight('#441111', 2, 6, 2);
    monsterGlowLight.position.set(0, 1.6, 0);

    // ======================== СИСТЕМА КОРИДОРОВ (лёгкая и быстрая) ========================
    const CELL_SIZE = 4.0;
    const WALL_HEIGHT = 3.0;
    const WALL_THICK = 0.15;

    const corridorCells = new Map(); // ключ "x,z" → { group, walls: {n,s,e,w} }

    function addCorridorCell(gx, gz) {
      const key = `${gx},${gz}`;
      if (corridorCells.has(key)) return;

      const group = new THREE.Group();
      const wx = gx * CELL_SIZE;
      const wz = gz * CELL_SIZE;

      // Пол
      const floorGeo = new THREE.PlaneGeometry(CELL_SIZE, CELL_SIZE);
      const floor = new THREE.Mesh(floorGeo, matFloor);
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(wx, 0.01, wz);
      group.add(floor);

      // Потолок
      const ceilGeo = new THREE.PlaneGeometry(CELL_SIZE, CELL_SIZE);
      const ceil = new THREE.Mesh(ceilGeo, matCeil);
      ceil.rotation.x = Math.PI / 2;
      ceil.position.set(wx, WALL_HEIGHT, wz);
      group.add(ceil);

      // Функция создания стены
      const createWallMesh = (x, z, rotY) => {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(CELL_SIZE, WALL_HEIGHT, WALL_THICK), matWall);
        mesh.position.set(x, WALL_HEIGHT / 2, z);
        mesh.rotation.y = rotY;
        return mesh;
      };

      // Создаём все четыре стены
      const walls = {
        n: createWallMesh(wx, wz - CELL_SIZE / 2, 0),
        s: createWallMesh(wx, wz + CELL_SIZE / 2, 0),
        e: createWallMesh(wx + CELL_SIZE / 2, wz, Math.PI / 2),
        w: createWallMesh(wx - CELL_SIZE / 2, wz, Math.PI / 2),
      };
      Object.values(walls).forEach(w => group.add(w));

      scene.add(group);
      const cellData = { group, walls };
      corridorCells.set(key, cellData);

      // Удаляем стены, граничащие с уже существующими соседями
      const neighborChecks = [
        { dx: 0, dz: -1, myWall: 'n', theirWall: 's' },
        { dx: 0, dz: 1, myWall: 's', theirWall: 'n' },
        { dx: 1, dz: 0, myWall: 'e', theirWall: 'w' },
        { dx: -1, dz: 0, myWall: 'w', theirWall: 'e' },
      ];
      neighborChecks.forEach(({ dx, dz, myWall, theirWall }) => {
        const nkey = `${gx + dx},${gz + dz}`;
        if (corridorCells.has(nkey)) {
          const neighbor = corridorCells.get(nkey);
          // Удаляем стену у новой клетки
          if (cellData.walls[myWall]) {
            group.remove(cellData.walls[myWall]);
            cellData.walls[myWall] = null;
          }
          // Удаляем стену у соседа
          if (neighbor.walls[theirWall]) {
            neighbor.group.remove(neighbor.walls[theirWall]);
            neighbor.walls[theirWall] = null;
          }
        }
      });
    }

    // Генерация области вокруг координат
    function ensureArea(gx, gz, radius = 7) {
      for (let dx = -radius; dx <= radius; dx++) {
        for (let dz = -radius; dz <= radius; dz++) {
          if (Math.abs(dx) + Math.abs(dz) > radius) continue;
          addCorridorCell(gx + dx, gz + dz);
        }
      }
    }

    // Удаление слишком далёких клеток
    function cleanupFarCells(centerGx, centerGz, keepRadius = 9) {
      const toDelete = [];
      corridorCells.forEach((cell, key) => {
        const [cx, cz] = key.split(',').map(Number);
        if (Math.abs(cx - centerGx) + Math.abs(cz - centerGz) > keepRadius) {
          toDelete.push(key);
        }
      });
      toDelete.forEach(key => {
        const cell = corridorCells.get(key);
        scene.remove(cell.group);
        // Геометрии удалять не нужно, они переиспользуются? лучше не рисковать утечками
        corridorCells.delete(key);
      });
    }

    // ======================== МОНСТР (упрощённая, но жуткая модель) ========================
    let monsterGroup;
    const monsterPos = new THREE.Vector3(0, 0, -16);

    function createMonster() {
      monsterGroup = new THREE.Group();

      // Торс
      const torsoGeo = new THREE.CylinderGeometry(0.35, 0.4, 1.4, 8);
      const torso = new THREE.Mesh(torsoGeo, matMonster);
      torso.position.y = 1.5;
      monsterGroup.add(torso);

      // Голова
      const headGeo = new THREE.SphereGeometry(0.35, 8, 6);
      const head = new THREE.Mesh(headGeo, matMonster);
      head.position.y = 2.4;
      monsterGroup.add(head);

      // Длинные руки
      for (let side = -1; side <= 1; side += 2) {
        const armGeo = new THREE.CylinderGeometry(0.1, 0.12, 1.1, 6);
        const arm = new THREE.Mesh(armGeo, matMonster);
        arm.position.set(side * 0.5, 1.8, 0);
        arm.rotation.z = side * 0.4;
        monsterGroup.add(arm);

        // Кисти с когтями
        const handGeo = new THREE.CylinderGeometry(0.06, 0.08, 0.5, 6);
        const hand = new THREE.Mesh(handGeo, matMonster);
        hand.position.set(side * 0.65, 1.2, 0.2);
        hand.rotation.z = side * 0.7;
        monsterGroup.add(hand);
      }

      // Ноги
      for (let side = -1; side <= 1; side += 2) {
        const legGeo = new THREE.CylinderGeometry(0.12, 0.14, 0.9, 6);
        const leg = new THREE.Mesh(legGeo, matMonster);
        leg.position.set(side * 0.2, 0.8, 0);
        monsterGroup.add(leg);
      }

      monsterGroup.add(monsterGlowLight);
      monsterGroup.position.copy(monsterPos);
      scene.add(monsterGroup);
    }

    // ======================== ИГРОК ========================
    const player = {
      pos: new THREE.Vector3(0, 1.7, 0),
      yaw: 0,
      pitch: 0,
      stamina: 100,
      sprint: false,
      speed: 3.2,
      dist: 0,
      lastPos: new THREE.Vector3(0, 1.7, 0),
    };

    // ======================== СОСТОЯНИЯ ИГРЫ ========================
    let gameStarted = false;
    let gameOver = false;
    let showDeathTimer = null; // для задержки после смерти

    function resetGame() {
      gameStarted = false;
      gameOver = false;
      if (showDeathTimer) clearTimeout(showDeathTimer);
      // Убираем монстра
      if (monsterGroup) {
        scene.remove(monsterGroup);
        monsterGroup = null;
      }
      // Очищаем коридоры
      corridorCells.forEach(cell => scene.remove(cell.group));
      corridorCells.clear();
      // Сбрасываем игрока
      player.pos.set(0, 1.7, 0);
      player.yaw = 0;
      player.pitch = 0;
      player.stamina = 100;
      player.dist = 0;
      player.lastPos.copy(player.pos);
      // Прячем сообщения
      msgBox.classList.remove('show');
      msgText.textContent = '';
      instrText.style.opacity = '0';
      distanceEl.textContent = 'ДИСТАНЦИЯ: 0м';
      // Генерируем начальные коридоры
      ensureArea(0, 0, 5);
      // Создаём монстра далеко
      monsterPos.set(0, 0, -16);
      createMonster();
      // Показываем инструкцию
      instrText.innerHTML = 'КЛИКНИТЕ, ЧТОБЫ НАЧАТЬ<br>WASD – ДВИЖЕНИЕ | SHIFT – БЕГ<br>МЫШЬ – ОБЗОР | ОГЛЯНИТЕСЬ, ЧТОБЫ ЗАМЕДЛИТЬ ЕГО';
      instrText.style.opacity = '1';
      msgBox.classList.add('show');
    }

    function startGame() {
      if (gameStarted || gameOver) return;
      gameStarted = true;
      gameOver = false;
      msgBox.classList.remove('show');
      instrText.style.opacity = '0';
      // Сбрасываем координаты (уже там, но подстрахуем)
      player.pos.set(0, 1.7, 0);
      player.lastPos.copy(player.pos);
      player.yaw = 0;
      player.pitch = 0;
      player.stamina = 100;
      player.dist = 0;
      monsterPos.set(0, 0, -16);
      if (monsterGroup) monsterGroup.position.copy(monsterPos);
      // Захват указателя
      canvas.requestPointerLock();
    }

    function endGame() {
      if (!gameStarted || gameOver) return;
      gameOver = true;
      gameStarted = false;
      document.exitPointerLock();
      msgText.textContent = 'ОН ДОГНАЛ';
      msgBox.classList.add('show');
      instrText.style.opacity = '0';
      // Задержка перед показом инструкции для перезапуска
      if (showDeathTimer) clearTimeout(showDeathTimer);
      showDeathTimer = setTimeout(() => {
        msgText.textContent = '';
        instrText.innerHTML = 'КЛИКНИТЕ, ЧТОБЫ ПОПРОБОВАТЬ СНОВА<br>WASD – ДВИЖЕНИЕ | SHIFT – БЕГ<br>МЫШЬ – ОБЗОР';
        instrText.style.opacity = '1';
        // Ждём клика – сбросим игру
        gameOver = true; // оставляем, чтобы клик перезапустил
      }, 2500);
    }

    // ======================== УПРАВЛЕНИЕ ========================
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === 'Shift') player.sprint = true;
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
      if (e.key === 'Shift') player.sprint = false;
    });

    let mouseDX = 0, mouseDY = 0;
    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement === canvas) {
        mouseDX += e.movementX;
        mouseDY += e.movementY;
      }
    });

    canvas.addEventListener('click', () => {
      if (!gameStarted && !gameOver) {
        startGame();
      } else if (gameOver) {
        resetGame(); // перезапуск после смерти
      } else {
        canvas.requestPointerLock();
      }
    });

    document.addEventListener('pointerlockchange', () => {
      if (document.pointerLockElement !== canvas && gameStarted && !gameOver) {
        // Игра на паузе? Можно ничего не делать
      }
    });

    // ======================== VHS ЭФФЕКТ (БЫСТРЫЙ) ========================
    const noiseCanvas = document.createElement('canvas');
    noiseCanvas.width = 128;
    noiseCanvas.height = 128;
    const nctx = noiseCanvas.getContext('2d');
    const noiseData = nctx.createImageData(128, 128);
    for (let i = 0; i < noiseData.data.length; i += 4) {
      const v = Math.random() * 20;
      noiseData.data[i] = v;
      noiseData.data[i + 1] = v;
      noiseData.data[i + 2] = v;
      noiseData.data[i + 3] = 15;
    }
    nctx.putImageData(noiseData, 0, 0);

    let vhsGlitch = 0;

    function updateVHS() {
      vhsCanvas.width = window.innerWidth;
      vhsCanvas.height = window.innerHeight;
      const ctx = vhsCanvas;
      ctx.clearRect(0, 0, vhsCanvas.width, vhsCanvas.height);

      // Шумовой слой
      ctx.globalAlpha = 0.06 + vhsGlitch * 0.1;
      for (let y = 0; y < vhsCanvas.height; y += 128) {
        for (let x = 0; x < vhsCanvas.width; x += 128) {
          ctx.drawImage(noiseCanvas, x, y);
        }
      }

      // Горизонтальные глитч-полосы
      if (vhsGlitch > 0.1) {
        ctx.globalAlpha = vhsGlitch * 0.5;
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < vhsGlitch * 10; i++) {
          const y = Math.random() * vhsCanvas.height;
          ctx.fillRect(0, y, vhsCanvas.width, 2 + Math.random() * 6);
        }
      }
      ctx.globalAlpha = 1;
    }

    // ======================== ЗВУК (простой гул ламп) ========================
    let audioCtx = null;
    let buzzOsc = null;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const master = audioCtx.createGain();
      master.gain.value = 0.2;
      master.connect(audioCtx.destination);

      buzzOsc = audioCtx.createOscillator();
      buzzOsc.type = 'sawtooth';
      buzzOsc.frequency.value = 58;
      const buzzGain = audioCtx.createGain();
      buzzGain.gain.value = 0.06;
      buzzOsc.connect(buzzGain);
      buzzGain.connect(master);
      buzzOsc.start();

      // Фоновый шум
      const noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() - 0.5) * 0.05;
      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;
      noise.loop = true;
      const noiseGain = audioCtx.createGain();
      noiseGain.gain.value = 0.04;
      noise.connect(noiseGain);
      noiseGain.connect(master);
      noise.start();
    }

    // ======================== ИГРОВОЙ ЦИКЛ ========================
    let lastCell = { x: 0, z: 0 };

    function update(deltaTime) {
      if (!gameStarted || gameOver) {
        // Даже в простое обновляем VHS
        updateVHS();
        return;
      }

      // Ограничим дельту для стабильности
      const dt = Math.min(deltaTime, 0.1);

      // Поворот камеры
      player.yaw -= mouseDX * 0.002;
      player.pitch -= mouseDY * 0.002;
      player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));
      mouseDX = 0;
      mouseDY = 0;

      // Выносливость
      if (player.sprint && (keys['w'] || keys['arrowup']) && player.stamina > 0) {
        player.stamina -= 18 * dt;
        if (player.stamina < 0) player.stamina = 0;
      } else {
        player.stamina = Math.min(100, player.stamina + 15 * dt);
      }
      const canSprint = player.sprint && player.stamina > 0 && (keys['w'] || keys['arrowup']);
      player.speed = canSprint ? 5.8 : 3.2;

      // Движение
      const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
      const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
      const move = new THREE.Vector3(0, 0, 0);
      if (keys['w'] || keys['arrowup']) move.add(forward);
      if (keys['s'] || keys['arrowdown']) move.sub(forward);
      if (keys['a'] || keys['arrowleft']) move.sub(right);
      if (keys['d'] || keys['arrowright']) move.add(right);
      if (move.length() > 1) move.normalize();
      player.pos.add(move.multiplyScalar(player.speed * dt));
      player.pos.y = 1.7;

      // Дистанция
      player.dist += player.pos.distanceTo(player.lastPos);
      player.lastPos.copy(player.pos);
      distanceEl.textContent = `ДИСТАНЦИЯ: ${Math.floor(player.dist)}м`;

      // Обновление камеры
      camera.position.copy(player.pos);
      camera.rotation.y = player.yaw;
      camera.rotation.x = player.pitch;

      // Определяем текущую клетку игрока
      const gx = Math.round(player.pos.x / CELL_SIZE);
      const gz = Math.round(player.pos.z / CELL_SIZE);
      if (gx !== lastCell.x || gz !== lastCell.z) {
        ensureArea(gx, gz, 8);
        cleanupFarCells(gx, gz, 10);
        lastCell = { x: gx, z: gz };
      }

      // Двигаем свет за игроком
      overheadLight.position.set(player.pos.x, player.pos.y + 1.1, player.pos.z);

      // Монстр
      if (!monsterGroup) return;
      const lookDir = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
      const toMonster = monsterPos.clone().sub(player.pos);
      const monsterDist = toMonster.length();
      const playerLooks = toMonster.normalize().dot(lookDir) > 0.4 && monsterDist < 20;

      // Скорость монстра зависит от того, смотрит ли игрок
      const monsterSpeed = playerLooks ? 2.0 : 4.5;
      if (monsterDist > 0.7) {
        const dir = toMonster.clone().normalize();
        monsterPos.add(dir.multiplyScalar(Math.min(monsterSpeed * dt, monsterDist - 0.7)));
        monsterGroup.position.copy(monsterPos);
        // Поворот монстра к игроку
        monsterGroup.lookAt(player.pos.x, 1.5, player.pos.z);
      }

      // Эффекты близости
      vhsGlitch = Math.max(0, (7 - monsterDist) / 7) * 0.6;
      if (monsterDist < 3) vhsGlitch = 0.9;
      monsterGlowLight.intensity = 1.5 + Math.max(0, (10 - monsterDist)) * 1.2;

      // Проверка смерти
      if (monsterDist < 0.8) {
        endGame();
      }

      // Стамина-бар
      staminaFill.style.width = player.stamina + '%';
      if (player.stamina < 30) staminaFill.style.background = '#ff3333';
      else if (player.stamina < 60) staminaFill.style.background = 'linear-gradient(90deg, #ff4444, #ffaa44)';
      else staminaFill.style.background = 'linear-gradient(90deg, #ff4444, #ffaa44, #44ff44)';

      updateVHS();
    }

    function render() {
      renderer.render(scene, camera);
    }

    function gameLoop(timestamp) {
      requestAnimationFrame(gameLoop);
      const delta = 0.016; // фиксированный шаг около 60 FPS для стабильности
      update(delta);
      render();
    }

    // ======================== ЗАПУСК ========================
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });

    // Первоначальная инициализация
    ensureArea(0, 0, 5);
    createMonster();
    // Показываем стартовое сообщение
    instrText.innerHTML = 'КЛИКНИТЕ, ЧТОБЫ НАЧАТЬ<br>WASD – ДВИЖЕНИЕ | SHIFT – БЕГ<br>МЫШЬ – ОБЗОР | ОГЛЯНИТЕСЬ, ЧТОБЫ ЗАМЕДЛИТЬ ЕГО';
    instrText.style.opacity = '1';
    msgBox.classList.add('show');

    // Запуск игрового цикла
    gameLoop();

    // Инициализация звука при первом клике
    canvas.addEventListener('click', initAudio, { once: true });

    console.log('🏃 BACKROOMS – БЕГИ: готова. Кликните для начала.');
  </script>
</body>
