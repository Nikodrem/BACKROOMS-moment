<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>✊ Камень-ножницы-бумага · Liquid Glass</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: rgba(20, 20, 25, 0.7);
      --surface-light: rgba(30, 30, 40, 0.8);
      --primary: #d6336c;
      --primary-glow: rgba(214, 51, 108, 0.5);
      --accent: #f0a0c0;
      --gold: #f5c518;
      --text: #eee;
      --text-muted: #aaa;
      --radius: 20px;
      --shadow: 0 8px 32px rgba(0,0,0,0.6);
      --blur: blur(16px) saturate(180%);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overscroll-behavior: contain;
    }

    .glass-container {
      width: 100%;
      max-width: 500px;
      background: var(--surface);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 2rem 1.5rem;
      box-shadow: var(--shadow), 0 0 20px rgba(214,51,108,0.2);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 2px;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(240,160,192,0.3);
      margin-bottom: 0.25rem;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .btn {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text);
      padding: 0.75rem 1.8rem;
      border-radius: 30px;
      font-weight: 500;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    .btn:hover {
      background: rgba(255,255,255,0.12);
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(214,51,108,0.3);
    }
    .btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
      box-shadow: 0 0 15px var(--primary-glow);
    }
    .btn.primary:hover { background: #c0255a; }
    .btn:disabled { opacity:0.5; pointer-events:none; }

    .input-group {
      display: flex;
      gap: 0.5rem;
    }
    input {
      flex:1;
      padding: 0.7rem 1rem;
      background: rgba(30,30,30,0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus { border-color: var(--primary); }

    .choices {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .choice-btn {
      font-size: 3rem;
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .choice-btn:hover {
      border-color: var(--primary);
      box-shadow: 0 0 20px var(--primary-glow);
      transform: scale(1.05);
    }
    .choice-btn.selected {
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(245,197,24,0.5);
    }
    .choice-btn:disabled { opacity:0.6; pointer-events:none; }

    .status {
      color: var(--text-muted);
      font-size: 1rem;
      margin: 0.3rem 0;
    }
    .result {
      font-size: 1.6rem;
      font-weight: 500;
      min-height: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-shadow: 0 0 8px rgba(0,0,0,0.5);
    }

    .invite-box {
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 0.8rem;
      margin: 0.5rem 0;
      word-break: break-all;
      color: var(--accent);
      font-family: monospace;
      font-size: 0.9rem;
    }
    .copy-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--text-muted);
      padding: 0.3rem 0.8rem;
      border-radius: 15px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.2s;
    }
    .copy-btn:hover { background: rgba(255,255,255,0.1); }

    .scoreboard {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 0.5rem;
    }
    .score-item {
      text-align: center;
    }
    .score-num {
      font-size: 2rem;
      font-weight: 600;
      color: var(--gold);
    }
  </style>
</head>
<body>
<div class="glass-container" id="appRoot">
  <!-- Главное меню -->
  <div id="menuScreen">
    <h1>✊ Камень ✋ Ножницы ✌️ Бумага</h1>
    <p class="subtitle">liquid glass · игра по сети и с ботом</p>
    <button class="btn primary" id="playBotBtn">🤖 Играть с ботом</button>
    <button class="btn" id="playOnlineBtn">🌐 Играть по сети</button>
  </div>

  <!-- Экран онлайн (лобби) -->
  <div id="onlineLobby" style="display:none;">
    <h2>🌐 Сетевая игра</h2>
    <button class="btn" id="createGameBtn">🎮 Создать игру</button>
    <div class="input-group" style="margin-top:1rem;">
      <input type="text" id="joinInput" placeholder="Вставь ID или ссылку">
      <button class="btn" id="joinGameBtn">🔗 Войти</button>
    </div>
    <div id="inviteSection" style="display:none; margin-top:1rem;">
      <p>📨 Пригласи друга:</p>
      <div class="invite-box" id="inviteLink"></div>
      <button class="copy-btn" id="copyBtn">📋 Копировать</button>
      <p style="color:var(--text-muted); margin-top:0.5rem;">ID: <span id="gameId"></span></p>
    </div>
    <div id="connectionStatus" style="margin-top:1rem; color:var(--text-muted);"></div>
    <button class="btn" id="backToMenuFromOnline" style="margin-top:1rem;">← Назад</button>
  </div>

  <!-- Экран игры (общий для бота и сети) -->
  <div id="gameRoom" style="display:none; flex-direction:column; gap:1.5rem;">
    <div class="status" id="gameStatus">Выберите фигуру</div>
    <div class="result" id="roundResult"></div>
    <div class="choices" id="choicesRow">
      <button class="choice-btn" data-choice="rock">✊</button>
      <button class="choice-btn" data-choice="paper">✋</button>
      <button class="choice-btn" data-choice="scissors">✌️</button>
    </div>
    <p style="color:var(--text-muted); font-size:0.9rem;" id="myChoiceText"></p>
    <div class="scoreboard" id="scoreboard" style="display:none;">
      <div class="score-item"><div>Вы</div><div class="score-num" id="playerScore">0</div></div>
      <div class="score-item"><div>Ничья</div><div class="score-num" id="drawScore">0</div></div>
      <div class="score-item"><div id="opponentLabel">Бот</div><div class="score-num" id="opponentScore">0</div></div>
    </div>
    <button class="btn" id="playAgainBtn" style="display:none;">🔄 Ещё раз</button>
    <button class="btn" id="leaveGameBtn">🚪 Выйти</button>
  </div>
</div>

<script>
  (() => {
    // === Экраны ===
    const menuScreen = document.getElementById('menuScreen');
    const onlineLobby = document.getElementById('onlineLobby');
    const gameRoom = document.getElementById('gameRoom');

    // === PeerJS ===
    const peer = new Peer(undefined, {
      host: '0.peerjs.com',
      port: 443,
      secure: true,
      debug: 0
    });

    let conn = null;
    let myId = '';
    let isHost = false;
    let gameMode = null; // 'bot' | 'online'
    let myChoice = null;
    let opponentChoice = null;
    let roundActive = false;

    // Счёт для бота
    let playerScore = 0, botScore = 0, drawScore = 0;

    // DOM онлайн
    const createGameBtn = document.getElementById('createGameBtn');
    const joinGameBtn = document.getElementById('joinGameBtn');
    const joinInput = document.getElementById('joinInput');
    const inviteSection = document.getElementById('inviteSection');
    const inviteLink = document.getElementById('inviteLink');
    const gameIdSpan = document.getElementById('gameId');
    const copyBtn = document.getElementById('copyBtn');
    const connectionStatus = document.getElementById('connectionStatus');

    // DOM игры
    const gameStatus = document.getElementById('gameStatus');
    const roundResult = document.getElementById('roundResult');
    const choicesRow = document.getElementById('choicesRow');
    const myChoiceText = document.getElementById('myChoiceText');
    const playAgainBtn = document.getElementById('playAgainBtn');
    const leaveGameBtn = document.getElementById('leaveGameBtn');
    const scoreboard = document.getElementById('scoreboard');
    const playerScoreEl = document.getElementById('playerScore');
    const drawScoreEl = document.getElementById('drawScore');
    const opponentScoreEl = document.getElementById('opponentScore');
    const opponentLabel = document.getElementById('opponentLabel');

    // === Навигация ===
    document.getElementById('playBotBtn').addEventListener('click', () => startBotGame());
    document.getElementById('playOnlineBtn').addEventListener('click', () => {
      menuScreen.style.display = 'none';
      onlineLobby.style.display = 'block';
    });
    document.getElementById('backToMenuFromOnline').addEventListener('click', resetToMenu);
    leaveGameBtn.addEventListener('click', () => {
      if (gameMode === 'online' && conn) conn.close();
      resetToMenu();
    });

    function resetToMenu() {
      gameMode = null;
      roundActive = false;
      myChoice = null;
      opponentChoice = null;
      if (conn) { conn.close(); conn = null; }
      menuScreen.style.display = 'block';
      onlineLobby.style.display = 'none';
      gameRoom.style.display = 'none';
      createGameBtn.disabled = false;
      joinGameBtn.disabled = false;
      connectionStatus.textContent = '';
      inviteSection.style.display = 'none';
      document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
    }

    // === Бот ===
    function startBotGame() {
      gameMode = 'bot';
      menuScreen.style.display = 'none';
      onlineLobby.style.display = 'none';
      gameRoom.style.display = 'flex';
      scoreboard.style.display = 'flex';
      opponentLabel.textContent = 'Бот';
      playerScore = 0; botScore = 0; drawScore = 0;
      updateScoreboard();
      resetRound();
    }

    function botChoice() {
      const choices = ['rock', 'paper', 'scissors'];
      return choices[Math.floor(Math.random() * 3)];
    }

    // === Онлайн ===
    peer.on('open', (id) => {
      myId = id;
      console.log('Peer ID:', id);
      if (createGameBtn.disabled && !inviteSection.style.display) {
        // мы уже нажали "создать игру", но ID ещё не был готов
        showInviteLink();
      }
    });

    peer.on('connection', (incoming) => {
      if (conn) { incoming.close(); return; }
      conn = incoming;
      setupConnection();
      conn.on('open', () => {
        isHost = true;
        connectionStatus.textContent = '✅ Игрок подключился!';
        startOnlineGame();
        conn.send({ type: 'game-start' });
      });
    });

    peer.on('error', (err) => {
      console.error(err);
      connectionStatus.textContent = '❌ Ошибка: ' + err.message;
    });

    createGameBtn.addEventListener('click', () => {
      isHost = true;
      createGameBtn.disabled = true;
      joinGameBtn.disabled = true;
      if (myId) showInviteLink();
      else {
        // ждём open
        peer.on('open', (id) => {
          myId = id;
          showInviteLink();
        });
      }
      connectionStatus.textContent = '⏳ Ожидание подключения...';
    });

    joinGameBtn.addEventListener('click', () => {
      const raw = joinInput.value.trim();
      if (!raw) return;
      let targetId = raw;
      if (raw.includes('join=')) targetId = raw.split('join=')[1].split('&')[0].trim();
      if (!targetId) return;
      isHost = false;
      connectionStatus.textContent = '⏳ Подключение...';
      if (conn) conn.close();
      conn = peer.connect(targetId, { reliable: true });
      setupConnection();
      conn.on('open', () => {
        connectionStatus.textContent = '✅ Вы подключились!';
      });
      conn.on('error', (err) => {
        connectionStatus.textContent = '❌ Ошибка подключения';
      });
      createGameBtn.disabled = true;
      joinGameBtn.disabled = true;
    });

    function setupConnection() {
      conn.on('data', (data) => {
        if (data.type === 'choice') {
          opponentChoice = data.choice;
          checkRoundResult();
        } else if (data.type === 'game-start') {
          startOnlineGame();
        } else if (data.type === 'reset') {
          resetRound();
        }
      });
      conn.on('close', () => {
        connectionStatus.textContent = '❌ Соединение разорвано';
        resetToMenu();
      });
    }

    function showInviteLink() {
      const url = new URL(window.location.href);
      url.searchParams.set('join', myId);
      inviteLink.textContent = url.toString();
      inviteSection.style.display = 'block';
      gameIdSpan.textContent = myId;
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(url.toString()).then(() => {
          copyBtn.textContent = '✅ Скопировано!';
          setTimeout(() => { copyBtn.textContent = '📋 Копировать'; }, 2000);
        });
      };
    }

    function startOnlineGame() {
      gameMode = 'online';
      onlineLobby.style.display = 'none';
      gameRoom.style.display = 'flex';
      scoreboard.style.display = 'none'; // онлайн без счёта
      opponentLabel.textContent = 'Противник';
      resetRound();
    }

    // === Общая игра ===
    function resetRound() {
      myChoice = null;
      opponentChoice = null;
      roundActive = true;
      roundResult.textContent = '';
      myChoiceText.textContent = 'Выберите фигуру';
      document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
      enableChoices(true);
      playAgainBtn.style.display = 'none';
    }

    function enableChoices(enable) {
      const btns = choicesRow.querySelectorAll('.choice-btn');
      btns.forEach(b => b.disabled = !enable);
    }

    choicesRow.addEventListener('click', (e) => {
      const btn = e.target.closest('.choice-btn');
      if (!btn || !roundActive || myChoice !== null) return;
      const choice = btn.dataset.choice;
      myChoice = choice;
      document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      myChoiceText.textContent = `Вы выбрали: ${getEmoji(choice)}`;
      enableChoices(false);

      if (gameMode === 'bot') {
        // имитируем задержку бота
        gameStatus.textContent = 'Бот думает...';
        setTimeout(() => {
          opponentChoice = botChoice();
          gameStatus.textContent = 'Результат:';
          checkRoundResult();
        }, 800 + Math.random() * 700);
      } else if (gameMode === 'online') {
        gameStatus.textContent = 'Ожидание соперника...';
        if (conn && conn.open) {
          conn.send({ type: 'choice', choice: choice });
        }
        checkRoundResult(); // вдруг уже пришло
      }
    });

    function checkRoundResult() {
      if (!myChoice || !opponentChoice) return;
      roundActive = false;
      const result = determineWinner(myChoice, opponentChoice);
      let resultText = '';
      if (result === 'win') {
        resultText = '🏆 Вы победили!';
        if (gameMode === 'bot') playerScore++;
      } else if (result === 'lose') {
        resultText = '😔 Вы проиграли';
        if (gameMode === 'bot') botScore++;
      } else {
        resultText = '🤝 Ничья';
        if (gameMode === 'bot') drawScore++;
      }
      roundResult.textContent = resultText;
      gameStatus.textContent = 'Раунд завершён';
      if (gameMode === 'bot') updateScoreboard();
      playAgainBtn.style.display = 'inline-block';
      enableChoices(false);
    }

    function determineWinner(a, b) {
      if (a === b) return 'draw';
      if ((a === 'rock' && b === 'scissors') ||
          (a === 'paper' && b === 'rock') ||
          (a === 'scissors' && b === 'paper')) return 'win';
      return 'lose';
    }

    function getEmoji(choice) {
      switch(choice) {
        case 'rock': return '✊';
        case 'paper': return '✋';
        case 'scissors': return '✌️';
        default: return '❓';
      }
    }

    function updateScoreboard() {
      playerScoreEl.textContent = playerScore;
      opponentScoreEl.textContent = botScore;
      drawScoreEl.textContent = drawScore;
    }

    playAgainBtn.addEventListener('click', () => {
      if (gameMode === 'online' && conn && conn.open) {
        conn.send({ type: 'reset' });
      }
      resetRound();
    });

    // Проверка join в URL
    (function checkJoinParam() {
      const urlParams = new URLSearchParams(window.location.search);
      const joinId = urlParams.get('join');
      if (joinId) {
        joinInput.value = joinId;
      }
    })();
  })();
</script>
</body>
</html>
