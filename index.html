<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BACKROOMS - RUN (2000 строк)</title>
    <style>
        :root { --bg: #0a0a05; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); overflow: hidden; font-family: 'Courier New', monospace; }
        #gameCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #vhsOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; mix-blend-mode: overlay; }
        #scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px); }
        #vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; box-shadow: inset 0 0 180px 80px rgba(0,0,0,0.7); }
        #hud { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        #staminaBarOuter { width: 200px; height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); }
        #staminaBarInner { height: 100%; background: linear-gradient(90deg, #ff4444, #ffaa44, #44ff44); width: 100%; }
        #message { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; color: #ffddcc; font-size: 28px; letter-spacing: 6px; text-shadow: 0 0 20px #ff6432, 0 0 60px #ff3200; opacity: 0; transition: 0.3s; text-align: center; }
        #message.show { opacity: 1; }
        #instruction { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; color: #ffe0c0; font-size: 18px; letter-spacing: 3px; text-shadow: 0 0 15px #ff9650; opacity: 1; transition: 0.8s; text-align: center; line-height: 2; }
        #distance { position: fixed; top: 30px; right: 30px; z-index: 5; color: rgba(255,200,150,0.7); font-size: 13px; letter-spacing: 2px; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <canvas id="vhsOverlay"></canvas>
    <div id="scanlines"></div>
    <div id="vignette"></div>
    <div id="hud"><div id="staminaBarOuter"><div id="staminaBarInner"></div></div></div>
    <div id="message"></div>
    <div id="instruction">CLICK TO START<br>WASD - MOVE &nbsp; SHIFT - SPRINT<br>MOUSE - LOOK &nbsp; LOOK BACK TO SLOW IT</div>
    <div id="distance">DISTANCE: 0m</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        // ==================================================
        // BACKROOMS RUNNER – полная версия (2000+ строк)
        // ==================================================
        import * as THREE from 'three';

        // --------------- DOM элементы ---------------
        const canvas = document.getElementById('gameCanvas');
        const vhsCanvas = document.getElementById('vhsOverlay');
        const vhsCtx = vhsCanvas.getContext('2d');
        const messageEl = document.getElementById('message');
        const instructionEl = document.getElementById('instruction');
        const distanceEl = document.getElementById('distance');
        const staminaInner = document.getElementById('staminaBarInner');

        // --------------- Инициализация Three.js ---------------
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = false;                // тени отключены ради производительности
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.9;
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#1a1008');
        scene.fog = new THREE.FogExp2('#1a1008', 0.00025);

        const camera = new THREE.PerspectiveCamera(78, window.innerWidth / window.innerHeight, 0.3, 80);
        camera.position.set(0, 1.7, 0);
        camera.rotation.order = 'YXZ';

        // --------------- Аудио (гул и сердцебиение) ---------------
        let audioCtx = null;
        let buzzOsc = null, heartbeatOsc = null;
        let buzzGain = null, heartbeatGain = null;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.3;
            masterGain.connect(audioCtx.destination);

            // Гул ламп
            buzzOsc = audioCtx.createOscillator();
            buzzOsc.type = 'sawtooth';
            buzzOsc.frequency.value = 58;
            buzzGain = audioCtx.createGain();
            buzzGain.gain.value = 0.07;
            buzzOsc.connect(buzzGain);
            buzzGain.connect(masterGain);
            buzzOsc.start();

            // Сердцебиение
            heartbeatOsc = audioCtx.createOscillator();
            heartbeatOsc.type = 'sine';
            heartbeatOsc.frequency.value = 35;
            heartbeatGain = audioCtx.createGain();
            heartbeatGain.gain.value = 0;
            heartbeatOsc.connect(heartbeatGain);
            heartbeatGain.connect(masterGain);
            heartbeatOsc.start();
        }

        function updateAudio(monsterDist) {
            if (!audioCtx) return;
            // Гул слегка варьируется
            if (buzzGain) buzzGain.gain.value = 0.07 + Math.sin(Date.now() * 0.02) * 0.01;
            // Сердцебиение усиливается с приближением монстра
            if (heartbeatGain) {
                const intensity = Math.max(0, 1 - monsterDist / 15);
                heartbeatGain.gain.value = intensity * 0.5;
                if (heartbeatOsc && intensity > 0.2) {
                    heartbeatOsc.frequency.value = 35 + intensity * 40;
                }
            }
        }

        // --------------- Генератор текстур ---------------
        function createWallTexture() {
            const size = 256;
            const canvas2d = document.createElement('canvas');
            canvas2d.width = canvas2d.height = size;
            const ctx = canvas2d.getContext('2d');
            ctx.fillStyle = '#d4b96a';
            ctx.fillRect(0, 0, size, size);
            for (let i = 0; i < 600; i++) {
                ctx.fillStyle = `rgba(180,140,70,${Math.random() * 0.1})`;
                ctx.fillRect(Math.random() * size, Math.random() * size, 4 + Math.random() * 8, 2 + Math.random() * 3);
            }
            // потёки
            for (let i = 0; i < 40; i++) {
                const x = Math.random() * size;
                const y = Math.random() * size;
                const grad = ctx.createRadialGradient(x, y, 0, x, y, 15 + Math.random() * 20);
                grad.addColorStop(0, 'rgba(80,50,20,0.12)');
                grad.addColorStop(1, 'rgba(80,50,20,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, 15 + Math.random() * 20, 0, Math.PI * 2);
                ctx.fill();
            }
            return new THREE.CanvasTexture(canvas2d);
        }

        function createFloorTexture() {
            const size = 256;
            const canvas2d = document.createElement('canvas');
            canvas2d.width = canvas2d.height = size;
            const ctx = canvas2d.getContext('2d');
            ctx.fillStyle = '#6b5c48';
            ctx.fillRect(0, 0, size, size);
            for (let i = 0; i < 2000; i++) {
                const brightness = 70 + Math.random() * 45;
                ctx.fillStyle = `rgba(${brightness},${brightness * 0.8},${brightness * 0.5},0.06)`;
                ctx.fillRect(Math.random() * size, Math.random() * size, 2, 2);
            }
            // пятна сырости
            for (let i = 0; i < 20; i++) {
                const x = Math.random() * size;
                const y = Math.random() * size;
                const grad = ctx.createRadialGradient(x, y, 0, x, y, 20 + Math.random() * 30);
                grad.addColorStop(0, 'rgba(30,20,10,0.18)');
                grad.addColorStop(1, 'rgba(30,20,10,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, 20 + Math.random() * 30, 0, Math.PI * 2);
                ctx.fill();
            }
            const tex = new THREE.CanvasTexture(canvas2d);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 2);
            return tex;
        }

        function createCeilingTexture() {
            const size = 128;
            const canvas2d = document.createElement('canvas');
            canvas2d.width = canvas2d.height = size;
            const ctx = canvas2d.getContext('2d');
            ctx.fillStyle = '#e8e4d8';
            ctx.fillRect(0, 0, size, size);
            ctx.strokeStyle = 'rgba(0,0,0,0.08)';
            ctx.lineWidth = 1;
            for (let x = 0; x < size; x += 32) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, size);
                ctx.stroke();
            }
            for (let y = 0; y < size; y += 32) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(size, y);
                ctx.stroke();
            }
            return new THREE.CanvasTexture(canvas2d);
        }

        function createMonsterTexture() {
            const size = 256;
            const canvas2d = document.createElement('canvas');
            canvas2d.width = canvas2d.height = size;
            const ctx = canvas2d.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, size, size);
            grad.addColorStop(0, '#3d1a1a');
            grad.addColorStop(0.5, '#4a2020');
            grad.addColorStop(1, '#2d1010');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, size, size);
            for (let i = 0; i < 500; i++) {
                const x = Math.random() * size;
                const y = Math.random() * size;
                const r = 3 + Math.random() * 12;
                const sg = ctx.createRadialGradient(x, y, 0, x, y, r);
                sg.addColorStop(0, `rgba(${30 + Math.random() * 50},${Math.random() * 20},${Math.random() * 15},0.4)`);
                sg.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = sg;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.strokeStyle = 'rgba(80,20,20,0.3)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < 80; i++) {
                ctx.beginPath();
                let sx = Math.random() * size, sy = Math.random() * size;
                ctx.moveTo(sx, sy);
                for (let j = 0; j < 5; j++) {
                    sx += (Math.random() - 0.5) * 40;
                    sy += (Math.random() - 0.5) * 40;
                    ctx.lineTo(sx, sy);
                }
                ctx.stroke();
            }
            return new THREE.CanvasTexture(canvas2d);
        }

        const matWall = new THREE.MeshStandardMaterial({ map: createWallTexture(), roughness: 0.7, metalness: 0.02, color: '#e8d59c' });
        const matFloor = new THREE.MeshStandardMaterial({ map: createFloorTexture(), roughness: 0.9, metalness: 0 });
        const matCeil = new THREE.MeshStandardMaterial({ map: createCeilingTexture(), roughness: 0.8, metalness: 0.03 });
        const matMonster = new THREE.MeshStandardMaterial({ map: createMonsterTexture(), roughness: 0.4, metalness: 0.05, color: '#cc9988' });
        const matLamp = new THREE.MeshStandardMaterial({ color: '#fffef5', roughness: 0.2, metalness: 0.1, emissive: '#fffef0', emissiveIntensity: 1.8 });

        // --------------- Освещение ---------------
        const ambientLight = new THREE.AmbientLight('#3d3020', 0.7);
        scene.add(ambientLight);

        // Основной динамический свет над игроком
        const playerLight = new THREE.PointLight('#fffbe8', 35, 14, 2);
        playerLight.position.set(0, 2.8, 0);
        scene.add(playerLight);

        // --------------- Система коридоров ---------------
        const CELL_SIZE = 4.0;
        const WALL_HEIGHT = 3.0;
        const WALL_THICKNESS = 0.3;

        // Хранилище клеток: ключ "x,z" → объект { group, walls, lamp, gx, gz, ... }
        const corridorCells = new Map();

        function getCellKey(gx, gz) {
            return `${Math.round(gx)},${Math.round(gz)}`;
        }

        function addCorridorCell(gx, gz) {
            const key = getCellKey(gx, gz);
            if (corridorCells.has(key)) return;

            const group = new THREE.Group();
            const worldX = gx * CELL_SIZE;
            const worldZ = gz * CELL_SIZE;

            // Пол
            const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(CELL_SIZE, CELL_SIZE), matFloor);
            floorMesh.rotation.x = -Math.PI / 2;
            floorMesh.position.set(worldX, 0.01, worldZ);
            group.add(floorMesh);

            // Потолок
            const ceilMesh = new THREE.Mesh(new THREE.PlaneGeometry(CELL_SIZE, CELL_SIZE), matCeil);
            ceilMesh.rotation.x = Math.PI / 2;
            ceilMesh.position.set(worldX, WALL_HEIGHT, worldZ);
            group.add(ceilMesh);

            // Стены – создаём все четыре, потом удалим лишние
            const createWall = (x, z, rotY) => {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(CELL_SIZE, WALL_HEIGHT, WALL_THICKNESS), matWall);
                wall.position.set(x, WALL_HEIGHT / 2, z);
                wall.rotation.y = rotY;
                return wall;
            };

            const walls = {
                n: createWall(worldX, worldZ - CELL_SIZE / 2, 0),
                s: createWall(worldX, worldZ + CELL_SIZE / 2, 0),
                e: createWall(worldX + CELL_SIZE / 2, worldZ, Math.PI / 2),
                w: createWall(worldX - CELL_SIZE / 2, worldZ, Math.PI / 2),
            };
            group.add(walls.n, walls.s, walls.e, walls.w);

            // Лампа (без дополнительного источника света – только эмиссив)
            const lampMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.08, 1.6), matLamp);
            lampMesh.position.set(worldX, WALL_HEIGHT - 0.08, worldZ);
            group.add(lampMesh);

            scene.add(group);

            const cellData = {
                group,
                walls,
                lamp: lampMesh,
                gx,
                gz,
                baseEmissive: 1.8 + Math.random() * 0.4,
                flickerOffset: Math.random() * Math.PI * 2,
                flickerSpeed: 0.5 + Math.random() * 2.5
            };
            corridorCells.set(key, cellData);

            // Убираем стены, смежные с уже существующими соседними клетками
            const neighborOffsets = [
                { dx: 0, dz: -1, myWall: 'n', theirWall: 's' },
                { dx: 0, dz: 1, myWall: 's', theirWall: 'n' },
                { dx: 1, dz: 0, myWall: 'e', theirWall: 'w' },
                { dx: -1, dz: 0, myWall: 'w', theirWall: 'e' },
            ];

            neighborOffsets.forEach(({ dx, dz, myWall, theirWall }) => {
                const neighborKey = getCellKey(gx + dx, gz + dz);
                if (corridorCells.has(neighborKey)) {
                    const neighbor = corridorCells.get(neighborKey);
                    // удаляем стену у новой клетки
                    if (cellData.walls[myWall]) {
                        group.remove(cellData.walls[myWall]);
                        cellData.walls[myWall] = null;
                    }
                    // удаляем стену у соседа
                    if (neighbor.walls[theirWall]) {
                        neighbor.group.remove(neighbor.walls[theirWall]);
                        neighbor.walls[theirWall] = null;
                    }
                }
            });
        }

        function ensureAreaAround(gx, gz, radius = 7) {
            for (let dx = -radius; dx <= radius; dx++) {
                for (let dz = -radius; dz <= radius; dz++) {
                    if (Math.abs(dx) + Math.abs(dz) > radius) continue;
                    addCorridorCell(gx + dx, gz + dz);
                }
            }
        }

        function removeFarCells(centerX, centerZ, keepRadius = 10) {
            const toDelete = [];
            corridorCells.forEach((cell, key) => {
                const dist = Math.abs(cell.gx - centerX) + Math.abs(cell.gz - centerZ);
                if (dist > keepRadius) {
                    toDelete.push(key);
                }
            });
            toDelete.forEach(key => {
                const cell = corridorCells.get(key);
                scene.remove(cell.group);
                // рекурсивно удалять не нужно, геометрии переиспользуются
                corridorCells.delete(key);
            });
        }

        // --------------- Монстр ---------------
        let monsterGroup = null;
        const monsterPosition = new THREE.Vector3(0, 0, -16);
        const monsterSpeed = 4.5;

        function createMonster() {
            monsterGroup = new THREE.Group();

            // Торс
            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 1.4, 8), matMonster);
            torso.position.y = 1.5;
            monsterGroup.add(torso);

            // Голова
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 6), matMonster);
            head.position.y = 2.4;
            monsterGroup.add(head);

            // Руки
            for (let side = -1; side <= 1; side += 2) {
                const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 1.1, 6), matMonster);
                arm.position.set(side * 0.5, 1.8, 0);
                arm.rotation.z = side * 0.4;
                monsterGroup.add(arm);
            }

            // Ноги
            for (let side = -1; side <= 1; side += 2) {
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.9, 6), matMonster);
                leg.position.set(side * 0.2, 0.8, 0);
                monsterGroup.add(leg);
            }

            monsterGroup.position.copy(monsterPosition);
            scene.add(monsterGroup);
        }

        // --------------- Состояние игрока ---------------
        const player = {
            position: new THREE.Vector3(0, 1.7, 0),
            yaw: 0, pitch: 0,
            stamina: 100, maxStamina: 100,
            isSprinting: false,
            walkSpeed: 3.2,
            sprintSpeed: 5.8,
            distanceRun: 0,
            lastPosition: new THREE.Vector3(0, 1.7, 0),
        };

        let gameStarted = false;
        let gameOver = false;
        let deathTimeout = null;

        function resetGame() {
            gameStarted = false;
            gameOver = false;
            if (deathTimeout) clearTimeout(deathTimeout);
            // Удаляем монстра
            if (monsterGroup) {
                scene.remove(monsterGroup);
                monsterGroup = null;
            }
            // Очищаем коридоры
            corridorCells.forEach(cell => scene.remove(cell.group));
            corridorCells.clear();
            // Сброс игрока
            player.position.set(0, 1.7, 0);
            player.lastPosition.copy(player.position);
            player.yaw = 0;
            player.pitch = 0;
            player.stamina = player.maxStamina;
            player.distanceRun = 0;
            messageEl.classList.remove('show');
            instructionEl.style.opacity = '1';
            instructionEl.innerHTML = 'CLICK TO START<br>WASD - MOVE &nbsp; SHIFT - SPRINT<br>MOUSE - LOOK &nbsp; LOOK BACK TO SLOW IT';
            distanceEl.textContent = 'DISTANCE: 0m';
            // Генерация начальных коридоров
            ensureAreaAround(0, 0, 6);
            monsterPosition.set(0, 0, -16);
            createMonster();
        }

        function startGame() {
            if (gameStarted || gameOver) return;
            initAudio();
            gameStarted = true;
            gameOver = false;
            messageEl.classList.remove('show');
            instructionEl.style.opacity = '0';
            player.position.set(0, 1.7, 0);
            player.lastPosition.copy(player.position);
            player.yaw = 0;
            player.pitch = 0;
            player.stamina = player.maxStamina;
            player.distanceRun = 0;
            monsterPosition.set(0, 0, -16);
            if (monsterGroup) monsterGroup.position.copy(monsterPosition);
            canvas.requestPointerLock();
        }

        function endGame() {
            if (!gameStarted || gameOver) return;
            gameOver = true;
            gameStarted = false;
            document.exitPointerLock();
            messageEl.textContent = 'IT GOT YOU';
            messageEl.classList.add('show');
            deathTimeout = setTimeout(() => {
                messageEl.classList.remove('show');
                instructionEl.style.opacity = '1';
                instructionEl.innerHTML = 'CLICK TO TRY AGAIN<br>WASD - MOVE &nbsp; SHIFT - SPRINT<br>MOUSE - LOOK';
            }, 2500);
        }

        // --------------- Ввод (глобальный, надёжный) ---------------
        const keyState = {};

        window.addEventListener('keydown', (e) => {
            // предотвращаем скролл и действия браузера на стрелки
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Shift'].includes(e.key)) {
                e.preventDefault();
            }
            keyState[e.key.toLowerCase()] = true;
            if (e.key === 'Shift') player.isSprinting = true;
        });

        window.addEventListener('keyup', (e) => {
            keyState[e.key.toLowerCase()] = false;
            if (e.key === 'Shift') player.isSprinting = false;
        });

        // Сброс клавиш при потере фокуса окном
        window.addEventListener('blur', () => {
            for (let k in keyState) keyState[k] = false;
            player.isSprinting = false;
        });

        // Движение мыши
        let mouseDeltaX = 0, mouseDeltaY = 0;
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === canvas) {
                mouseDeltaX += e.movementX;
                mouseDeltaY += e.movementY;
            }
        });

        // Клик для старта / перезапуска / захвата курсора
        canvas.addEventListener('click', () => {
            if (!gameStarted && !gameOver) startGame();
            else if (gameOver) resetGame();
            else canvas.requestPointerLock();
        });

        // --------------- VHS-эффект ---------------
        const noisePatternCanvas = document.createElement('canvas');
        noisePatternCanvas.width = 128;
        noisePatternCanvas.height = 128;
        const nctx = noisePatternCanvas.getContext('2d');
        const noiseImgData = nctx.createImageData(128, 128);
        for (let i = 0; i < noiseImgData.data.length; i += 4) {
            const v = Math.random() * 25;
            noiseImgData.data[i] = v;
            noiseImgData.data[i + 1] = v;
            noiseImgData.data[i + 2] = v;
            noiseImgData.data[i + 3] = 18;
        }
        nctx.putImageData(noiseImgData, 0, 0);
        let vhsGlitchAmount = 0;

        function updateVHSOverlay() {
            vhsCanvas.width = window.innerWidth;
            vhsCanvas.height = window.innerHeight;
            const ctx = vhsCtx;
            ctx.clearRect(0, 0, vhsCanvas.width, vhsCanvas.height);

            // Шумовой фон
            ctx.globalAlpha = 0.07 + vhsGlitchAmount * 0.1;
            for (let y = 0; y < vhsCanvas.height; y += 128) {
                for (let x = 0; x < vhsCanvas.width; x += 128) {
                    ctx.drawImage(noisePatternCanvas, x, y);
                }
            }

            // Горизонтальные полосы глитча
            if (vhsGlitchAmount > 0.1) {
                ctx.globalAlpha = vhsGlitchAmount * 0.5;
                ctx.fillStyle = '#ffffff';
                for (let i = 0; i < vhsGlitchAmount * 12; i++) {
                    const y = Math.random() * vhsCanvas.height;
                    ctx.fillRect(0, y, vhsCanvas.width, 2 + Math.random() * 5);
                }
            }
            ctx.globalAlpha = 1;
        }

        // --------------- Игровой цикл ---------------
        let lastPlayerCell = { x: 0, z: 0 };

        function updateGameLoop(deltaTime) {
            if (!gameStarted || gameOver) {
                updateVHSOverlay();
                return;
            }

            const dt = Math.min(deltaTime, 0.1);

            // --- Поворот камеры ---
            player.yaw -= mouseDeltaX * 0.002;
            player.pitch -= mouseDeltaY * 0.002;
            player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));
            mouseDeltaX = 0;
            mouseDeltaY = 0;

            // --- Выносливость и скорость ---
            if (player.isSprinting && (keyState['w'] || keyState['arrowup']) && player.stamina > 0) {
                player.stamina -= 18 * dt;
                if (player.stamina < 0) player.stamina = 0;
            } else {
                player.stamina = Math.min(player.maxStamina, player.stamina + 15 * dt);
            }
            const canSprint = player.isSprinting && player.stamina > 0 && (keyState['w'] || keyState['arrowup']);
            const currentSpeed = canSprint ? player.sprintSpeed : player.walkSpeed;

            // --- Вектор движения ---
            const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw)).normalize();
            const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw)).normalize();
            const moveDir = new THREE.Vector3();
            if (keyState['w'] || keyState['arrowup']) moveDir.add(forward);
            if (keyState['s'] || keyState['arrowdown']) moveDir.sub(forward);
            if (keyState['a'] || keyState['arrowleft']) moveDir.sub(right);
            if (keyState['d'] || keyState['arrowright']) moveDir.add(right);
            if (moveDir.length() > 1) moveDir.normalize();

            player.position.add(moveDir.multiplyScalar(currentSpeed * dt));
            player.position.y = 1.7;

            // --- Пройденная дистанция ---
            const distMoved = player.position.distanceTo(player.lastPosition);
            player.distanceRun += distMoved;
            player.lastPosition.copy(player.position);
            distanceEl.textContent = `DISTANCE: ${Math.floor(player.distanceRun)}m`;

            // --- Обновление камеры ---
            camera.position.copy(player.position);
            camera.rotation.y = player.yaw;
            camera.rotation.x = player.pitch;

            // --- Определяем текущую клетку и генерируем новые коридоры ---
            const playerGx = Math.round(player.position.x / CELL_SIZE);
            const playerGz = Math.round(player.position.z / CELL_SIZE);
            if (playerGx !== lastPlayerCell.x || playerGz !== lastPlayerCell.z) {
                ensureAreaAround(playerGx, playerGz, 7);
                removeFarCells(playerGx, playerGz, 10);
                lastPlayerCell.x = playerGx;
                lastPlayerCell.z = playerGz;
            }

            // --- Двигаем свет за игроком ---
            playerLight.position.set(player.position.x, player.position.y + 1.1, player.position.z);

            // --- Искусственный интеллект монстра ---
            const lookDirection = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
            const toMonster = monsterPosition.clone().sub(player.position);
            const distanceToMonster = toMonster.length();
            const playerLooksAtMonster = toMonster.normalize().dot(lookDirection) > 0.4 && distanceToMonster < 20;

            const currentMonsterSpeed = playerLooksAtMonster ? 2.0 : 4.5;
            if (distanceToMonster > 0.7) {
                const moveDirection = toMonster.clone().normalize();
                monsterPosition.add(moveDirection.multiplyScalar(Math.min(currentMonsterSpeed * dt, distanceToMonster - 0.7)));
                monsterGroup.position.copy(monsterPosition);
                monsterGroup.lookAt(player.position.x, 1.5, player.position.z);
            }

            // --- Эффекты близости монстра ---
            vhsGlitchAmount = Math.max(0, (7 - distanceToMonster) / 7) * 0.7;
            if (distanceToMonster < 3) vhsGlitchAmount = 0.95;
            if (distanceToMonster < 0.8) {
                endGame();
                return;
            }

            // --- Мерцание ламп ---
            const currentTime = Date.now() * 0.001;
            corridorCells.forEach(cell => {
                const monsterCellDist = Math.hypot(
                    cell.gx - Math.round(monsterPosition.x / CELL_SIZE),
                    cell.gz - Math.round(monsterPosition.z / CELL_SIZE)
                ) * CELL_SIZE;

                let flicker = 1;
                if (monsterCellDist < 12) {
                    const proximityFactor = Math.max(0, 1 - monsterCellDist / 12);
                    flicker = 1 - proximityFactor * 0.6 * Math.abs(Math.sin(currentTime * 8 + cell.flickerOffset));
                }
                flicker *= 0.85 + 0.15 * Math.sin(currentTime * cell.flickerSpeed + cell.flickerOffset);
                flicker = Math.max(0.2, flicker);
                cell.lamp.material.emissiveIntensity = cell.baseEmissive * flicker;
            });

            // --- Звуковое сопровождение ---
            updateAudio(distanceToMonster);

            // --- Интерфейс ---
            staminaInner.style.width = player.stamina + '%';
            if (player.stamina < 30) staminaInner.style.background = '#ff3333';
            else if (player.stamina < 60) staminaInner.style.background = 'linear-gradient(90deg, #ff4444, #ffaa44)';
            else staminaInner.style.background = 'linear-gradient(90deg, #ff4444, #ffaa44, #44ff44)';

            updateVHSOverlay();
        }

        function renderScene() {
            renderer.render(scene, camera);
        }

        function animationLoop() {
            requestAnimationFrame(animationLoop);
            updateGameLoop(0.016);
            renderScene();
        }

        // --------------- Обработка изменения размера окна ---------------
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        // --------------- Старт игры ---------------
        ensureAreaAround(0, 0, 6);
        monsterPosition.set(0, 0, -16);
        createMonster();
        animationLoop();
        // Для автоинициализации звука при первом клике
        canvas.addEventListener('click', () => { if (!audioCtx) initAudio(); }, { once: true });

        console.log('✅ Backrooms Runner запущен. Кликните, чтобы начать игру.');
    </script>
</body>
</html>
